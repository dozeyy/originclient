# Origin cosmetics service. Deployed by .github/workflows/cosmetics-service.yml
# (setup steps: docs/STORE.md -> Delivery service). Secrets are set in the
# Cloudflare dashboard, never here: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET.
name = "origin-cosmetics"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Every minute: the friends offline sweep (social cleanup every 10th minute).
[triggers]
crons = ["* * * * *"]

# Rate limits on the routes anyone can call without signing in, per caller IP
# (src/index.js LIMITED; docs/SOCIAL.md "Rate limits"). Cloudflare's own
# limiter: counted per Cloudflare location, no database writes. A period is 10
# or 60 seconds. namespace_id is any number unique within the account.
[[ratelimits]]
name = "LIMIT_STORE"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIMIT_LOOKUP"
namespace_id = "7102"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_AUTH"
namespace_id = "7103"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "origin-cosmetics"
# Will's D1 database (Cloudflare -> Storage & Databases -> D1), created 2026-10-12.
database_id = "4f1a0bc1-cdc3-48c9-bd86-e628f03ccb8d"
migrations_dir = "migrations"

# Not secret. While the Stripe key is a TEST key, only these players can buy,
# so fake test cards never hand out real cosmetics. Comma-separated Minecraft
# names or UUIDs. A name counts only for the account that last signed in to
# Origin with it (Friends in the launcher signs in), since the Worker can't ask
# Mojang; a UUID needs no sign-in. With a LIVE key everyone can buy and this
# list does nothing. Edit it HERE: a deploy resets dashboard vars.
[vars]
STRIPE_TEST_PLAYERS = "dozeyy,bxlt,lozeyy,silo5"

# Not secret: the SHA-256 of Will's admin key for making free store codes
# (src/codes.js, tools/store/make-codes.ps1). The key itself lives only on
# Will's PC; to replace it, put the new key's hash here.
CODES_ADMIN_SHA256 = "7b965d4ff01f4f645436fd04709c1568e99d609c465a749a2f81d9e9e928bb5e"
