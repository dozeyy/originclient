# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
# Fabric Loader 0.20.1 = the newest stable on meta.fabricmc.net (2026-10-25), which is what the
# launcher installs and its floor (FabricLoaderFloor), so dev/CI boots match players.
loader_version=0.20.1
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.4.2
maven_group=com.origin

# Dependencies
fabric_api_version=0.116.17+1.21.1

# Performance mods, bundled (jar-in-jar) into the built Origin Client jar so
# installing the one mod brings all of them along. Every pin is a Modrinth VERSION
# ID (unique; a version number can be shared across loaders), read from live
# Modrinth metadata on 2026-10-25 (newest 1.21.1 Fabric build of each).
# Starlight (lighting engine rewrite) is deliberately left out: the official
# spottedleaf build stops at 1.20.4, and the only 1.21.1 port is an unofficial,
# lightly-used fork ("starlight-reloaded") — not worth the stability risk here.
#
# ONE BUILD (2026-10-25, Will: "newer sodium as default"): Sodium 0.8.13 + Iris
# 1.8.14-beta.1. Indium is DROPPED: Sodium 0.8 ships the Fabric Rendering API
# itself and `provides "indium"`. Why 0.8 and not 0.6.13: Voxy needs sodium
# >=0.8.12-alpha.2, Sable / Create Aeronautics and Veil BREAK sodium
# <0.8.12-alpha.2, and Sodium 0.8.13 breaks iris <1.8.13, so the Iris moves with it.
# Iris 1.8.14-beta.1 is the newest (and only) Iris for 1.21.1 on Sodium 0.8.x
# (its fabric.mod.json: depends sodium 0.8.x).
# Sodium mc1.21.1-0.8.13-fabric (release)
sodium_version=SMxNOGZ6
# Lithium mc1.21.1-0.15.4-fabric (newest)
lithium_version=N08Z8wog
# FerriteCore 7.0.3-fabric (newest)
ferritecore_version=sOzRw3CG
# Draw-call optimizations layered on top of the base stack. Both are
# pure-performance with NO visual change: they only batch existing draw calls.
#   ImmediatelyFast — batches immediate-mode HUD/text/item/tooltip rendering
#   ModernFix       — memory + startup + assorted modpack micro-optimizations
# EntityCulling removed 2026-07-10: its 1.10.5 fabric build crashed on init
# with NoClassDefFoundError dev.tr7zw.transition.manager.CodeManager — the
# tr7zw "Transition" core lib it needs is nested inside the EntityCulling jar,
# and Loom's include() does NOT propagate a nested mod's own nested jars onto
# the runClient dev classpath (same class of bug as Iris/Krypton above). The
# shipped launcher jar would get it via recursive JiJ, but it's not worth the
# fragility for an occlusion mod; MoreCulling stays out too (Cloth Config dep +
# a visual leaves-culling change).
# ImmediatelyFast 1.6.15+1.21.1-fabric (newest)
immediatelyfast_version=aLnBqxFW
# ModernFix 5.25.1+mc1.21.1 (newest)
modernfix_version=NnNX8LBn
# Krypton 0.2.8 (newest; NOT bundled, see build.gradle)
krypton_version=Acz3ttTp
# Iris shader loader 1.8.14-beta.1+1.21.1-fabric (newest for 1.21.1; pairs with
# the Sodium 0.8 above). With no shaderpack active Iris adds ~zero overhead.
iris_version=bAo1Qhte
# JEI (Just Enough Items) — item/recipe viewer, bundled jar-in-jar like the perf
# stack. MIT (mezz); the jar carries no LICENSE of its own, so Origin ships the
# notice itself (src/client/resources/licenses/ — MIT requires it).
#
# Pinned by Modrinth VERSION ID: JEI publishes fabric, forge AND neoforge under
# the SAME version_number, so a version-number coordinate is ambiguous.
# 19.51.0.418 (fabric, EO4u1E2G): the newest JEI release for 1.21.1 this module
# can build against. Every JEI from 19.57 on (incl. the 19.64.0.455 release) was
# built with Loom 1.18, which refuses to load in this module's Loom 1.17, and Loom
# 1.18 itself needs a Java 25 Gradle JVM; those builds also nest mezz_config.
jei_version=EO4u1E2G
# Noxesium was evaluated 2026-07-21 and REMOVED: its client entrypoint needs a
# doubly-nested api jar (com.noxcrew.noxesium.api...ServerRule) that Loom's
# include() and modRuntimeOnly both fail to put on the classpath, crashing the
# client. It's a server-companion (MCC Island) mod that does nothing in single-
# player anyway. Revisit only as a launcher-provisioned STANDALONE jar in mods/
# (real Fabric Loader handles the nested jar) if it's ever wanted again.
# Mod Menu (TerraformersMC) — the standard Fabric mods list + config screens; adds
# the "Mods" button to the title screen. Bundled jar-in-jar; needs Fabric API
# (already bundled). Replaces Origin's earlier custom mods-list screen (removed).
modmenu_version=6lgOkclV
# Simple Voice Chat (henkelmax) — proximity voice chat, auto-bundled so it ships with
# the client. Origin adds NO settings for it: all its client controls (push-to-talk /
# voice activation, volume, mic + output device, voice icons, its own menu) live in
# SVC's own GUI (V key) and vanilla Controls -> Voice Chat, and are NOT exposed via a
# public API to mirror. Modrinth version_number for Fabric 1.21.1. NOTE: this bundles
# (redistributes) SVC jar-in-jar like the perf stack — fine for its permissive
# modpack redistribution terms; bump this string when updating SVC.
# 2.6.22 (VS5X7jZd) = the newest RELEASE (2.6.23+ are betas) and the one the
# launcher installs for 1.21.1 (ManagedPins).
svc_version=VS5X7jZd
