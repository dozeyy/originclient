# Origin Client — Fabric build for Minecraft 1.19.2 (covers 1.19–1.19.2).
# Pre-GuiGraphics module: all drawing goes through the Gfx wrapper
# (PoseStack + GuiComponent statics). Forked from staged/1.19.4; pre-1.19.3
# era on top of that (no JOML, no Button.builder, renderButton widgets),
# hence .no-shared-sync. Java 17.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=1.19.2
# 0.20.1 (newest stable on meta.fabricmc.net, 2026-10-25), not 0.19.3 like the other modules:
# the bundled JEI 11.68.0.1086 declares "fabricloader": ">=0.19.4" and refuses to load below it.
# Players get the newest loader at install; a CACHED older loader profile must be reinstalled.
loader_version=0.20.1
loom_version=1.17-SNAPSHOT

mod_version=0.4.2
maven_group=com.origin

fabric_api_version=0.77.0+1.19.2

# JEI (Just Enough Items) — item/recipe viewer, bundled jar-in-jar into the
# 1.19.2 Origin jar (NOT in the launcher catalog, so it ships inside the Origin
# jar). 11.68.0.1086 is the newest STABLE (release) JEI for MC 1.19.2 (fabric);
# 11.68.0.1087-1089 are betas. Pinned by Modrinth version id (XqeAdX1b), not number.
# 11.68 moved UserInput to mezz.jei.common.input, so JeiClientInputHandlerMixin imports
# it from there (javap-checked 2026-10-25; the old pin was 11.8.1.1035, id b6hpbBC6).
# MIT (mezz); notice in THIRD-PARTY-LICENSES.txt.
jei_version=XqeAdX1b
