plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = "originclient-1.21"
}

repositories {
	mavenCentral()

	// Modrinth maven — for the bundled JEI (jar-in-jar). See gradle.properties.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"originclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Dev-only verification switches (mirror 1.21.1): `-Pquickplay="<world>"` drives
	// straight into a world so the JEI runtime mixins (GuiEventHandler /
	// ClientInputHandler) actually load; `-Pmixinexport` dumps post-transform
	// bytecode to run/.mixin.out/ so the injection can be read back, not inferred.
	runs {
		client {
			if (project.hasProperty("quickplay")) {
				programArgs "--quickPlaySingleplayer", project.property("quickplay").toString()
			}
			if (project.hasProperty("mixinexport")) {
				property "mixin.debug.export", "true"
			}
			// `-PframeLog`: the loading -> main menu frame-time log (OriginFrameLog,
			// lines start "[OriginFrameLog]") plus the JVM's own GC pause lines
			// (-Xlog:gc, "[gc]"), both to the console. Loom drops `--args`, so
			// these are the only way to switch them on in a dev run.
			if (project.hasProperty("frameLog")) {
				property "origin.frameLog", "true"
				vmArg "-Xlog:gc:stdout:uptime,level,tags"
			}
			// `-PextraMods=<folder>`: also load every mod jar in that folder (Fabric
			// Loader's fabric.addMods), without copying anything into run/mods.
			// The frame log's "with mods" scenario (tools/frame-log/fetch_mods.py).
			if (project.hasProperty("extraMods")) {
				property "fabric.addMods", file(project.property("extraMods").toString()).absolutePath
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI — item/recipe viewer, bundled jar-in-jar (see gradle.properties). Unlike
	// the perf stack below, JEI is NOT in the launcher's catalog, so it must ship
	// inside the Origin jar via include().
	modImplementation(include("maven.modrinth:jei:${project.jei_version}"))

	// Origin Render (render/terrain, Sodium mixins) compiles against the exact
	// Sodium the launcher installs for 1.21 (PerformanceModCatalog "1.21":
	// mc1.21.1-0.6.13-fabric, Modrinth version id u1OEbNKx -- the same build 1.21.1 ships; it lists
	// MC 1.21 and replaced mc1.21-0.5.11 RncWhTxD on 2026-10-25). compileOnly: never
	// bundled, never on the dev runtime classpath (libs/ above serves runClient).
	modCompileOnly "maven.modrinth:sodium:u1OEbNKx"   // version id: unique, unlike a version number
	// The shader speed-ups (Half-Rate Shadows' Iris mixins; Settings > Performance) compile against
	// the Iris the launcher installs for 1.21 (PerformanceModCatalog: iris-fabric-1.8.8+mc1.21.1,
	// Modrinth version id zsoi0dso, lists MC 1.21; was 1.7.3 kuOV4Ece until 2026-10-25). compileOnly: never bundled; every Iris member the features call at
	// runtime is bound by reflection and fails soft (render/IrisState, HalfRateShadows).
	modCompileOnly "maven.modrinth:iris:zsoi0dso"

	// The perf/shader stack is NOT bundled here — the launcher installs the
	// matching 1.21 stack from PerformanceModCatalog alongside this jar. Only the
	// Origin client itself is in this jar (BundlesPerfStack:false, same model as
	// 1.20.4 / 1.21.11).
	//
	// DEV-ONLY: the same Sodium/Iris jars the launcher installs for 1.21 (see
	// PerformanceModCatalog.Data.cs "1.21" entry), loaded as modRuntimeOnly so
	// `runClient` can exercise the real shader integration before release.
	// modRuntimeOnly = dev/run classpath only; NEVER `include`d, so the shipping
	// jar stays Origin-only. Jars live in libs/ (gitignored); re-fetch from the
	// URLs in the catalog's "1.21" entry. Guarded on .exists() so release/CI
	// builds (no libs/) still run — Loom eagerly checksums modRuntimeOnly files.
	if (file("libs/sodium-fabric-0.6.13+mc1.21.1.jar").exists()) {
		modRuntimeOnly files("libs/sodium-fabric-0.6.13+mc1.21.1.jar")
		modRuntimeOnly files("libs/iris-fabric-1.8.8+mc1.21.1.jar")
	}
	// Iris bundles its GLSL toolchain (anarres jcpp, douira glsl-transformer,
	// antlr4) as jar-in-jar; Loom's include() doesn't propagate a nested mod's
	// own nested jars onto the runClient dev classpath (same dev-only bug the
	// 1.21.1 / 1.20.4 modules document). Versions match the Iris 1.8.x line.
	// Dev-runtime only — a real launcher install extracts these from Iris's jar.
	runtimeOnly "org.anarres:jcpp:1.4.14"
	runtimeOnly "io.github.douira:glsl-transformer:2.0.1"
	runtimeOnly "org.antlr:antlr4-runtime:4.13.1"

	// WebP preview decoding for the shader browser (fail-soft if absent).
	implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-core:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-metadata:3.12.0"
	include "com.twelvemonkeys.common:common-lang:3.12.0"
	include "com.twelvemonkeys.common:common-io:3.12.0"
	include "com.twelvemonkeys.common:common-image:3.12.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// MC 1.21 runs on Java 21.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_originclient" }
	}
	// Notices for the bundled JEI (MIT; its jar carries no LICENSE of its own).
	from("THIRD-PARTY-LICENSES.txt")
}

// `.\gradlew.bat prodClient -PextraMods=<folder>`: the BUILT jar (remapJar, with its
// jar-in-jar stack) in a production Fabric game, i.e. the intermediary namespace a
// real instance runs in, plus every jar in that folder. Copied from 1.21.1 for
// dev-shots `set=stepaside` (Origin stepping aside needs a real player mod such as
// Freecam loaded: tools/frame-log/mods-<module>-stepaside.json) and the "with mods"
// frame log. The folder must bring its own Fabric API (a player's instance does).
// Game dir run-prod/, so nothing from the dev run's run/mods leaks in. CI only.
tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "origin"
	description = "Runs the built Origin jar + -PextraMods=<folder> in a production Fabric client (run-prod/)."
	mods.from(tasks.named("remapJar"))
	if (project.hasProperty("extraMods")) {
		mods.from(fileTree(project.property("extraMods").toString()) { include "*.jar" })
	}
	runDir = file("run-prod")
	if (project.hasProperty("frameLog")) {
		jvmArgs.add("-Dorigin.frameLog=true")
		jvmArgs.add("-Xlog:gc:stdout:uptime,level,tags")
	}
}
