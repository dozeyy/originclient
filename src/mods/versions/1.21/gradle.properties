# Origin Client — Fabric build for Minecraft 1.21 (the base 1.21 release, the
# same pre-1.21.2-blit-rework GUI API family as 1.21.1). Separate module from
# mods/versions/1.21.1 (1.21.1) because 1.21 needs its own mapped build + the
# standalone install model (1.21's perf/shader stack differs from 1.21.1's —
# Sodium mc1.21-0.5.11 until 2026-10-25, now the same 0.6.13 as 1.21.1). Shares the 1.21.1 source
# byte-for-byte: 1.21 and 1.21.1 use the identical old GuiGraphics.blit
# signature, so no render-layer changes. Java 21.
#
# Install model = 1.20.4 (BundlesPerfStack:false): the jar carries only the
# Origin client; the launcher installs the matching 1.21 perf/shader stack
# (Sodium/Iris/Lithium/FerriteCore/Krypton) standalone from
# PerformanceModCatalog. The 1.21 catalog entry is already Full, so shaders are
# ready — this module adds the Origin menus.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=1.21
# Fabric Loader 0.20.1 = the newest stable on meta.fabricmc.net (2026-10-25), which is what the
# launcher installs and its floor (FabricLoaderFloor), so dev/CI boots match players.
loader_version=0.20.1
loom_version=1.17-SNAPSHOT

mod_version=0.4.2
maven_group=com.origin

# Fabric API for 1.21. Confirm the exact newest 1.21 build on
# fabricmc.net/develop; CI (real MC 1.21) will flag a bad pin. Only affects
# compile + dev runClient — the shipped jar declares fabric-api:*.
# (0.102.1+1.21 was rejected by the runner — that number is the +1.21.1 fork
# point; 0.102.0+1.21 is the last +1.21 build.)
fabric_api_version=0.102.0+1.21

# JEI (Just Enough Items) — item/recipe viewer, bundled jar-in-jar into the 1.21
# Origin jar (unlike the perf stack, JEI is NOT in the launcher's catalog, so it
# must ship inside the Origin jar). 19.39.0.372 (Modrinth fabric version id
# NLrbFQDk, 2026-10-25; was 19.27.0.340) is the NEWEST JEI that still runs on
# MC 1.21: it needs fabric-api >=0.102.0+1.21 (this module's pin) and no minecraft
# hard-depend; every later 19.x needs fabric-api >=0.116.5+1.21.1, which has no
# MC 1.21 build. The toggle mixins' targets were re-read from this jar with javap
# (2026-10-25, same signatures). MIT (mezz); the notice ships in
# THIRD-PARTY-LICENSES.txt. Pinned by version ID, not number: JEI publishes
# fabric/forge/neoforge under one version_number.
jei_version=NLrbFQDk
