# Origin Client — Fabric build for Minecraft 1.17.1 (covers 1.17–1.17.1).
# Pre-GuiGraphics module: all drawing goes through the Gfx wrapper
# (PoseStack + GuiComponent statics). Forked from staged/1.18.2; 1.17 sky/
# overlay era on top of that (red Mojang-studios LoadingOverlay, 1.17 sky
# render args), hence .no-shared-sync. Java 16.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=1.17.1
# Fabric Loader 0.20.1 = the newest stable on meta.fabricmc.net (2026-10-25), which is what the
# launcher installs and its floor (FabricLoaderFloor), so dev/CI boots match players.
loader_version=0.20.1
loom_version=1.17-SNAPSHOT

mod_version=0.4.2
maven_group=com.origin

fabric_api_version=0.46.1+1.17
