# Origin Client — Fabric build for Minecraft 26.3 (Java 25, unobfuscated,
# extract/submit GUI). Derived from the 26.2 module on 2026-10-13 (see
# src/mods/docs/PORTING-ERA-NOTES.md "26.x era"); 26.3 has no patch releases
# (26.3.x) as of 2026-10-13, so this jar covers exactly 26.3.
#
# Install model matches 26.2: the Origin jar carries the Origin client (+ JEI
# jar-in-jar); the launcher installs the matching 26.3 perf/shader stack (Sodium,
# Iris, Lithium, FerriteCore) standalone from PerformanceModCatalog alongside it.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# check these on https://fabricmc.net/develop
minecraft_version=26.3
# Fabric Loader 0.20.1 = the newest stable on meta.fabricmc.net (2026-10-25), which is what the
# launcher installs (CmlLib FabricInstaller takes the first loader meta lists), so dev/CI boots match players.
loader_version=0.20.1
# 26.x is UNOBFUSCATED — Mojang ships the game with its real names (and param
# names), so there are NO obfuscation maps and build.gradle carries no
# `mappings` line (see the Fabric "Porting to 26.1" guide + fabric-example-mod
# @26.1). The names in the jar ARE the mojmap names the 1.20/1.21 modules used,
# so this module's source keeps the same imports — only changed API *shapes*
# (the RenderPipeline/Matrix3x2fStack era) need porting. Loom must be the new
# `net.fabricmc.fabric-loom` plugin; 1.17-SNAPSHOT tracks the 26.x era.
loom_version=1.17-SNAPSHOT

mod_version=0.4.2
maven_group=com.origin

# Fabric API for 26.3: the newest RELEASE build (checked 2026-10-25).
# The shipped jar declares fabric-api:* -- this pin only affects compile + dev
# runClient; the launcher installs the newest 26.3 build.
fabric_api_version=0.165.0+26.3

# JEI (Just Enough Items) for 26.3, bundled jar-in-jar like 26.2. 31.17.0.93 (Modrinth id
# b6JCG7a3) is the newest 26.3 build (2026-10-25 "newer everything" bump; JEI publishes it
# as beta, the newest release is the older 31.14.0.72 = Zebwcvua). Pinned by Modrinth
# version id, not number. javap-checked 2026-10-25: every method JeiGuiEventHandlerMixin /
# JeiClientInputHandlerMixin inject into (GuiEventHandler.drawForScreen*/
# renderCompactPotionIndicators, ClientInputHandler.onKeyboard*/onGuiMouse*) and UserInput
# keep the exact descriptors of 31.14.0.72. Nested mezz_config 0.6.6 declares minecraft 26.3.
jei_version=b6JCG7a3
