plugins {
	// 26.x uses the renamed Loom plugin id (net.fabricmc.fabric-loom), required
	// for the unobfuscated build path — see the Fabric "Porting to 26.1" guide.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = "originclient-26.3"
}

repositories {
	mavenCentral()

	// Modrinth maven — for the bundled JEI (jar-in-jar). See gradle.properties.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"originclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Dev-only switches, same as 1.21.11: `-Pquickplay="<world>"` drives straight
	// into a world; `-Pmixinexport` dumps post-transform bytecode to run/.mixin.out/.
	runs {
		client {
			// `-PextraMods=<folder>`: also load every mod jar in that folder (Fabric
			// Loader's fabric.addMods), without copying anything into run/mods.
			// boot-smoke `companions=true` uses it to boot the launcher's catalog pins
			// (tools/ci/companion_mods.py).
			if (project.hasProperty("extraMods")) {
				property "fabric.addMods", file(project.property("extraMods").toString()).absolutePath
			}
			if (project.hasProperty("quickplay")) {
				programArgs "--quickPlaySingleplayer", project.property("quickplay").toString()
			}
			if (project.hasProperty("mixinexport")) {
				property "mixin.debug.export", "true"
			}
			// `-PframeLog`: the loading -> main menu frame-time log (OriginFrameLog,
			// lines start "[OriginFrameLog]") plus the JVM's own GC pause lines
			// (-Xlog:gc, "[gc]"), both to the console. Loom drops `--args`, so
			// these are the only way to switch them on in a dev run.
			if (project.hasProperty("frameLog")) {
				property "origin.frameLog", "true"
				vmArg "-Xlog:gc:stdout:uptime,level,tags"
			}
			// The launcher's JVM preset (Core/Launch/JvmArgPresets.cs, Aikar's flags),
			// so every dev run / dev-shots boot proves Java 25 still accepts each flag
			// (an expired -XX option stops the JVM before the game starts).
			vmArgs "-XX:+UseG1GC", "-XX:+ParallelRefProcEnabled", "-XX:MaxGCPauseMillis=200",
					"-XX:+UnlockExperimentalVMOptions", "-XX:+DisableExplicitGC", "-XX:G1NewSizePercent=30",
					"-XX:G1MaxNewSizePercent=40", "-XX:G1HeapRegionSize=8M", "-XX:G1ReservePercent=20",
					"-XX:G1HeapWastePercent=5", "-XX:G1MixedGCCountTarget=4", "-XX:InitiatingHeapOccupancyPercent=15",
					"-XX:G1MixedGCLiveThresholdPercent=90", "-XX:G1RSetUpdatingPauseTimePercent=5",
					"-XX:SurvivorRatio=32", "-XX:+PerfDisableSharedMem", "-XX:MaxTenuringThreshold=1"
			if (project.hasProperty("panoramacapture")) {
				property "origin.panoramacapture", "true"
				vmArg "-Xmx4G"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// NO `mappings` line: 26.x is unobfuscated (real Mojang names ship in the
	// jar), so Loom needs none — officialMojangMappings() would fail because
	// Mojang publishes no client_mappings for 26.x.
	//
	// Plain `implementation` (not modImplementation): with nothing to remap,
	// the 26.x toolchain drops the mod-remapping configurations.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI — item/recipe viewer, bundled jar-in-jar like 26.2 (JEI is not in
	// the launcher's catalog, so it ships inside the Origin jar).
	implementation(include("maven.modrinth:jei:${project.jei_version}"))

	// The perf/shader stack (Sodium, Iris, Lithium, FerriteCore) is NOT bundled
	// here — the launcher installs the matching 26.3 stack from its
	// PerformanceModCatalog alongside this jar (BundlesPerfStack:false, the
	// 1.21.11 model). Only the Origin client itself ships in this jar.
	//
	// compileOnly: the shader speed-ups (render/ShadowCasterLimit, OffMapShadows, HalfRateShadows,
	// ShadowTerrainStats) mix into Sodium/Iris classes, so they compile against the EXACT jars the
	// launcher installs for 26.3 (PerformanceModCatalog.Data.cs: Sodium bAZQdGpg = 0.9.2+mc26.3,
	// Iris vTN4NRGW = 1.11.7+mc26.3). Never include(): the launcher ships them, not this jar.
	// runtimeOnly (DEV ONLY, never in the built jar): runClient / dev-shots / boot-smoke load the same
	// pair, so every @Pseudo Sodium/Iris mixin really applies in CI (26.x has no modRuntimeOnly
	// configuration, so tools/ci/perf_libs.py's libs/ route does not exist here; dev-shots sees these
	// two lines and passes --require-loaded). Iris nests its GLSL toolchain jar-in-jar, which a dev
	// classpath does not unpack: the three runtimeOnly libs below are exactly the versions
	// iris-fabric-1.11.7+mc26.3.jar's META-INF/jars/ carries (read from the jar 2026-10-20), non-transitive
	// because those three nested jars ARE the whole set (their POMs would drag in the antlr4 tool + icu4j).
	compileOnly "maven.modrinth:sodium:bAZQdGpg"
	compileOnly "maven.modrinth:iris:vTN4NRGW"
	runtimeOnly "maven.modrinth:sodium:bAZQdGpg"
	runtimeOnly "maven.modrinth:iris:vTN4NRGW"
	runtimeOnly("org.anarres:jcpp:1.4.14") { transitive = false }
	runtimeOnly("io.github.douira:glsl-transformer:3.0.0-pre3") { transitive = false }
	runtimeOnly("org.antlr:antlr4-runtime:4.13.1") { transitive = false }

	// WebP preview decoding for the shader browser (fail-soft if the reader is
	// absent). implementation = compile + dev classpath; include = jar-in-jar.
	implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-core:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-metadata:3.12.0"
	include "com.twelvemonkeys.common:common-lang:3.12.0"
	include "com.twelvemonkeys.common:common-io:3.12.0"
	include "com.twelvemonkeys.common:common-image:3.12.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// MC 26.3 runs on Java 25. The toolchain is auto-provisioned (Foojay resolver in
// settings.gradle) if a JDK 25 isn't already present; CI sets up JDK 25 for this
// module (the "java" field in src/mods/live-modules.json).
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Show every compile error in one pass (CI is the only place this builds).
	it.options.compilerArgs += ["-Xmaxerrs", "100000"]
}

jar {
	from("LICENSE") {
		rename { "${it}_originclient" }
	}
	// Notices for the bundled JEI (MIT; its jar carries no LICENSE of its own).
	from("THIRD-PARTY-LICENSES.txt")
}

// PORTING AID (26.x): when api-dump.txt sits next to this file AND the dev-shots
// harness is running (ORIGIN_SHOTS set), write `javap -p` SIGNATURES (no code) of
// the classes under the listed package prefixes to $ORIGIN_SHOTS/screenshots/api/,
// plus a class index. The cloud sandbox can't download Minecraft, so this is how a
// porter reads 26.x's API. Delete api-dump.txt once a port is done — the hook is
// inert without it.
def apiDumpList = file("api-dump.txt")
if (apiDumpList.exists() && System.getenv("ORIGIN_SHOTS")) {
	tasks.register("originApiDump") {
		doLast {
			def out = new File(System.getenv("ORIGIN_SHOTS"), "screenshots/api")
			out.mkdirs()
			def prefixes = apiDumpList.readLines().collect { it.trim() }.findAll { it && !it.startsWith("#") }
			def cp = configurations.clientCompileClasspath.files.findAll { it.name.endsWith(".jar") }
			def javap = new File(System.getProperty("java.home"), "bin/javap").absolutePath
			def picked = [:].withDefault { [] }
			def index = new StringBuilder()
			cp.each { f ->
				new java.util.zip.ZipFile(f).withCloseable { z ->
					z.entries().each { e ->
						def n = e.name
						if (!n.endsWith(".class") || n.endsWith("module-info.class")) return
						def cn = n.substring(0, n.length() - 6)
						if (cn.startsWith("net/minecraft/") || cn.startsWith("com/mojang/") || cn.startsWith("net/fabricmc/") || cn.startsWith("mezz/") || cn.startsWith("org/lwjgl/")) {
							index.append(f.name).append(' ').append(cn).append('\n')
						}
						def p = prefixes.find { cn.startsWith(it) }
						if (p) picked[p] << cn.replace('/', '.')
					}
				}
			}
			new File(out, "classes.txt").text = index.toString()
			// 26.3: also export vanilla's shader sources (assets/minecraft/shaders/**)
			// so Origin's .fsh/.vsh can be checked against the uniform/push-constant layout.
			cp.findAll { it.name.startsWith("minecraft-") }.each { f ->
				new java.util.zip.ZipFile(f).withCloseable { z ->
					z.entries().each { e ->
						if (!e.directory && (e.name.startsWith("assets/minecraft/shaders/") || e.name.startsWith("assets/minecraft/post_effect/"))) {
							def dst = new File(out, "assets/" + e.name.substring("assets/minecraft/".length()))
							dst.parentFile.mkdirs()
							z.getInputStream(e).withCloseable { ins -> dst.bytes = ins.bytes }
						}
					}
				}
			}
			def cpStr = cp.join(File.pathSeparator)
			picked.each { p, list ->
				def target = new File(out, p.replaceAll("[^A-Za-z0-9]+", "_") + ".txt")
				target.text = ""
				list.sort().collate(120).each { batch ->
					def proc = ([javap, "-p", "-cp", cpStr] + batch).execute()
					def so = new StringBuilder(), se = new StringBuilder()
					proc.consumeProcessOutput(so, se)
					proc.waitFor()
					target << so.toString() << se.toString()
				}
			}
			// api-code.txt (optional, one class per line): full `javap -c -p` bytecode of
			// those classes, for hooks that depend on a method body (call order, locals).
			def codeList = file("api-code.txt")
			if (codeList.exists()) {
				def names = codeList.readLines().collect { it.trim() }.findAll { it && !it.startsWith("#") }
				def proc = ([javap, "-c", "-p", "-cp", cpStr] + names).execute()
				def so = new StringBuilder(), se = new StringBuilder()
				proc.consumeProcessOutput(so, se)
				proc.waitFor()
				new File(out, "code.txt").text = so.toString() + se.toString()
			}
			println "[api-dump] wrote ${picked.values().sum { it.size() } ?: 0} classes to ${out}"
		}
	}
	tasks.matching { it.name == "compileClientJava" }.configureEach { dependsOn "originApiDump" }
}
