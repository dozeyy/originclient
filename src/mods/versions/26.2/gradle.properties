# Origin Client — Fabric build for Minecraft 26.2 (the new calendar-versioned
# release line; Java 25, RenderPipeline/GpuDevice-era render internals). Separate
# module from the 1.21.x / 1.20.x builds so each MC API family has its own mapped
# build; shares the same source, adapted to the 26.2 API.
#
# Install model matches 1.21.11: the Origin jar carries the Origin client (+ JEI
# jar-in-jar); the launcher installs the matching 26.2 perf/shader stack (Sodium,
# Iris, Lithium, FerriteCore) standalone from PerformanceModCatalog alongside it.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
# 26.x is UNOBFUSCATED — Mojang ships the game with its real names (and param
# names), so there are NO obfuscation maps and build.gradle carries no
# `mappings` line (see the Fabric "Porting to 26.1" guide + fabric-example-mod
# @26.1). The names in the jar ARE the mojmap names the 1.20/1.21 modules used,
# so this module's source keeps the same imports — only changed API *shapes*
# (the RenderPipeline/Matrix3x2fStack era) need porting. Loom must be the new
# `net.fabricmc.fabric-loom` plugin; 1.17-SNAPSHOT tracks the 26.x era.
loom_version=1.17-SNAPSHOT

mod_version=0.4.2
maven_group=com.origin

# Fabric API for 26.2: the newest RELEASE build (version-scout, 2026-10-12).
# (Lunar's snapshot profile shipped 0.146.2+26.2, built for a 26.2 pre-release --
# it crashes at startup on the final 26.2: fabric-recipe-api-v1's IngredientMixin
# can't @Overwrite the changed Ingredient.hashCode.) The bundled JEI needs
# >=0.155.0. The shipped jar declares fabric-api:* -- this pin only affects
# compile + dev runClient; the launcher installs the newest 26.2 build.
fabric_api_version=0.161.0+26.2

# JEI (Just Enough Items) for 26.2, bundled jar-in-jar like 1.21.11. 30.42.0.236
# is the newest 26.2 build on Modrinth (published as beta — JEI's own channel
# label; it is the build JEI ships for 26.2). The Modrinth maven proxy resolves the
# fabric jar for this version_number (same mechanism as 1.21.11's pin).
jei_version=30.42.0.236
