# Origin Client — Fabric build for Minecraft 26.1, 26.1.1 and 26.1.2 (one jar:
# the three releases share one API — see VERSIONS.md). Java 25, unobfuscated,
# the extract/submit GUI era. DERIVED FROM the 26.2 module (2026-10-13), not
# from 1.21.11 — the 26.x era notes in src/mods/docs/PORTING-ERA-NOTES.md.
#
# Install model matches 26.2: the Origin jar carries the Origin client (+ JEI
# jar-in-jar); the launcher installs the matching 26.1.x perf/shader stack
# (Sodium, Iris, Lithium, FerriteCore) standalone from PerformanceModCatalog.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# check these on https://fabricmc.net/develop
# Compile + dev target = 26.1.2 (the Fabric API build target). The same jar was
# also booted on 26.1 (dev shots label p261-mc261, design + world, 0 mixin failures).
minecraft_version=26.1.2
loader_version=0.19.3
# 26.x is UNOBFUSCATED — Mojang ships the game with its real names (and param
# names), so there are NO obfuscation maps and build.gradle carries no
# `mappings` line (see the Fabric "Porting to 26.1" guide + fabric-example-mod
# @26.1). The names in the jar ARE the mojmap names the 1.20/1.21 modules used,
# so this module's source keeps the same imports — only changed API *shapes*
# (the RenderPipeline/Matrix3x2fStack era) need porting. Loom must be the new
# `net.fabricmc.fabric-loom` plugin; 1.17-SNAPSHOT tracks the 26.x era.
loom_version=1.17-SNAPSHOT

mod_version=0.4.2
maven_group=com.origin

# Fabric API for 26.1.x: the newest RELEASE build (version-scout, 2026-10-13).
# One build (0.155.3+26.1.2) declares 26.1, 26.1.1 and 26.1.2. The shipped jar
# declares fabric-api:* -- this pin only affects compile + dev runClient.
fabric_api_version=0.155.3+26.1.2

# JEI for 26.1.x, bundled jar-in-jar like 26.2. 29.37.0.100 (2026-10-13 pick) is
# the newest JEI 26.1.x build that resolves on ALL THREE releases: from 29.40 on, JEI
# nests mezz_config, and every mezz_config build declares "minecraft": "26.1.2"
# exactly -- that refused to boot on 26.1 (dev shots, label p261-mc261: "Incompatible
# mods found! MezzConfig requires version 26.1.2"). Builds up to 29.37.0.100 carry no
# Minecraft range at all (version-scout inspect jei:@26.1, nested jars included).
jei_version=29.37.0.100
