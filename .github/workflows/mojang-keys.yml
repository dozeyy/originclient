# Refreshes Mojang's public keys in the cosmetics service's D1 database
# (services/cosmetics/scripts/store-mojang-keys.sh). Friends sign-in checks
# Mojang's signatures with them (docs/SOCIAL.md -> Identity v2); the Worker
# can't fetch them itself because Mojang refuses Cloudflare Workers. Every
# deploy (cosmetics-service.yml) stores them too; this weekly run picks up a
# key rotation in between. Run it by hand from the Actions tab any time.
name: mojang-keys

on:
  schedule:
    - cron: "17 4 * * 1"     # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: mojang-keys
  cancel-in-progress: false

jobs:
  store:
    name: Store Mojang's public keys
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Is Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] \
             || grep -q '00000000-0000-0000-0000-000000000000' services/cosmetics/wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cosmetics service not set up on Cloudflare yet (docs/STORE.md); skipping."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Store the keys
        if: steps.ready.outputs.ready == 'true'
        working-directory: services/cosmetics
        run: bash scripts/store-mojang-keys.sh
