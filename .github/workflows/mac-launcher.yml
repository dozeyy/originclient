# The Mac launcher (src/OriginLauncher.Mac): builds it for Apple Silicon and Intel, runs its
# --self-test (data paths + every Mac seam of the shared Core: Keychain, hard links, sysctl,
# LaunchAgent, prewarm, skin decode, Java 8 layout and download, the 1.8.9 LWJGL rules, the
# self-update swap) and the Core tests in Mac mode. This is the Mac project's only compiler:
# it is never built on Will's PC.
#
# Each arch runs on its own real hardware: x64 on an Intel runner, not under Rosetta (an x64
# build crashed under Rosetta on the arm64 runner right after creating the web view's data
# store, so Rosetta results would not say anything about real Intel Macs).
name: Mac launcher

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/OriginLauncher.App/Core/**"
      - "src/OriginLauncher.Mac/**"
      - "src/OriginLauncher.Tests/**"
      - "src/OriginLauncher.App/UI/Controls/Import*.cs"
      - "src/OriginLauncher.App/UI/Controls/RowModels.cs"
      - "src/OriginLauncher.App/UI/ImportDemo.cs"
      - "src/OriginLauncher.App/UI/ImportShots.cs"
      - "src/OriginLauncher.App/Assets/Logos/**"
      - "global.json"
      - "tools/mac/**"
      - "tools/lean/contact_sheet.py"
      - ".github/workflows/mac-launcher.yml"
  pull_request:
    paths:
      - "src/OriginLauncher.App/Core/**"
      - "src/OriginLauncher.Mac/**"
      - "src/OriginLauncher.Tests/**"
      - "src/OriginLauncher.App/UI/Controls/Import*.cs"
      - "src/OriginLauncher.App/UI/Controls/RowModels.cs"
      - "src/OriginLauncher.App/UI/ImportDemo.cs"
      - "src/OriginLauncher.App/UI/ImportShots.cs"
      - "src/OriginLauncher.App/Assets/Logos/**"
      - "global.json"
      - "tools/mac/**"
      - "tools/lean/contact_sheet.py"
      - ".github/workflows/mac-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the screenshot step downloads the latest Windows launcher-shots artifact to compare names

concurrency:
  group: mac-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: mac (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Runner
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          dotnet --version

      - name: Publish (${{ matrix.rid }})
        run: dotnet publish src/OriginLauncher.Mac/OriginLauncher.Mac.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o "$RUNNER_TEMP/publish"

      # Exit 0 only when every check printed PASS. --network adds the Java 8 download
      # (hash-checked, unpacked, run) and Mojang's real 1.8.9 file list.
      - name: Self-test
        run: |
          file "$RUNNER_TEMP/publish/OriginLauncher"
          "$RUNNER_TEMP/publish/OriginLauncher" --self-test --network

      # The Core tests that mean something on a Mac: the Mac seams, the skin decoder that
      # replaces WPF's, the library rules (1.8.9 LWJGL 2.9.2 on osx, 2.9.4 elsewhere) and the
      # Mac launch rules (arch per version, Rosetta, no -XstartOnFirstThread on LWJGL 2), plus the
      # import: every launcher's Mac folder found, and the page's words and paths ("/", "~", "this Mac").
      # Also the running-game process probe (ps) and the Game folder rule ("/" paths).
      - name: Core tests (Mac mode)
        run: >
          dotnet test src/OriginLauncher.Tests -p:OriginPlatform=Mac
          --filter "FullyQualifiedName~MacSeamTests|FullyQualifiedName~SkinPngTests|FullyQualifiedName~LibraryRulesTests|FullyQualifiedName~SealedSignInTests|FullyQualifiedName~MacLaunchPolicyTests|FullyQualifiedName~MacReleaseAssetsTests|FullyQualifiedName~DeviceCodeFlowTests|FullyQualifiedName~MacImportTests|FullyQualifiedName~ImportPageLogicTests|FullyQualifiedName~GameRunningProbeTests|FullyQualifiedName~FieldRulesTests"

      # The real Microsoft sign-in card in a small window of its own (never the launcher, a throwaway data root,
      # no account): the web view (WKWebView, non-persistent store) draws Microsoft's real authorize page and
      # catches a simulated redirect and Microsoft's own 302; "sign in with a code" gets a live code and then
      # cancels. Nobody is signed in; the code is logged by length only. perl's alarm stops a hung window.
      # Every other headless run switches animations off; this one runs them for real: Play signed out (the v1.0.92
      # ScaleTransform crash), the Accounts and Friends drawers, a popup menu and the Mods page motion shapes.
      - name: Motion check
        run: '"$RUNNER_TEMP/publish/OriginLauncher" --motion-check --root "$RUNNER_TEMP/motion-check"'

      - name: Sign-in probe
        run: |
          perl -e 'alarm 240; exec @ARGV' "$RUNNER_TEMP/publish/OriginLauncher" --signin-probe "$RUNNER_TEMP/signin-probe"
          grep -q "RESULT PASS" "$RUNNER_TEMP/signin-probe/probe.log"

      # A finished sign-in reaches the account store one way only: MinecraftSessionBroker.AddSignedIn (the Mac
      # code never writes accounts or tokens itself).
      - name: Sign-in storage path
        run: |
          writes=$(grep -rnE "AccountStore\.(Save|Upsert|ProtectRefreshToken|ProtectSession)\(" src/OriginLauncher.Mac --include=*.cs || true)
          adds=$(grep -rn "MinecraftSessionBroker.AddSignedIn(" src/OriginLauncher.Mac --include=*.cs | wc -l | tr -d ' ')
          echo "direct account writes: ${writes:-none}"
          echo "AddSignedIn call sites: $adds"
          [ -z "$writes" ] && [ "$adds" = "1" ]

      # ---- Screenshots (Apple Silicon leg only; informational, never fails the run) ----
      # The Mac twin of launcher-shots: every Mac screen drawn headless (no window, made-up data, exits by
      # itself) under the same file names as the Windows run, a contact sheet, and two parity lists in the job
      # summary: the Windows shots with no Mac twin yet, and the Windows theme keys with no Mac twin yet.
      - name: Render screens
        if: matrix.rid == 'osx-arm64'
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/publish/OriginLauncher" --render-shots mac-shots
          echo "PNGs: $(ls mac-shots/*.png | wc -l | tr -d ' ')"
          # The Friends drawer and chat in every state, the twin of launcher-shots' --social run (made-up friends, no network).
          "$RUNNER_TEMP/publish/OriginLauncher" --render-shots mac-shots/social --social
          echo "Social PNGs: $(ls mac-shots/social/*.png | wc -l | tr -d ' ')"

      - name: Contact sheet
        if: matrix.rid == 'osx-arm64'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 tools/lean/contact_sheet.py mac-shots
          python3 tools/lean/contact_sheet.py mac-shots/social

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'osx-arm64' && always()
        continue-on-error: true
        with:
          name: mac-launcher-shots
          path: mac-shots
          if-no-files-found: warn

      - name: Windows shots with no Mac twin
        if: matrix.rid == 'osx-arm64' && always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow launcher-shots.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          {
            echo "## Mac screens vs Windows"
            if [ -z "$run_id" ] || ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n launcher-shots -D win-shots; then
              echo "No Windows launcher-shots artifact to compare against (none recent, or expired)."
            else
              echo "Compared with Windows launcher-shots run $run_id."
              ls win-shots/*.png | xargs -n1 basename | sort > win.txt
              ls mac-shots/*.png 2>/dev/null | xargs -n1 basename | sort > mac.txt
              echo ""
              echo "Mac has $(comm -12 win.txt mac.txt | wc -l | tr -d ' ') of $(wc -l < win.txt | tr -d ' ') Windows screens. Not on the Mac yet:"
              echo ""
              comm -23 win.txt mac.txt | sed 's/^/- /'
              ls win-shots/social/*.png 2>/dev/null | xargs -n1 basename | sort > win-social.txt
              ls mac-shots/social/*.png 2>/dev/null | xargs -n1 basename | sort > mac-social.txt
              echo ""
              echo "Friends drawer (--social): Mac has $(comm -12 win-social.txt mac-social.txt | wc -l | tr -d ' ') of $(wc -l < win-social.txt | tr -d ' '). Not on the Mac yet:"
              echo ""
              comm -23 win-social.txt mac-social.txt | sed 's/^/- /'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Theme tokens with no Mac twin
        if: matrix.rid == 'osx-arm64' && always()
        continue-on-error: true
        run: python3 tools/mac/check_theme_parity.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  # The Mac launcher's screens on the claude/dev-shots branch, folder mac-launcher/ (SOURCE.txt names the commit), next to
  # launcher-shots' Windows `launcher/` folder, so a session can open them (_sheet.jpg first) without the artifact API.
  # Publish only: it checks nothing out and runs no repo code; it is the only job with contents: write, and it pushes
  # the PNGs the shots step uploaded. Same race-safe push as launcher-shots.yml's publish (one sparse clone, then
  # fetch-reset-recommit on a lost race). Never on pull requests (their token can't write).
  publish-shots:
    name: Publish Mac shots to dev-shots
    needs: mac
    if: ${{ always() && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true   # no artifact when the shots job stopped early: nothing to publish (below)
        with:
          name: mac-launcher-shots
          path: ${{ runner.temp }}/pub

      - name: Publish to the claude/dev-shots branch
        run: |
          folder="mac-launcher"
          n=$(find "$RUNNER_TEMP/pub" -name '*.png' | wc -l)
          echo "PNGs to publish: $n"
          [ "$n" -gt 0 ] || { echo "::warning::nothing published: no PNGs in the mac-launcher-shots artifact (the shots step did not run)"; exit 0; }
          url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          max=15
          pause() { local d=$(( 2 + RANDOM % 7 + $1 )); [ "$d" -gt 20 ] && d=20; echo "waiting ${d}s"; sleep "$d"; }
          site="$RUNNER_TEMP/site"
          for try in 1 2 3 4 5 6; do
            rc=0
            git ls-remote --exit-code --heads "$url" claude/dev-shots >/dev/null 2>&1 || rc=$?
            rm -rf "$site"
            if [ "$rc" = 0 ] && timeout 300 git clone -q --depth 1 --filter=blob:none --no-checkout --branch claude/dev-shots "$url" "$site" \
               && git -C "$site" sparse-checkout set --no-cone "/$folder/" && timeout 300 git -C "$site" checkout -q claude/dev-shots; then break; fi
            if [ "$rc" = 2 ]; then
              mkdir -p "$site" && git -C "$site" init -q && git -C "$site" checkout -q -b claude/dev-shots && break
            fi
            echo "could not get claude/dev-shots (ls-remote exit $rc, try $try/6)"; pause "$try"
          done
          [ -d "$site/.git" ] || { echo "::error::could not clone claude/dev-shots"; exit 1; }
          cd "$site"
          git config user.name "origin-dev-shots"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 "$max"); do
            rm -rf "$folder"; cp -r "$RUNNER_TEMP/pub" "$folder"
            printf 'source: %s\nrun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$folder/SOURCE.txt"
            git add -A
            git commit -qm "Mac launcher shots for ${GITHUB_SHA::7}" || true
            if git push -q "$url" HEAD:refs/heads/claude/dev-shots; then echo "published on attempt $attempt"; exit 0; fi
            echo "push lost the race (attempt $attempt/$max)"
            pause "$attempt"
            git fetch -q --depth 1 --filter=blob:none "$url" claude/dev-shots && git reset -q --hard FETCH_HEAD || echo "fetch of the new tip failed; will retry"
          done
          echo "::error::could not publish to claude/dev-shots after $max attempts"
          exit 1

  # The self-update, end to end, on both Mac CPUs, against a FAKE release served from this runner (127.0.0.1; no
  # GitHub release is read or written): a build stamped 1.0.50 (so the update really gates Play, like a player's
  # copy) is put in an Origin.app and offered launcher-v99.0.0. It must refuse a release with no SHA-256 and a zip
  # whose SHA-256 is wrong, refuse to install from a translocated copy and from a folder it can't write to (and say
  # to move it to Applications), and otherwise download, verify, unpack, swap the bundle and reopen it, after which
  # the swapped app still starts. The reopen itself is stubbed (tools/mac/update_proof.sh).
  update-proof:
    name: update proof (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (${{ matrix.rid }}, stamped 1.0.50)
        run: dotnet publish src/OriginLauncher.Mac/OriginLauncher.Mac.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=1.0.50 -o "$RUNNER_TEMP/publish-stamped"

      - name: Self-update against a fake release
        run: bash tools/mac/update_proof.sh ${{ matrix.rid }} "$RUNNER_TEMP/publish-stamped" 1.0.50

      # The Intel build on an Apple Silicon Mac (Rosetta): its self-update must take the Apple Silicon zip, so the
      # next update replaces it with the native app (MacReleaseAssets.ZipPrefixForUpdate), and it offers the Apple
      # Silicon download. The native build on the same runner keeps its own zip. No window, no network.
      - name: Intel build under Rosetta updates to Apple Silicon
        if: matrix.rid == 'osx-arm64'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then sudo softwareupdate --install-rosetta --agree-to-license; fi
          dotnet publish src/OriginLauncher.Mac/OriginLauncher.Mac.csproj -c Release -r osx-x64 --self-contained true -o "$RUNNER_TEMP/publish-x64" -v:q
          /usr/bin/arch -x86_64 "$RUNNER_TEMP/publish-x64/OriginLauncher" --update-asset | tee "$RUNNER_TEMP/asset-x64.txt"
          grep -q "Rosetta yes" "$RUNNER_TEMP/asset-x64.txt"
          grep -q "OriginLauncher-osx-arm64.zip" "$RUNNER_TEMP/asset-x64.txt"
          grep -q "Get Origin for Apple Silicon" "$RUNNER_TEMP/asset-x64.txt"
          "$RUNNER_TEMP/publish-stamped/OriginLauncher" --update-asset | tee "$RUNNER_TEMP/asset-arm64.txt"
          grep -q "native notice    none" "$RUNNER_TEMP/asset-arm64.txt"

  # --launch-plan for every version the picker offers, on both Mac CPUs: the launcher's own launch
  # path in a scratch folder (Fabric/Forge, Origin's mods, Mojang's libraries, natives, assets and
  # Java for this Mac), then checks of the process it built: Java exists, is the right arch and
  # starts (-version only), every classpath file and argument path exists, liblwjgl is there for
  # the right CPU, -XstartOnFirstThread exactly on LWJGL 3, java reads the real main class, every asset object is on disk. The game
  # itself never starts in this step (see "Game starts"). 4 shards per arch keep each job short. x64 runs on
  # an Intel runner, never under Rosetta (see the header).
  launch-plan:
    name: launch plan (${{ matrix.rid }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        shard: [0, 1, 2, 3]
        include:
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # 1.8.9 / 1.16.5 / 1.17.1 / 1.18.2 run x64 Java on Apple Silicon. A player without Rosetta gets
      # the "Install Rosetta" offer instead (unit-tested); the runner needs it to prove those launches.
      - name: Rosetta (Apple Silicon only)
        if: matrix.rid == 'osx-arm64'
        run: |
          if /usr/bin/arch -x86_64 /usr/bin/true; then echo "Rosetta already installed"; else
            sudo softwareupdate --install-rosetta --agree-to-license; fi

      - name: Publish (${{ matrix.rid }})
        run: dotnet publish src/OriginLauncher.Mac/OriginLauncher.Mac.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o "$RUNNER_TEMP/publish"

      - name: Launch plans
        run: |
          app="$RUNNER_TEMP/publish/OriginLauncher"
          "$app" --list-versions > "$RUNNER_TEMP/versions.txt"
          echo "$(wc -l < "$RUNNER_TEMP/versions.txt") live versions"
          echo "| version (${{ matrix.rid }}) | plan |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=""; passed=0
          for v in $(awk -v s=${{ matrix.shard }} '(NR - 1) % 4 == s' "$RUNNER_TEMP/versions.txt"); do
            echo "::group::$v"
            root="$RUNNER_TEMP/plan-$v"
            if "$app" --launch-plan "$v" --root "$root"; then
              passed=$((passed + 1)); echo "| $v | pass |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $v"; echo "| $v | FAIL |" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -rf "$root"
            echo "::endgroup::"
          done
          echo "passed: $passed, failed:${failed:- none}"
          test -z "$failed"

      # --start-game: the built process really started, the way Play starts it, and passes only when the macOS window
      # server shows an on-screen window owned by the game's process (LaunchPlan.StartGame, MacWindows). The main class
      # logging alone ("Setting user:") was the old bar: v1.0.97 passed 1.8.9 that way while the game exited 255 before
      # any window. A failed start prints the game's last lines and its crash report. The latest release's Origin
      # Client jars are put where a shipped app keeps them (Bundled/OriginClient), so the launch is the player's one
      # (Origin's mod included) and the log also says whether Origin's title screen came up. One Fabric (LWJGL 3,
      # native on Apple Silicon) and the Forge version (LWJGL 2, Rosetta on Apple Silicon), on both CPUs.
      - name: Origin Client jars of the latest release
        if: matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern OriginLauncher-win-x64.zip --dir "$RUNNER_TEMP/rel"
          mkdir -p "$RUNNER_TEMP/publish/Bundled/OriginClient"
          # The Windows zip may name its entries with backslashes (tools/linux/package.sh reads it the same way).
          python3 - "$RUNNER_TEMP/rel/OriginLauncher-win-x64.zip" "$RUNNER_TEMP/publish/Bundled/OriginClient" <<'PY'
          import os, sys, zipfile
          src, dest = sys.argv[1:3]
          with zipfile.ZipFile(src) as z:
              for n in z.namelist():
                  if n.replace("\\", "/").startswith("Bundled/OriginClient/") and n.endswith(".jar"):
                      open(os.path.join(dest, os.path.basename(n.replace("\\", "/"))), "wb").write(z.read(n))
          PY
          ls "$RUNNER_TEMP/publish/Bundled/OriginClient"

      # What this runner can draw with, independent of Minecraft and Origin (tools/mac/gl_probe.m): an accelerated
      # OpenGL pixel format, the software renderer, and whether a plain window from a process reaches the screen. A
      # game stopped at its OpenGL window (--start-game exit 4) passes as UNPROVEN only when this says the runner gives
      # no program an accelerated OpenGL window; with one, the same stop is a failure.
      - name: OpenGL on this runner
        if: matrix.shard == 0
        run: |
          clang -fobjc-arc -framework Cocoa -framework OpenGL -o "$RUNNER_TEMP/gl_probe" tools/mac/gl_probe.m
          perl -e 'alarm 60; exec @ARGV' "$RUNNER_TEMP/gl_probe" | tee "$RUNNER_TEMP/gl_probe.txt"
          { echo "OpenGL probe (${{ matrix.rid }}):"; sed 's/^/    /' "$RUNNER_TEMP/gl_probe.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Game starts (window opens)
        if: matrix.shard == 0
        run: |
          set -o pipefail
          app="$RUNNER_TEMP/publish/OriginLauncher"
          gl_ok=no
          grep -qE "^accelerated GL +yes" "$RUNNER_TEMP/gl_probe.txt" && grep -qE "^window +yes" "$RUNNER_TEMP/gl_probe.txt" && gl_ok=yes
          failed=""
          for v in 1.21.1 1.8.9; do
            echo "::group::start $v"
            root="$RUNNER_TEMP/start-$v"
            set +e
            "$app" --launch-plan "$v" --root "$root" --start-game | tee "$RUNNER_TEMP/start-$v.txt"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" = 0 ]; then
              echo "| $v | game window opened: pass |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$code" = 4 ] && [ "$gl_ok" = no ]; then
              echo "::warning title=$v window unproven::this runner has no accelerated OpenGL window for any program (OpenGL probe); the game stopped there too"
              echo "| $v | game window: UNPROVEN on this runner (no accelerated OpenGL) |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $v"; echo "| $v | game window opened: FAIL (exit $code) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            grep -E "^  (game|title)" "$RUNNER_TEMP/start-$v.txt" | sed "s/^/    $v /" >> "$GITHUB_STEP_SUMMARY" || true
            rm -rf "$root"
            echo "::endgroup::"
          done
          test -z "$failed"

      # --play-plan: the same proof through the launcher window itself (headless): the Home Play button
      # runs its whole launch flow (update gate, session, heap, install, process build) and hands the
      # built process over instead of starting it. One Fabric and the Forge version, on both CPUs.
      - name: Play button plans
        if: matrix.shard == 0
        run: |
          app="$RUNNER_TEMP/publish/OriginLauncher"
          failed=""
          for v in 1.21.1 1.8.9; do
            echo "::group::play $v"
            root="$RUNNER_TEMP/play-$v"
            if "$app" --play-plan "$v" --root "$root"; then
              echo "| $v | Play button: pass |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $v"; echo "| $v | Play button: FAIL |" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -rf "$root"
            echo "::endgroup::"
          done
          test -z "$failed"
