name: deploy-website

# Publishes the static site in website/ to GitHub Pages on every push to main
# that touches it. The site is plain HTML/CSS/JS with relative asset paths, so
# it serves correctly from the project-pages subpath (/originclient/).

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      # Every running launcher reads launcher/promos.json for its home banner.
      # A broken file can't crash them (they fall back to their last good
      # copy), but it would freeze the banner — so refuse to publish one.
      - name: Check the site (banner feed, headers, pages)
        run: |
          python3 tools/website/check_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website/
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
