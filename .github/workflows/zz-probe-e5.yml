# TEMPORARY probe (claude/followups-shader-overlays): javap the vanilla / Fabric API / Iris
# classes the after-shaders overlay port needs. Removed before the lane is handed back.
name: zz-probe-e5

on:
  push:
    branches: ["claude/followups-shader-overlays"]
    paths: [".github/workflows/zz-probe-e5.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: "1.21.11", java: "21" }
          - { module: "1.21.10", java: "21" }
          - { module: "1.21.8", java: "21" }
          - { module: "26.1", java: "25" }
          - { module: "26.2", java: "25" }
          - { module: "26.3", java: "25" }
    defaults:
      run:
        working-directory: src/mods/versions/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Resolve classpath
        shell: bash
        run: sh ./gradlew compileJava --no-daemon -q > gradle.log 2>&1 || (tail -n 30 gradle.log; true)
      - name: javap
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/probe-${{ matrix.module }}"; mkdir -p "$out"
          jars=$(find ~/.gradle .gradle build -name '*.jar' 2>/dev/null)
          has() { for j in $jars; do unzip -l "$j" 2>/dev/null | grep -q " $1\$" && { echo "$j"; return; }; done; }
          MC=$(has net/minecraft/client/renderer/GameRenderer.class)
          IRIS=$(for j in $jars; do unzip -l "$j" 2>/dev/null | grep -q "net/irisshaders/iris/Iris.class" && echo "$j"; done | head -1)
          echo "MC=$MC"; echo "IRIS=$IRIS"
          FAB=$(for j in $jars; do unzip -l "$j" 2>/dev/null | grep -qE "net/fabricmc/fabric/mixin/client/rendering/(LevelRenderer|WorldRenderer)Mixin.class" && echo "$j"; done | head -1)
          echo "FAB=$FAB"
          CP="$MC"
          meth() {  # class, method-name regex: print that method's bytecode (invokes, fields, ldc)
            javap -p -c -cp "$CP" "$1" 2>&1 | awk -v m="$2" '
              /^  [a-z].*\(.*\).*;$/ || /^  [a-z].*\(.*\) throws .*;$/ { on = ($0 ~ m) ; if (on) print "== " $0; next }
              on && /(invoke|getstatic|putstatic|getfield|putfield|ldc|new )/ { print }'
          }
          {
            echo "### GameRenderer members"; javap -p -cp "$CP" net.minecraft.client.renderer.GameRenderer
            echo "### GameRenderer.renderLevel"; meth net.minecraft.client.renderer.GameRenderer ' renderLevel\('
            echo "### GameRenderer.renderItemInHand"; meth net.minecraft.client.renderer.GameRenderer 'renderItemInHand|submitItemInHand'
            echo "### LevelRenderer renderLevel sig"; javap -p -cp "$CP" net.minecraft.client.renderer.LevelRenderer | grep -E "renderLevel|addMainPass|submit|Pass\("
            echo "### LevelRenderer.renderLevel"; meth net.minecraft.client.renderer.LevelRenderer ' renderLevel\('
            echo "### LevelRenderer.addMainPass"; meth net.minecraft.client.renderer.LevelRenderer 'addMainPass'
            echo "### RenderSystem"; javap -p -cp "$CP" com.mojang.blaze3d.systems.RenderSystem | grep -iE "modelview|projection|outputcolor|outputdepth"
            echo "### RenderType draw"; for c in net.minecraft.client.renderer.rendertype.RenderType net.minecraft.client.renderer.RenderType; do meth $c ' draw\('; done
            echo "### MultiBufferSource"; javap -p -cp "$CP" 'net.minecraft.client.renderer.MultiBufferSource$BufferSource' 2>&1 | head -30
            echo "### RenderBuffers"; javap -p -cp "$CP" net.minecraft.client.renderer.RenderBuffers 2>&1 | head -20
            echo "### SubmitNodeStorage / Collector"; javap -p -cp "$CP" net.minecraft.client.renderer.SubmitNodeStorage 2>&1 | grep -iE "custom|clear|public" | head -20
            echo "### FeatureRenderDispatcher"; javap -p -cp "$CP" net.minecraft.client.renderer.feature.FeatureRenderDispatcher 2>&1 | head -30
            echo "### FeatureRenderDispatcher.renderAllFeatures"; meth net.minecraft.client.renderer.feature.FeatureRenderDispatcher 'renderAllFeatures'
            echo "### CustomFeatureRenderer"; javap -p -c -cp "$CP" net.minecraft.client.renderer.feature.CustomFeatureRenderer 2>&1 | grep -E "^  [a-z]|invoke" | head -40
            echo "### TitleScreen"; javap -p -cp "$CP" net.minecraft.client.gui.screens.TitleScreen
            echo "### TitleScreen.init/createNormalMenuOptions"; meth net.minecraft.client.gui.screens.TitleScreen 'init\(|createNormalMenuOptions|createDemoMenuOptions|realms|Realms'
          } > "$out/mc.txt" 2>&1
          if [ -n "$FAB" ]; then
            unzip -l "$FAB" | grep -E "mixin/client/rendering/.*(Level|World|Game)Renderer.*Mixin" > "$out/fabric.txt"
            for c in $(unzip -l "$FAB" | grep -oE "net/fabricmc/fabric/mixin/client/rendering/(LevelRenderer|WorldRenderer|GameRenderer)Mixin.class"); do
              echo "### $c" >> "$out/fabric.txt"
              javap -v -p -cp "$FAB" "${c%.class}" 2>&1 | grep -E "^  [a-z].*\(|Inject|At\(|method=|target=|value=|ordinal|invoke.*(Event|invoker)|END_MAIN|COLLECT|LAST|AFTER|BEFORE" >> "$out/fabric.txt"
            done
          fi
          if [ -n "$IRIS" ]; then
            for c in $(unzip -l "$IRIS" | grep -oE "net/irisshaders/iris/mixin/[A-Za-z/]*(LevelRenderer|GameRenderer|RenderTarget|FrameGraph)[A-Za-z]*\.class"); do
              echo "### $c" >> "$out/iris.txt"
              javap -v -p -cp "$IRIS" "${c%.class}" 2>&1 | grep -E "^  [a-z].*\(|Inject|Redirect|Wrap|At\(|method=|target=|value=|invoke.*(finalize|beginLevel|endLevel|Pipeline)" >> "$out/iris.txt"
            done
            for c in $(unzip -l "$IRIS" | grep -oE "net/irisshaders/iris/pipeline/IrisRenderingPipeline.class"); do
              echo "### $c finalize" >> "$out/iris.txt"
              javap -p -c -cp "$IRIS:$MC" "${c%.class}" 2>&1 | awk '/^  [a-z].*\(.*\).*;$/ {on=($0 ~ /finalizeLevelRendering|beginLevelRendering|finalizeGameRendering/); if(on) print "== " $0; next} on && /invoke|getfield|putfield/ {print}' >> "$out/iris.txt"
            done
          fi
          wc -l "$out"/*
          for f in "$out"/*; do echo "=================== $f"; cat "$f"; done
      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.module }}
          path: ${{ runner.temp }}/probe-${{ matrix.module }}
