# Boot-smoke: prove each version doesn't just COMPILE but actually BOOTS to the
# title screen with zero mixin-apply failures. build-check.yml compiles every
# module; compiling only proves mixin TARGETS exist -- @Inject descriptor /
# @Shadow mismatches surface only when a mixin is APPLIED at class load, i.e. at
# boot. This runs the real client headlessly and reads Minecraft's own log via
# tools/boot-smoke/smoke.py.
#
# HONEST LIMITATIONS (read before making this a required check):
#  - Headless GL: runners have no GPU, so this uses Xvfb + Mesa's llvmpipe
#    software rasterizer. Sodium hard-requires GL 4.6; llvmpipe caps at 4.5, so
#    MESA_GL_VERSION_OVERRIDE spoofs the version. This is the fragile part -- if a
#    Sodium/Iris version refuses to start under software GL, that's an environment
#    limit, not an Origin bug. Tune per version before trusting a red result.
#  - Coverage is BOOT + MAIN MENU, plus an IN-WORLD step on modules flagged "inworld": true in
#    live-modules.json (input `inworld`, default on): after the title, smoke.py --inworld keeps the
#    game running while OriginDevWorld.inWorldTick makes a flat test world, waits for Origin's HUD,
#    shoots it, opens the Mod Menu over the world, shoots it, and Saves and Quits. The run fails on
#    "[origin-smoke] in-world: FAIL <reason>", a crash, a missing shot or the step's own deadline;
#    the shots upload as artifact inworld-<module>. Unflagged modules still stop at the title:
#    world-join mixins there (JEI's runtime handlers, the hitbox entity mixin) are dev-shots.yml's
#    `set: world`. Turning a module on: carry the step in its OriginDevWorld, then set the flag
#    (.claude/skills/origin-port/reference/verify-loop.md).
#  - READY = the title screen: every live module prints a dev-only
#    "[origin-smoke] title screen reached" (OriginClientMod, env ORIGIN_SMOKE) the
#    first tick the title is up with no loading overlay. It used to be "Backend
#    library" (GL up), which a boot wedged on the loading screen also passed.
#  - The matrix IS src/mods/live-modules.json: every live module, 1.16.5, 1.17.1
#    and 1.8.9 (Forge; its run task pins a foojay-provisioned JDK 8 itself) included.
#  - Maven 429 / asset timeouts: tools/ci/gradle_prefetch.sh downloads everything
#    first with a bounded retry, and smoke.py retries a run that dies on a download
#    before the game starts. A flake is never reported as a pass.
#  - GAME JVM vs GRADLE JVM: Gradle always runs on 21 (Loom 1.17), but players run
#    1.18.2-1.20.4 on Java 17 and 1.17.1 on Java 16. The plan job's RUN_JAVA map installs
#    that JDK too and smoke.py --run-java pins runClient's launcher to it
#    (tools/boot-smoke/run-java.init.gradle, CI only: module build.gradle files and local
#    runs are untouched), then checks the real game process's `java -version` and prints
#    it (grep "GAME JVM" in the log). options.release only checks the APIs OUR code uses;
#    a bundled mod jar built for Java 21 would otherwise boot here and fail for players.
#    1.16.5 (Java 8) is NOT pinned: with runClient on a JDK 8 launcher the game dies with
#    "Could not find or load main class net.fabricmc.devlaunchinjector.Main"
#    (run 39254422987); it needs a dev-classpath fix first.
#  - COVERED VERSIONS (input `covers`): one module jar serves several Minecraft versions
#    (live-modules.json "versions"). A normal row boots the module's PRIMARY version from source.
#    A covers row boots what a player on a covered version actually runs: the module's BUILT jar
#    + that Minecraft version + Fabric API (newest release, as FabricApiInstaller picks it) + every
#    mod PerformanceModCatalog lists for that version, all production jars loaded through
#    fabric.addMods by a source-less Loom project (tools/boot-smoke/covers.py). Same smoke.py gates:
#    title reached, zero mixin-apply failures, Sodium + Iris loaded, Mod Menu + ImmediatelyFast at
#    the catalog versions, the game JVM players use.
#  - VETTED PAIRS (input `pairs`, U5.2b): the same production-style boot with Sodium + Iris swapped for an
#    older pair a profile may be pinned to (ManagedPins AlternatePins; covers.py --pair), and FAIL unless the
#    mod list names exactly that pair. A pair stays on ConfigurationCatalog's allow-list only with a green row.
#  - PLAYER PROFILES (input `players`): the launch a profile gets when it holds the PLAYER'S OWN Sodium (+ Iris), the
#    player's mods winning over Origin's (PlayerOverrides.cs): Origin's top-level Sodium/Iris are left out, the player's
#    jars go in beside Origin's (a nested Origin pair must lose to them), and with no player Iris the boot carries
#    -Dfabric.debug.disableModIds=iris like the launcher (covers.py --player). FAIL unless the mod list names the
#    player's versions (and no Iris when none was given) with zero mixin-apply failures.
#
# Starts as manual (workflow_dispatch) so a flaky software-GL result can't block
# merges. Promote to `on: pull_request` once it's proven stable per version.
name: boot-smoke

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated modules, or 'all' (= every module in src/mods/live-modules.json)"
        default: "all"
      timeout:
        description: "Per-attempt hard timeout (seconds)"
        default: "600"
      gradle_args:
        description: "Extra Gradle args for runClient, e.g. --stacktrace (diagnostics)"
        default: ""
      companions:
        description: "true = also load the launcher's ImmediatelyFast + Mod Menu pins for the module (adds -PextraMods=run/extra-mods itself) and FAIL unless the loaded mod list names them at the catalog versions"
        default: "false"
      covers:
        description: "Covered versions to boot production-style (built module jar + that version's catalog mods + Fabric API): 'false', 'all' (every non-primary version of the picked modules), or a comma list of exact versions, e.g. 1.21.2,1.20.1. modules='none' runs covers rows only"
        default: "false"
      pairs:
        description: "Vetted older Sodium + Iris pairs to boot production-style, as <mc>:<pairId> comma list, e.g. 1.21.1:0.6.5+1.8.1 (ConfigurationCatalog). Use with modules='none' for a pairs-only run"
        default: ""
      inworld:
        description: "true = modules flagged \"inworld\" in live-modules.json also run the in-world step (flat world, HUD + Mod Menu shots, Save and Quit); false = stop at the title"
        default: "true"
      players:
        description: "Player-profile boots: the player's own Sodium + Iris (Modrinth version numbers) win over Origin's, as <mc>:<sodium>/<iris> comma list, iris '-' = none, e.g. 1.21.1:mc1.21.1-0.6.9-fabric/1.8.7+1.21.1-fabric"
        default: ""

concurrency:
  group: boot-smoke-${{ github.ref }}-${{ github.event.inputs.modules }}-${{ github.event.inputs.covers }}-${{ github.event.inputs.pairs }}-${{ github.event.inputs.players }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        env:
          INPUT: ${{ github.event.inputs.modules }}
          COVERS: ${{ github.event.inputs.covers }}
          PAIRS: ${{ github.event.inputs.pairs }}
          PLAYERS: ${{ github.event.inputs.players }}
          INWORLD: ${{ github.event.inputs.inworld }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          entries = json.load(open("src/mods/live-modules.json"))["modules"]
          raw = (os.environ.get("INPUT") or "all").strip()
          # 'none' = no primary rows (a covers-only run).
          want = None if raw == "all" else {x.strip() for x in raw.split(",")} - {"none"}
          # Gradle itself needs JVM 21 (Loom 1.17) for every 1.x module; each still
          # emits its own bytecode level via options.release (1.8.9's runClient
          # launches on its pinned JDK 8). 26.x needs 25 ("java" in live-modules.json).
          # RUN_JAVA = the JDK players' game runs on, where it differs from Gradle's.
          RUN_JAVA = {"1.17.1": "16", "1.18.2": "17", "1.19.2": "17", "1.19.3": "17",
                      "1.19.4": "17", "1.20": "17", "1.20.2": "17", "1.20.4": "17"}
          known = {m["module"] for m in entries}
          if want is not None and want - known:
              raise SystemExit("boot-smoke: not a live module: %s (live: %s)"
                               % (", ".join(sorted(want - known)), ", ".join(sorted(known))))
          picked = []
          for m in entries:
              if want is not None and m["module"] not in want:
                  continue
              row = {"version": m["module"], "label": m["module"], "cover": "", "java": m.get("java", "21")}
              if m["module"] in RUN_JAVA:
                  row["run_java"] = RUN_JAVA[m["module"]]
              # The in-world step (primary rows only): live-modules.json "inworld": true, unless inworld=false.
              if m.get("inworld") and (os.environ.get("INWORLD") or "true").strip() != "false":
                  row["inworld"] = "1"
                  row["label"] = m["module"] + " + in-world"
              picked.append(row)
          # covers rows: version = the covering module (built), cover = the Minecraft version booted.
          # The game JVM is the covering module's (players on 1.20.1 run Java 17 like 1.20).
          craw = (os.environ.get("COVERS") or "false").strip()
          if craw not in ("", "false"):
              def primary(mod):
                  t = open("src/mods/versions/%s/gradle.properties" % mod).read()
                  return re.search(r"^\s*minecraft_version\s*=\s*(\S+)", t, re.M).group(1)
              owner = {v: m for m in entries for v in m.get("versions", [])}
              if craw == "all":
                  wanted = [v for m in entries if m["module"] != "1.8.9" and (not want or m["module"] in want)
                            for v in m["versions"] if v != primary(m["module"])]
              else:
                  wanted = [x.strip() for x in craw.split(",") if x.strip()]
              unknown = [v for v in wanted if v not in owner or owner[v]["module"] == "1.8.9"]
              if unknown:
                  raise SystemExit("boot-smoke: covers: not a covered Fabric version: %s" % ", ".join(unknown))
              for v in wanted:
                  m = owner[v]
                  row = {"version": m["module"], "label": "%s (covered by %s)" % (v, m["module"]), "cover": v,
                         "java": m.get("java", "21")}
                  if m["module"] in RUN_JAVA:
                      row["run_java"] = RUN_JAVA[m["module"]]
                  picked.append(row)
          # pairs rows: a covers row for <mc> with Sodium + Iris swapped for the vetted pair (covers.py --pair).
          for item in [x.strip() for x in (os.environ.get("PAIRS") or "").split(",") if x.strip()]:
              mc, _, pair = item.partition(":")
              if not re.fullmatch(r"[0-9][0-9A-Za-z.]*", mc) or not re.fullmatch(r"[0-9A-Za-z.+_-]+", pair):
                  raise SystemExit("boot-smoke: pairs: expected <mc>:<pairId>, got %r" % item)
              m = next((e for e in entries if mc in e.get("versions", []) and e["module"] != "1.8.9"), None)
              if m is None:
                  raise SystemExit("boot-smoke: pairs: not a live Fabric version: %s" % mc)
              row = {"version": m["module"], "label": "%s with Sodium+Iris %s" % (mc, pair), "cover": mc, "pair": pair,
                     "java": m.get("java", "21")}
              if m["module"] in RUN_JAVA:
                  row["run_java"] = RUN_JAVA[m["module"]]
              picked.append(row)
          # players rows: a covers row for <mc> where the profile's own Sodium (+ Iris) win (covers.py --player).
          for item in [x.strip() for x in (os.environ.get("PLAYERS") or "").split(",") if x.strip()]:
              mc, _, spec = item.partition(":")
              if not re.fullmatch(r"[0-9][0-9A-Za-z.]*", mc) or not re.fullmatch(r"[0-9A-Za-z.+_-]+/[0-9A-Za-z.+_-]+", spec):
                  raise SystemExit("boot-smoke: players: expected <mc>:<sodium>/<iris>, got %r" % item)
              m = next((e for e in entries if mc in e.get("versions", []) and e["module"] != "1.8.9"), None)
              if m is None:
                  raise SystemExit("boot-smoke: players: not a live Fabric version: %s" % mc)
              row = {"version": m["module"], "label": "%s with the player's own %s" % (mc, spec), "cover": mc, "player": spec,
                     "java": m.get("java", "21")}
              if m["module"] in RUN_JAVA:
                  row["run_java"] = RUN_JAVA[m["module"]]
              picked.append(row)
          if not picked:
              raise SystemExit("boot-smoke: nothing to boot (modules=none and no covers)")
          print("modules=" + json.dumps(picked))
          EOF

  smoke:
    needs: plan
    name: Boot ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.modules) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # The game's JDK first, Gradle's second: the LAST setup-java wins JAVA_HOME, so
      # Gradle runs on ${{ matrix.java }} while JAVA_HOME_<run_java>_X64 stays exported
      # for smoke.py --run-java.
      - name: Set up game Java ${{ matrix.run_java }}
        if: ${{ matrix.run_java != '' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.run_java }}

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Headless GL deps (Xvfb + Mesa software rasterizer)
        run: |
          sudo apt-get update
          # x11-xserver-utils + libXxf86vm/libXrandr: LWJGL 2 (1.8.9) queries display
          # modes through them at Display.create() (same list as dev-shots.yml).
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libglu1-mesa libegl1 libegl-mesa0 \
            x11-xserver-utils libxxf86vm1 libxrandr2 libxcursor1 libxtst6

      # The real pinned Sodium + Iris (see dev-shots.yml): without them the boot never touches the
      # @Pseudo Sodium/Iris mixins. Skipped for modules with no libs/ pins (1.21.1 gets them from Gradle).
      - name: Fetch pinned Sodium + Iris into libs/
        if: ${{ matrix.cover == '' }}
        run: python3 tools/ci/perf_libs.py "src/mods/versions/${{ matrix.version }}"

      - name: Fetch the launcher's ImmediatelyFast + Mod Menu pins into run/extra-mods
        if: ${{ github.event.inputs.companions == 'true' && matrix.cover == '' }}
        run: python3 tools/ci/companion_mods.py "src/mods/versions/${{ matrix.version }}"

      - name: Download dependencies + assets (retried on Maven 429 / timeouts)
        if: ${{ matrix.cover == '' }}
        run: bash tools/ci/gradle_prefetch.sh "src/mods/versions/${{ matrix.version }}"

      # covers rows: build the module's release jar (what the launcher ships for every version it covers),
      # then a source-less Loom project for the covered version with that jar + the catalog's mods + Fabric API.
      - name: Build the covering module's jar (${{ matrix.version }})
        if: ${{ matrix.cover != '' }}
        working-directory: src/mods/versions/${{ matrix.version }}
        run: |
          for attempt in 1 2 3; do
            if sh ./gradlew build --no-daemon -x test \
                 -Dorg.gradle.internal.repository.max.retries=6 \
                 -Dorg.gradle.internal.repository.initial.backoff=1500 > gradle.log 2>&1; then
              ls -l build/libs; exit 0
            fi
            tail -n 40 gradle.log
            grep -qE "Could not (resolve|download|GET|HEAD|get resource)|Connection reset|Read timed out|Connect timed out|Remote host terminated|DownloadException|Failed to download" gradle.log || exit 1
            sleep $((attempt * 20))
          done
          exit 1

      - name: Prepare the covered-version boot (${{ matrix.cover }})
        if: ${{ matrix.cover != '' }}
        env:
          RUN_JAVA: ${{ matrix.run_java }}
          PAIR: ${{ matrix.pair }}
          PLAYER: ${{ matrix.player }}
        run: |
          # --run-java: keeps the version's own LWJGL (Loom upgrades it when Gradle's JVM is 19+; covers.py).
          python3 tools/boot-smoke/covers.py "src/mods/versions/${{ matrix.version }}" "${{ matrix.cover }}" \
            --out "build/covers/${{ matrix.cover }}" ${RUN_JAVA:+--run-java "$RUN_JAVA"} ${PAIR:+--pair "$PAIR"} ${PLAYER:+--player "$PLAYER"}
          bash tools/ci/gradle_prefetch.sh "build/covers/${{ matrix.cover }}"

      - name: Boot-smoke ${{ matrix.version }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          # 26.3+ (SDL3): Xvfb has no GLX visual SDL accepts; its EGL path works (dev-shots.yml).
          SDL_VIDEO_X11_NODIRECTCOLOR: "1"
          SDL_VIDEO_FORCE_EGL: "1"
          RUN_JAVA: ${{ matrix.run_java }}
          SMOKE_GRADLE_ARGS: ${{ github.event.inputs.gradle_args }}
          COMPANIONS: ${{ github.event.inputs.companions }}
          COVER: ${{ matrix.cover }}
          PAIR: ${{ matrix.pair }}
          PLAYER: ${{ matrix.player }}
          INWORLD_DIR: ${{ matrix.inworld == '1' && format('{0}/inworld', runner.temp) || '' }}
        run: |
          echo "Gradle JAVA_HOME=$JAVA_HOME"
          args=()
          if [ -n "$INWORLD_DIR" ]; then mkdir -p "$INWORLD_DIR/screenshots"; args+=(--inworld "$INWORLD_DIR"); fi
          if [ -n "$RUN_JAVA" ]; then args+=(--run-java "$RUN_JAVA"); fi
          m="src/mods/versions/${{ matrix.version }}"
          if [ -n "$COVER" ]; then
            # Named after the Minecraft version, so --companions checks that version's catalog row.
            m="build/covers/$COVER"
            args+=(--perf --companions)
            if [ -n "$PAIR$PLAYER" ]; then args+=(--expect-perf "$m/pair-expect.txt"); fi
          elif ls "$m"/libs/sodium*.jar >/dev/null 2>&1 || { grep -q 'maven.modrinth:sodium' "$m/build.gradle" && grep -q 'maven.modrinth:iris' "$m/build.gradle"; }; then args+=(--perf); fi
          for a in $SMOKE_GRADLE_ARGS; do args+=("--gradle-arg=$a"); done
          # companions=true: load the jars companion_mods.py fetched AND require them in the mod list
          # (a module whose runClient lacks the -PextraMods hook used to download them, load nothing, and pass).
          if [ "$COMPANIONS" = "true" ] && [ -z "$COVER" ]; then args+=(--companions "--gradle-arg=-PextraMods=run/extra-mods"); fi
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 tools/boot-smoke/smoke.py "$m" \
              --timeout "${{ github.event.inputs.timeout || 600 }}" "${args[@]}"

      - name: Upload the in-world shots
        if: ${{ always() && matrix.inworld == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: inworld-${{ matrix.version }}
          path: ${{ runner.temp }}/inworld/screenshots
          if-no-files-found: warn
