# Push-to-update pipeline, build side. Releases fire ONLY from a version tag
# pushed to main (Will: main always reflects at least the latest release;
# shipping is one deliberate act). To ship, from a green main:
#   git tag launcher-v1.0.N && git push origin launcher-v1.0.N
# — see docs/RELEASING.md. Running launchers poll the release feed
# (Core/Updates/UpdateService.cs), light the corner download badge, and
# self-update from the OriginLauncher-win-x64.zip asset. Updates are
# mandatory: a launcher older than the latest release refuses to launch the
# game until updated.
#
# COMPATIBILITY: installed launchers key on the launcher-v tag prefix and the
# exact asset names (OriginLauncher-win-x64.zip / OriginLauncher-Setup.exe).
# Never change those. New tags must be strictly greater than the last release.
# The launcher polls this feed UNAUTHENTICATED, so the repository (or at least
# its releases) must stay public.
#
# SHAPE (why a release takes minutes, not 12-40 of them):
#   1. Plan       (Linux, ~30s)  which mod modules changed since the previous
#                                published release (tools/release/plan.py);
#                                unchanged ones get their jar copied out of
#                                that release's zip; writes the release notes.
#   2. Mods       (Linux, parallel, ~2 min) build-mods.yml — one job per
#                                changed module, all at once.
#   3. Release    (Windows, ~4 min) bundle every jar into the WPF launcher,
#                                zip it, build the small Origin installer
#                                (src/OriginSetup, which downloads that zip)
#                                and smoke-test both, publish the release.
#   4. Mac        (macOS, both archs at once, after 3 succeeded) bundle the
#                                SAME jars into Origin.app (Apple Silicon on
#                                macos-15, Intel on macos-15-intel), ad-hoc
#                                sign, zip + disk image, prove both, then ADD
#                                the 6 Mac files to the release Windows already
#                                published (gh release upload). Nothing here can
#                                delete, change or hold up the Windows files; a
#                                release with no Mac zip just offers Mac
#                                launchers nothing (tools/release/mac/package.sh).
# The old single-job pipeline compiled every module back to back on one
# Windows runner.
#
# REHEARSAL: run it from the Actions tab (Run workflow) to do every step
# against the latest published release — plan, reuse, build, notes,
# installer, zip — WITHOUT publishing anything. The setup.exe, zip and notes
# land as a downloadable "rehearsal-release" artifact on the run instead (the
# Mac files as "rehearsal-release-mac"). The
# rehearsal exe is an unstamped dev build (1.0.0.0), so it never blocks or
# triggers updates. Any run not started by a launcher-v* tag is a rehearsal.
name: launcher-release

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  REHEARSAL: ${{ !startsWith(github.ref, 'refs/tags/launcher-v') }}
  # "next" tells plan.py to plan against the latest published release.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/launcher-v') && github.ref_name || 'next' }}

# Concurrency lives on the `release` job (below), not the whole run: a run-wide group was held
# until the Mac jobs finished (up to ~55 min plus the macos-15-intel queue), so a hotfix tag
# waited behind Mac packaging, and a third tag pushed meanwhile cancelled the waiting one
# (a tag with no release).

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      prev_tag: ${{ steps.plan.outputs.prev_tag }}
    steps:
      # Full history + tags: plan.py and notes.py diff against the previous
      # release tag, not just the last commit.
      - name: Check out code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide which Minecraft versions to rebuild
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/plan.py --release "$RELEASE_TAG" --reuse-dir "$RUNNER_TEMP/reused"

      # A tag run describes the tag; a rehearsal describes this commit.
      - name: Write release notes
        run: >
          python3 tools/release/notes.py
          --head "${{ startsWith(github.ref, 'refs/tags/launcher-v') && github.ref_name || github.sha }}"
          --prev "${{ steps.plan.outputs.prev_tag }}"
          --out "$RUNNER_TEMP/release-notes.md"

      # Reused jars travel the same way built ones do (<module>/<jar>), so the
      # release job can't tell them apart and needs no special case.
      - name: Upload reused mod jars
        uses: actions/upload-artifact@v7
        with:
          name: mod-reused
          path: ${{ runner.temp }}/reused
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 3

  mods:
    name: Mods
    needs: plan
    if: needs.plan.outputs.build != '[]'
    uses: ./.github/workflows/build-mods.yml
    with:
      modules: ${{ needs.plan.outputs.build }}
      fail-fast: true

  release:
    name: ${{ startsWith(github.ref, 'refs/tags/launcher-v') && 'Build launcher + publish release' || 'Build launcher (rehearsal, publishes nothing)' }}
    needs: [plan, mods]
    # Runs when the mod builds succeeded OR were skipped (nothing changed).
    if: ${{ !cancelled() && !failure() }}
    # Real releases publish one at a time; rehearsals never hold one up. Only this job holds the
    # group, so the Mac jobs after it never delay or cancel the next tag's Windows release.
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/launcher-v') && 'launcher-release' || format('launcher-rehearsal-{0}', github.ref) }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download mod jars
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: modjars
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      # The release a player sees is exactly the version Will typed — no run#.
      # A rehearsal stays unstamped (empty -> dev build 1.0.0.0).
      - name: Read version from tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:REHEARSAL -eq 'true') { "" } else { "$env:RELEASE_TAG".Substring("launcher-v".Length) }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish launcher with mod jars
        uses: ./.github/actions/publish-launcher
        with:
          jars-dir: modjars
          version: ${{ steps.ver.outputs.version }}

      # Makes both release files. OriginLauncher-win-x64.zip is the launcher
      # itself: installed launchers self-update from it, and the small
      # OriginLauncher-Setup.exe (src/OriginSetup) downloads it from the
      # newest release while it installs. Smoke-tested here (download
      # install, install of this zip, uninstall) before either can ship.
      - name: Build launcher zip + installer, smoke-test them
        uses: ./.github/actions/build-installer
        with:
          version: ${{ steps.ver.outputs.version }}

      # Installed launchers verify the self-update zip against this before they unpack it
      # (UpdateVerifier; docs/RELEASING.md -> Self-update integrity). sha256sum format, written
      # AFTER the zip is final: nothing below touches the zip again.
      - name: Hash the self-update zip
        shell: pwsh
        run: |
          $h = (Get-FileHash OriginLauncher-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("OriginLauncher-win-x64.zip.sha256", "$h  OriginLauncher-win-x64.zip`n")
          Write-Host "OriginLauncher-win-x64.zip.sha256: $h"

      - name: Keep rehearsal output as a run artifact
        if: env.REHEARSAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-release
          path: |
            OriginLauncher-win-x64.zip
            OriginLauncher-win-x64.zip.sha256
            OriginLauncher-Setup.exe
            notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

      # Only this job holds the concurrency group, so two quick tags can reach the publish step out
      # of order (the later tag rebuilt fewer mods). GitHub makes the newest-created release
      # "latest", and launchers read only "latest": an older tag publishing after a newer one must
      # not take it (newer launchers would see nothing, older ones would update backwards). Empty
      # flag = gh's default, exactly as before.
      - name: Keep Latest on the newest release
        id: latest
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_VERSION: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          $latest = gh release view --json tagName --jq .tagName 2>$null
          $found = $LASTEXITCODE -eq 0
          $newest = $null
          if ($found -and "$latest".StartsWith("launcher-v") -and [version]::TryParse("$latest".Substring(10), [ref]$newest) `
              -and $newest -gt [version]$env:THIS_VERSION) {
            Write-Host "$latest is newer than $($env:THIS_VERSION), so this release is published without taking Latest"
            echo "flag=--latest=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "flag=" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Publish GitHub release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create "${{ env.RELEASE_TAG }}"
          OriginLauncher-win-x64.zip
          OriginLauncher-win-x64.zip.sha256
          OriginLauncher-Setup.exe
          --title "Origin Launcher ${{ steps.ver.outputs.version }}"
          --notes-file notes\release-notes.md
          ${{ steps.latest.outputs.flag }}

  # ---- Mac (after the Windows job, never in its way) ----
  # needs: release + "release succeeded": by the time this starts the Windows release is published
  # (or the rehearsal artifact kept), and these jobs only ever ADD files. A failure here leaves the
  # Windows release exactly as it is; Mac launchers find no zip for their arch and offer nothing.
  mac:
    name: Mac app (${{ matrix.rid }})
    needs: [plan, mods, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    # Read-only: dotnet publish runs third-party NuGet build code here, so this job's token must not
    # be able to touch any release (it could otherwise swap the Windows zip and its .sha256 together).
    # Only mac-publish, which checks nothing out and runs no third-party code, can write.
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Each arch on its own hardware: an x64 build under Rosetta crashed at web view creation,
        # so Rosetta proves nothing about Intel Macs. The names are the published asset names
        # (check_consistency.py check_mac_release holds them equal to MacReleaseAssets.cs).
        include:
          - os: macos-15
            rid: osx-arm64
            zip: OriginLauncher-osx-arm64.zip
            dmg: Origin-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            rid: osx-x64
            zip: OriginLauncher-osx-x64.zip
            dmg: Origin-Mac-Intel.dmg
    steps:
      # No token left in .git/config for the build steps to find.
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same artifacts the Windows job bundled (built + reused jars).
      - name: Download mod jars
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: modjars
          merge-multiple: true

      # The Windows zip this release ships, to prove the Mac app bundles byte-identical jars.
      - name: Download the Windows launcher zip (rehearsal artifact)
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@v8
        with:
          name: rehearsal-release
          path: windows
      - name: Download the Windows launcher zip (published release)
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern OriginLauncher-win-x64.zip --dir windows

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Same rule as the Windows job: exactly the tag's version; a rehearsal stays unstamped. The tag
      # name only ever travels as an environment variable, and must be a plain 1.2.3 version.
      - name: Read version from tag
        id: ver
        run: |
          if [ "$REHEARSAL" = "true" ]; then v=""; else v="${RELEASE_TAG#launcher-v}"; fi
          if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $RELEASE_TAG is not launcher-v<major>.<minor>.<patch>; the Mac build needs a plain version"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Publish, bundle, sign, zip, hash, disk image; then verify the zip the way the self-update
      # unpacks it and run --self-test from the mounted disk image.
      - name: Build, sign and prove the Mac app
        env:
          MAC_VERSION: ${{ steps.ver.outputs.version }}
          MAC_RID: ${{ matrix.rid }}
          MAC_ZIP: ${{ matrix.zip }}
          MAC_DMG: ${{ matrix.dmg }}
        run: >
          bash tools/release/mac/package.sh "$MAC_RID" "$MAC_VERSION"
          modjars mac-out "$MAC_ZIP" "$MAC_DMG" windows/OriginLauncher-win-x64.zip

      - name: Keep this arch's files for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.rid }}
          path: |
            mac-out/${{ matrix.zip }}
            mac-out/${{ matrix.zip }}.sha256
            mac-out/${{ matrix.dmg }}
          if-no-files-found: error
          retention-days: 3

  mac-publish:
    name: ${{ startsWith(github.ref, 'refs/tags/launcher-v') && 'Add the Mac files to the release' || 'Keep the Mac files (rehearsal, publishes nothing)' }}
    needs: mac
    # Both arches or neither: the website links both disk images.
    if: ${{ !cancelled() && needs.mac.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download both archs
        uses: actions/download-artifact@v8
        with:
          pattern: mac-osx-*
          path: mac
          merge-multiple: true

      - name: Keep rehearsal output as a run artifact
        if: env.REHEARSAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-release-mac
          path: |
            mac/OriginLauncher-osx-arm64.zip.sha256
            mac/OriginLauncher-osx-x64.zip.sha256
            mac/OriginLauncher-osx-arm64.zip
            mac/OriginLauncher-osx-x64.zip
            mac/Origin-Mac-AppleSilicon.dmg
            mac/Origin-Mac-Intel.dmg
          if-no-files-found: error
          retention-days: 7

      # Adds to the release the Windows job created; never creates, edits or deletes it. Two
      # uploads: the hashes finish before any zip starts, so a Mac launcher polling mid-upload never
      # sees a zip without its .sha256 (one upload call may send its files in any order).
      # --clobber only so a re-run of a failed Mac upload can replace its own half-uploaded files.
      - name: Add the Mac hashes to the release
        if: env.REHEARSAL != 'true'
        working-directory: mac
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: >
          gh release upload "$RELEASE_TAG" --repo "$REPO" --clobber
          OriginLauncher-osx-arm64.zip.sha256
          OriginLauncher-osx-x64.zip.sha256

      - name: Add the Mac downloads to the release
        if: env.REHEARSAL != 'true'
        working-directory: mac
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: >
          gh release upload "$RELEASE_TAG" --repo "$REPO" --clobber
          OriginLauncher-osx-arm64.zip
          OriginLauncher-osx-x64.zip
          Origin-Mac-AppleSilicon.dmg
          Origin-Mac-Intel.dmg
