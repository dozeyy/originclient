# Compile verification for every change — the counterpart to
# launcher-release.yml, which only fires from launcher-v* tags. This one runs
# on pushes to main and working branches, on PRs and by hand, builds every live mod +
# the launcher exactly like a release would (same build-mods.yml, same
# publish-launcher action, same bundled-jar assert), and publishes NOTHING.
# It exists so code written in environments that can't build (e.g. the remote
# dev sandbox, where Gradle/Mojang downloads are blocked) is machine-verified
# before it ever reaches the release channel. Only tag commits that are green
# here (docs/RELEASING.md).
#
# Shape: shared-core drift check + module list (Linux) -> every live mod in
# parallel (Linux) -> launcher publish with all jars bundled (Windows).
name: build-check

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "tools/shared-sync/**"
      - "tools/release/**"
      - "tools/loading-bar-tests/**"
      - "tools/boot-smoke/**"
      - "tools/bench/**"
      - "tools/ci/**"
      - ".github/workflows/build-check.yml"
      - ".github/workflows/build-mods.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "src/**"
      - "tools/shared-sync/**"
      - "tools/release/**"
      - "tools/loading-bar-tests/**"
      - "tools/boot-smoke/**"
      - "tools/bench/**"
      - "tools/ci/**"
      - ".github/workflows/build-check.yml"
      - ".github/workflows/build-mods.yml"
      - ".github/actions/**"
  # By hand (Run workflow), e.g. to re-test a CI-tool change.
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Shared-core check + version list
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Drift gate for the shared mod core: every module's copy of
      # src/mods/shared/ files must be byte-identical to shared/ (or listed in
      # that module's overrides.txt as a deliberate fork). Catches edits made
      # in a module that belong in shared/, and shared/ edits never synced.
      - name: Check shared-core sync
        run: python3 tools/shared-sync/sync.py --check

      # The loading screen's bar (LoadBar, pure Java): never backward within a
      # load, never full before the reload is done, never standing still; and
      # every module's copy byte-identical (pre-1.20 copies are outside sync).
      - name: Test loading bar
        run: python3 tools/loading-bar-tests/run.py

      # The 1.8.9 benchmark's own tests: summarizer maths (known CSV -> known numbers, corrupt CSV -> loud
      # failure), the production-like launcher's pure logic, and bench-189.ps1 -DryRun against fixtures.
      - name: Test benchmark tools
        run: |
          python3 -m unittest discover -s tools/bench
          pwsh -NoProfile -File tools/bench/test-dryrun.ps1

      # Facts kept in two places (launcher vs installer) must agree.
      - name: Check launcher/installer consistency
        run: python3 tools/release/check_consistency.py

      # The CI gates can fail: dev-shots' PNG-count gate, boot-smoke's title-screen
      # ready marker (present in every live module) and its retry rules.
      - name: Test CI gates
        run: python3 tools/ci/test_ci_gates.py

      - name: Release-notes filter tests
        run: python3 tools/release/test_notes.py

      # The installer's engine: release feed, download (resume, verify,
      # failures — against a fake server), launcher zip, staging, folder
      # rules. Also compiles it for .NET Framework 4.7.2 (the API check).
      - name: Test installer engine
        run: |
          dotnet build src/OriginSetup.Tests -f net472
          dotnet test src/OriginSetup.Tests -f net8.0

      # The launcher's pure logic (home banner feed + fallback chain, Discord
      # invite, visibility gate, occlusion math). Also fails the push when
      # website/launcher/promos.json stops parsing.
      - name: Test launcher logic
        run: dotnet test src/OriginLauncher.Tests

      - name: List live Minecraft versions
        id: plan
        run: python3 tools/release/plan.py --all

  mods:
    name: Mods
    needs: plan
    uses: ./.github/workflows/build-mods.yml
    with:
      modules: ${{ needs.plan.outputs.build }}
      # Keep building the rest when one fails, so one push shows every
      # broken version at once.
      fail-fast: false

  launcher:
    name: Launcher (publish check)
    needs: mods
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download mod jars
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: modjars
          merge-multiple: true

      - name: Publish launcher with mod jars (verify only)
        uses: ./.github/actions/publish-launcher
        with:
          jars-dir: modjars

      # WPF windows built headless (never shown): the crash dialogs must still appear when the theme fails to load.
      - name: WPF tests (crash window fallback)
        run: dotnet test src/OriginLauncher.UiTests

      # Same launcher zip + installer build and smoke test as a release.
      - name: Build + smoke-test installer
        uses: ./.github/actions/build-installer
        with:
          screenshots: "true"
