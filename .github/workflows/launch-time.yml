# Launch time: the launcher's side of a Play press (Play -> the java process,
# then the JVM to Fabric's mod list), measured, A/B. Complements boot-time.yml,
# which times the game itself (JVM start -> interactive title) on Linux.
#
# Runs the real provisioning path headlessly (OriginLauncher.App.exe
# --launch-timing, Core/Launch/LaunchTimingHarness.cs) in a throwaway launcher
# folder on a Windows runner, with the launcher published exactly like a release
# (single-file, self-contained) and this ref's 1.21.1 jar bundled:
#   cold = a fresh launcher folder: Java, libraries, assets and mods all download
#   warm = the same folder again in a new launcher process (a returning player
#          opening the launcher and pressing Play)
# Each round boots variant a (base ref) and b (this ref) in alternating order on
# the one runner: one cold launch then `warm` warm launches each. The runner has
# no OpenGL, so the game is stopped once its log passes Fabric's mod list.
# Compare a and b as a relative change; a runner is not a player's PC.
#
# Start it from a push to a claude/** branch whose head commit message carries
#   [launch-time base=<branch, tag or FULL 40-char sha> rounds=3 warm=3 label=x]
# (every key optional; a bare [launch-time] measures this ref alone), or by hand
# (Run workflow) once this file is on main. Summary: tools/launch-time/summarize.py.
name: launch-time

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Ref/SHA to compare against (variant a); empty = only this ref"
        default: ""
      rounds:
        description: "Rounds (each: one cold + `warm` warm launches per variant)"
        default: "3"
      warm:
        description: "Warm launches per round"
        default: "3"
      label:
        description: "Optional run name (keeps parallel runs from cancelling each other)"
        default: ""

permissions:
  contents: read

concurrency:
  group: launch-time-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.label || github.sha }}
  cancel-in-progress: true

jobs:
  cfg:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-time')
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.cfg.outputs.base }}
      rounds: ${{ steps.cfg.outputs.rounds }}
      warm: ${{ steps.cfg.outputs.warm }}
      label: ${{ steps.cfg.outputs.label }}
      variants: ${{ steps.cfg.outputs.variants }}
    steps:
      - id: cfg
        env:
          MSG: ${{ github.event.head_commit.message }}
          I_BASE: ${{ github.event.inputs.base_ref }}
          I_ROUNDS: ${{ github.event.inputs.rounds }}
          I_WARM: ${{ github.event.inputs.warm }}
          I_LABEL: ${{ github.event.inputs.label }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = {"base": "", "rounds": "3", "warm": "3", "label": ""}
          if os.environ.get("I_ROUNDS"):
              cfg.update(base=os.environ.get("I_BASE", ""), rounds=os.environ["I_ROUNDS"],
                         warm=os.environ.get("I_WARM") or "3", label=os.environ.get("I_LABEL", ""))
          else:
              m = re.findall(r"\[launch-time([^\]]*)\]", os.environ.get("MSG", ""))
              for tok in (m[-1].split() if m else []):
                  if "=" in tok:
                      k, v = tok.split("=", 1)
                      if k in cfg and re.fullmatch(r"[A-Za-z0-9._/=,:+-]+", v):
                          cfg[k] = v
          for k in ("rounds", "warm"):
              if not re.fullmatch(r"\d{1,2}", cfg[k]):
                  cfg[k] = "3"
          cfg["variants"] = json.dumps(["a", "b"] if cfg["base"] else ["b"])
          for k, v in cfg.items():
              print(f"{k}={v}")
          PY

  jar:
    needs: cfg
    name: Build the 1.21.1 jar (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.cfg.outputs.variants) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.variant == 'a' && needs.cfg.outputs.base || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        working-directory: src/mods/versions/1.21.1
        run: |
          for attempt in 1 2 3; do
            sh ./gradlew build --no-daemon -x test \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=1500 && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Collect jar
        working-directory: src/mods/versions/1.21.1
        run: |
          mkdir -p "$RUNNER_TEMP/jar"
          find build/libs -maxdepth 1 -name 'originclient-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} "$RUNNER_TEMP/jar/" \;
          ls -la "$RUNNER_TEMP/jar"
          [ "$(ls "$RUNNER_TEMP/jar" | wc -l)" -eq 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.variant }}
          path: ${{ runner.temp }}/jar/

  time:
    needs: [cfg, jar]
    name: Launch time (1.21.1)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: b
      - uses: actions/checkout@v7
        if: needs.cfg.outputs.base != ''
        with:
          path: a
          ref: ${{ needs.cfg.outputs.base }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
      - name: Publish each variant like a release (single file, 1.21.1 jar bundled)
        shell: pwsh
        run: |
          foreach ($v in @('a', 'b')) {
            if (-not (Test-Path $v)) { continue }
            $libs = "$v/src/mods/versions/1.21.1/build/libs"
            New-Item -ItemType Directory -Force -Path $libs | Out-Null
            Copy-Item "jars/jar-$v/*.jar" $libs
            dotnet publish "$v/src/OriginLauncher.App/OriginLauncher.App.csproj" -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "pub-$v" | Select-Object -Last 3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path "pub-$v/Bundled/OriginClient/originclient-1.21.1.jar")) { Write-Error "no bundled jar ($v)"; exit 1 }
          }
          Get-CimInstance Win32_Processor | Select-Object -First 1 Name, NumberOfLogicalProcessors | Format-List
      - name: Launch (cold + warm, alternating variants)
        shell: pwsh
        env:
          ROUNDS: ${{ needs.cfg.outputs.rounds }}
          WARM: ${{ needs.cfg.outputs.warm }}
        run: |
          $out = "$env:RUNNER_TEMP/launches"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $variants = @('b'); if (Test-Path a) { $variants = @('a', 'b') }
          $failed = 0
          for ($i = 1; $i -le [int]$env:ROUNDS; $i++) {
            $order = $variants
            if ($i % 2 -eq 0 -and $variants.Count -eq 2) { $order = @('b', 'a') }
            foreach ($v in $order) {
              $root = "$env:RUNNER_TEMP/root-$v-$i"
              for ($n = 0; $n -le [int]$env:WARM; $n++) {
                $json = "$out/$v-$i-$n.json"
                $p = Start-Process "pub-$v/OriginLauncher.App.exe" -ArgumentList "--launch-timing `"$root`" 1.21.1 `"$json`"" -PassThru
                if (-not $p.WaitForExit(600000)) { Write-Host "::warning::$v-$i-$n hung; killed"; $p.Kill($true); $p.WaitForExit() }
                $kind = if ($n -eq 0) { 'cold' } else { 'warm' }
                $start = '-'
                if (Test-Path $json) {
                  $r = Get-Content $json -Raw | ConvertFrom-Json
                  $start = ($r.marks | Where-Object name -eq 'process-start' | Select-Object -First 1).ms
                  if ($r.error) { Write-Host "::warning::$v-$i-$n failed: $($r.error.Split("`n")[0])"; $failed++ }
                } else { Write-Host "::warning::$v-$i-$n wrote no result (exit $($p.ExitCode))"; $failed++ }
                Write-Host "$v round $i $kind #$n : Play -> java start $start ms (exit $($p.ExitCode))"
              }
              # The cold folder is ~1 GB; only its results are kept.
              Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            }
          }
          python b/tools/launch-time/summarize.py $out | Tee-Object -FilePath "$out/summary.md"
          Get-Content "$out/summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($failed -gt 0) { Write-Host "::error::$failed launches failed (see the json files)"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-time${{ needs.cfg.outputs.label != '' && format('-{0}', needs.cfg.outputs.label) || '' }}
          path: ${{ runner.temp }}/launches/
