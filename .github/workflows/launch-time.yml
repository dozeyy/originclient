# Launch time: the launcher's side of a Play press (Play -> the java process,
# then the JVM to Fabric's mod list), measured, A/B. Complements boot-time.yml,
# which times the game itself (JVM start -> interactive title) on Linux.
#
# Runs the real provisioning path headlessly (OriginLauncher.App.exe
# --launch-timing, Core/Launch/LaunchTimingHarness.cs) in a throwaway launcher
# folder on a Windows runner, with the launcher published exactly like a release
# (single-file, self-contained) and this ref's mod jars bundled:
#   cold = a fresh launcher folder: Java, libraries, assets and mods all download
#   warm = the same folder again in a new launcher process (a returning player
#          opening the launcher and pressing Play)
# Each round boots variant a (base ref) and b (this ref) in alternating order on
# the one runner: one cold launch then `warm` warm launches each, of 1.21.1. The
# runner has no OpenGL, so the game is stopped once its log passes Fabric's mod
# list (or it exits on its own). Compare a and b as a relative change; a runner
# is not a player's PC.
#
# Extra keys:
#   versions=1.21.1,1.16.5  also launch these versions (round 1 only: one cold +
#                           one warm per variant), results as <variant><ver>-1-n
#                           (e.g. b1165-1-0.json) with the java the game ran on
#   offline=1               after round 1's warm launches, launch 1.21.1 twice
#                           more with no network (HTTP(S)_PROXY pointed at a dead
#                           port): once on the fast path, once with the install
#                           stamp deleted (full verify). <variant>-1-offfast/offfull
#                           Then once more with the fabric-loader jar deleted
#                           (offmissing): b must fail with OfflineInstallException.
#
# Start it from a push to a claude/** branch whose head commit message carries
#   [launch-time base=<branch, tag or FULL 40-char sha> rounds=3 warm=3 label=x]
# (every key optional; a bare [launch-time] measures this ref alone), or by hand
# (Run workflow) once this file is on main. Summary: tools/launch-time/summarize.py.
name: launch-time

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Ref/SHA to compare against (variant a); empty = only this ref"
        default: ""
      rounds:
        description: "Rounds (each: one cold + `warm` warm launches per variant)"
        default: "3"
      warm:
        description: "Warm launches per round"
        default: "3"
      versions:
        description: "Comma-separated versions to launch (1.21.1 is always the timed one)"
        default: "1.21.1"
      offline:
        description: "1 = also launch with no network (fast + full verify)"
        default: "0"
      label:
        description: "Optional run name (keeps parallel runs from cancelling each other)"
        default: ""

permissions:
  contents: read

concurrency:
  group: launch-time-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.label || github.sha }}
  cancel-in-progress: true

jobs:
  cfg:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-time')
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.cfg.outputs.base }}
      rounds: ${{ steps.cfg.outputs.rounds }}
      warm: ${{ steps.cfg.outputs.warm }}
      versions: ${{ steps.cfg.outputs.versions }}
      offline: ${{ steps.cfg.outputs.offline }}
      label: ${{ steps.cfg.outputs.label }}
      jars: ${{ steps.cfg.outputs.jars }}
    steps:
      - id: cfg
        env:
          MSG: ${{ github.event.head_commit.message }}
          I_BASE: ${{ github.event.inputs.base_ref }}
          I_ROUNDS: ${{ github.event.inputs.rounds }}
          I_WARM: ${{ github.event.inputs.warm }}
          I_VERSIONS: ${{ github.event.inputs.versions }}
          I_OFFLINE: ${{ github.event.inputs.offline }}
          I_LABEL: ${{ github.event.inputs.label }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = {"base": "", "rounds": "3", "warm": "3", "versions": "1.21.1", "offline": "0", "label": ""}
          if os.environ.get("I_ROUNDS"):
              cfg.update(base=os.environ.get("I_BASE", ""), rounds=os.environ["I_ROUNDS"],
                         warm=os.environ.get("I_WARM") or "3", versions=os.environ.get("I_VERSIONS") or "1.21.1",
                         offline=os.environ.get("I_OFFLINE") or "0", label=os.environ.get("I_LABEL", ""))
          else:
              m = re.findall(r"\[launch-time([^\]]*)\]", os.environ.get("MSG", ""))
              for tok in (m[-1].split() if m else []):
                  if "=" in tok:
                      k, v = tok.split("=", 1)
                      if k in cfg and re.fullmatch(r"[A-Za-z0-9._/=,:+-]+", v):
                          cfg[k] = v
          for k in ("rounds", "warm"):
              if not re.fullmatch(r"\d{1,2}", cfg[k]):
                  cfg[k] = "3"
          vers = [v for v in cfg["versions"].split(",") if re.fullmatch(r"\d+(\.\d+){1,2}", v)]
          vers = ["1.21.1"] + [v for v in vers if v != "1.21.1"]
          cfg["versions"] = ",".join(vers)
          cfg["offline"] = "1" if cfg["offline"] == "1" else "0"
          variants = ["a", "b"] if cfg["base"] else ["b"]
          cfg["jars"] = json.dumps([{"variant": v, "version": ver} for v in variants for ver in vers])
          for k, v in cfg.items():
              print(f"{k}={v}")
          PY

  jar:
    needs: cfg
    name: Build the ${{ matrix.version }} jar (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include: ${{ fromJSON(needs.cfg.outputs.jars) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.variant == 'a' && needs.cfg.outputs.base || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 26.x modules build on JDK 25 (live-modules.json "java"); every other module on 21.
          java-version: ${{ startsWith(matrix.version, '26.') && '25' || '21' }}
      - name: Build
        working-directory: src/mods/versions/${{ matrix.version }}
        run: |
          for attempt in 1 2 3; do
            sh ./gradlew build --no-daemon -x test \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=1500 && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Collect jar
        working-directory: src/mods/versions/${{ matrix.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/jar"
          find build/libs -maxdepth 1 -name 'originclient-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} "$RUNNER_TEMP/jar/" \;
          ls -la "$RUNNER_TEMP/jar"
          [ "$(ls "$RUNNER_TEMP/jar" | wc -l)" -eq 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.variant }}-${{ matrix.version }}
          path: ${{ runner.temp }}/jar/

  time:
    needs: [cfg, jar]
    name: Launch time (1.21.1)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          path: b
      - uses: actions/checkout@v7
        if: needs.cfg.outputs.base != ''
        with:
          path: a
          ref: ${{ needs.cfg.outputs.base }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
      - name: Publish each variant like a release (single file, jars bundled)
        shell: pwsh
        env:
          VERSIONS: ${{ needs.cfg.outputs.versions }}
        run: |
          foreach ($v in @('a', 'b')) {
            if (-not (Test-Path $v)) { continue }
            foreach ($ver in $env:VERSIONS.Split(',')) {
              $libs = "$v/src/mods/versions/$ver/build/libs"
              New-Item -ItemType Directory -Force -Path $libs | Out-Null
              Copy-Item "jars/jar-$v-$ver/*.jar" $libs
            }
            dotnet publish "$v/src/OriginLauncher.App/OriginLauncher.App.csproj" -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "pub-$v" | Select-Object -Last 3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($ver in $env:VERSIONS.Split(',')) {
              if (-not (Test-Path "pub-$v/Bundled/OriginClient/originclient-$ver.jar")) { Write-Error "no bundled $ver jar ($v)"; exit 1 }
            }
            $exe = Get-Item "pub-$v/OriginLauncher.App.exe"
            $all = (Get-ChildItem "pub-$v" -Recurse -File | Measure-Object Length -Sum).Sum
            Write-Host ("publish size ${v}: exe {0:N1} MB, folder {1:N1} MB" -f ($exe.Length / 1MB), ($all / 1MB))
          }
          Get-CimInstance Win32_Processor | Select-Object -First 1 Name, NumberOfLogicalProcessors | Format-List
      - name: Launch (cold + warm, alternating variants)
        shell: pwsh
        env:
          ROUNDS: ${{ needs.cfg.outputs.rounds }}
          WARM: ${{ needs.cfg.outputs.warm }}
          VERSIONS: ${{ needs.cfg.outputs.versions }}
          OFFLINE: ${{ needs.cfg.outputs.offline }}
        run: |
          $out = "$env:RUNNER_TEMP/launches"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $variants = @('b'); if (Test-Path a) { $variants = @('a', 'b') }
          $script:failed = 0
          function Launch($v, $root, $ver, $json, $label, [switch]$expectFail, [switch]$fresh) {
            $p = Start-Process "pub-$v/OriginLauncher.App.exe" -ArgumentList "--launch-timing `"$root`" $ver `"$json`"" -PassThru
            if (-not $p.WaitForExit(600000)) { Write-Host "::warning::$label hung; killed"; $p.Kill($true); $p.WaitForExit() }
            $start = '-'
            if (Test-Path $json) {
              $r = Get-Content $json -Raw | ConvertFrom-Json
              $start = ($r.marks | Where-Object name -eq 'process-start' | Select-Object -First 1).ms
              if ($r.error) {
                Write-Host "::warning::$label failed: $($r.error.Split("`n")[0])"
                if (-not $expectFail) { $script:failed++ }
              }
              # Play on a version with nothing installed (U3.3) installs it by itself and leaves it installed:
              # the folder was empty before, every piece is there after, and the install journal is closed.
              # (Variant a is the base ref, which doesn't write these fields.)
              if ($fresh -and $v -eq 'b' -and -not $r.error) {
                if ($r.installBefore -notin @('NotInstalled', 'Partial') -or $r.installAfter -ne 'Installed' -or $r.installJournalOpen) {
                  Write-Host "::error::$label : install state before=$($r.installBefore) after=$($r.installAfter) journalOpen=$($r.installJournalOpen) (wanted NotInstalled -> Installed, journal closed)"
                  $script:failed++
                }
              }
            } else { Write-Host "::warning::$label wrote no result (exit $($p.ExitCode))"; $script:failed++ }
            Write-Host "$label : Play -> java start $start ms (exit $($p.ExitCode))"
          }
          for ($i = 1; $i -le [int]$env:ROUNDS; $i++) {
            $order = $variants
            if ($i % 2 -eq 0 -and $variants.Count -eq 2) { $order = @('b', 'a') }
            foreach ($v in $order) {
              $root = "$env:RUNNER_TEMP/root-$v-$i"
              for ($n = 0; $n -le [int]$env:WARM; $n++) {
                $kind = if ($n -eq 0) { 'cold' } else { 'warm' }
                Launch $v $root '1.21.1' "$out/$v-$i-$n.json" "$v round $i $kind #$n" -fresh:($n -eq 0)
              }
              if ($i -eq 1 -and $env:OFFLINE -eq '1') {
                # No network: every HttpClient in the launcher honours these, and
                # port 9 refuses at once. The game (Java) ignores them.
                $env:HTTPS_PROXY = 'http://127.0.0.1:9'; $env:HTTP_PROXY = 'http://127.0.0.1:9'
                Launch $v $root '1.21.1' "$out/$v-$i-offfast.json" "$v offline fast path" -expectFail
                Remove-Item "$root/instances/1.21.1/origin-verified.json" -Force -ErrorAction SilentlyContinue
                Launch $v $root '1.21.1' "$out/$v-$i-offfull.json" "$v offline full verify" -expectFail
                # A library missing while offline must end in the plain "you're
                # offline" error (OfflineInstallException), never a raw crash.
                $lib = Get-ChildItem "$root/instances/1.21.1/libraries" -Recurse -Filter 'fabric-loader-*.jar' | Select-Object -First 1
                if ($lib) { Remove-Item $lib.FullName -Force; Write-Host "removed $($lib.Name)" } else { Write-Host "::error::no fabric-loader jar to remove"; $script:failed++ }
                $miss = "$out/$v-$i-offmissing.json"
                Launch $v $root '1.21.1' $miss "$v offline missing library" -expectFail
                if ($v -eq 'b') {
                  $e = if (Test-Path $miss) { (Get-Content $miss -Raw | ConvertFrom-Json).error } else { $null }
                  if ($e -and $e -match "OfflineInstallException: You're offline") { Write-Host "offline missing library: clear offline message" }
                  else { Write-Host "::error::offline missing library did not end in OfflineInstallException"; $script:failed++ }
                }
                Remove-Item Env:HTTPS_PROXY; Remove-Item Env:HTTP_PROXY
              }
              if ($i -eq 1) {
                foreach ($ver in $env:VERSIONS.Split(',')) {
                  if ($ver -eq '1.21.1') { continue }
                  $tag = $v + $ver.Replace('.', '')
                  for ($n = 0; $n -le 1; $n++) {
                    Launch $v $root $ver "$out/$tag-1-$n.json" "$v $ver #$n" -fresh:($n -eq 0)
                  }
                }
              }
              # The cold folder is ~1 GB; only its results are kept.
              Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            }
          }
          python b/tools/launch-time/summarize.py $out | Tee-Object -FilePath "$out/summary.md"
          Get-Content "$out/summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($script:failed -gt 0) { Write-Host "::error::$($script:failed) launches failed (see the json files)"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-time${{ needs.cfg.outputs.label != '' && format('-{0}', needs.cfg.outputs.label) || '' }}
          path: ${{ runner.temp }}/launches/
