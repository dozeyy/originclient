# TEMPORARY (qol-shared lane, 2026-11-04): javap of the mapped Minecraft classes the QoL fixes
# touch, per module, so each mixin is written against the real signatures. Deleted before merge.
name: qol-shared-probe

on:
  push:
    branches: ["claude/qol-shared"]
    paths: [".github/workflows/qol-shared-probe.yml"]

permissions:
  contents: read

jobs:
  javap:
    name: javap ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module: ["1.20", "1.20.2", "1.20.4", "1.21", "1.21.4", "1.21.6", "1.21.10", "1.21.11"]
    defaults:
      run:
        working-directory: src/mods/versions/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Loom setup (maps Minecraft)
        shell: bash
        run: sh ./gradlew --no-daemon -q help > /dev/null 2>&1 || sh ./gradlew --no-daemon help 2>&1 | tail -n 30
      - name: javap
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, os, re, subprocess, zipfile
          roots = [os.path.expanduser("~/.gradle"), ".gradle", "build"]
          jars = []
          for r in roots:
              jars += glob.glob(f"{r}/**/*.jar", recursive=True)
          def has(j, cls):
              try:
                  return cls in zipfile.ZipFile(j).namelist()
              except Exception:
                  return False
          # the mapped (named) jars: they carry Mojmap class names
          mc = [j for j in jars if "minecraft" in os.path.basename(j).lower()
                and (has(j, "net/minecraft/client/Minecraft.class") or has(j, "net/minecraft/world/entity/player/Abilities.class"))]
          mc = sorted(set(mc), key=len)
          print("jars:", mc)
          cp = ":".join(mc)
          def javap(cls, code=False, methods=None, grep=None):
              args = ["javap", "-p"] + (["-c"] if code else []) + ["-cp", cp, cls]
              out = subprocess.run(args, capture_output=True, text=True).stdout
              if not out:
                  print(f"#### {cls}: NOT FOUND"); return
              if methods:
                  # print only the method blocks whose header names one of `methods`
                  blocks = re.split(r"\n(?=  \S)", out)
                  out = "\n".join(b for b in blocks if any(re.search(r"\b" + m + r"\(", b.split("\n")[0]) for m in methods))
              if grep:
                  out = "\n".join(l for l in out.splitlines() if re.search(grep, l))
              print(f"#### {cls}" + (f" [{','.join(methods)}]" if methods else "") + (f" grep {grep}" if grep else ""))
              print(out)
          javap("net.minecraft.client.gui.screens.ProgressScreen", code=True)
          javap("net.minecraft.client.resources.DownloadedPackSource", code=True, grep=r"ProgressScreen|^  \S")
          javap("net.minecraft.client.resources.server.DownloadedPackSource", grep=r"ProgressScreen")
          javap("net.minecraft.client.Minecraft", code=True, methods=["getFramerateLimit", "createTitle"])
          javap("net.minecraft.client.Minecraft", grep=r"updateTitle|getOverlay|getUser\(")
          javap("com.mojang.blaze3d.platform.FramerateLimitTracker", code=True)
          javap("com.mojang.blaze3d.platform.Window", grep=r"FramerateLimit|setIcon|getWindow\(|handle\(")
          javap("net.minecraft.client.Options", grep=r"framerateLimit|inactivityFpsLimit")
          javap("net.minecraft.client.KeyboardHandler", grep=r"keyPress|charTyped")
          javap("net.minecraft.client.MouseHandler", grep=r"onPress|onButton")
          javap("net.minecraft.client.gui.screens.LoadingOverlay", code=True, methods=["render"], grep=r"invoke|render\(")
          javap("net.minecraft.client.gui.GuiGraphics", grep=r"requestCursor|cursor")
          javap("com.mojang.blaze3d.platform.cursor.CursorTypes")
          javap("net.minecraft.client.gui.components.AbstractWidget", code=True, methods=["render", "handleCursor", "playDownSound", "playButtonClickSound"], grep=r"invoke|Cursor|  \S")
          javap("net.minecraft.client.gui.components.AbstractButton", code=True, methods=["renderWidget", "renderContents", "renderDefaultSprite"], grep=r"invoke|Cursor|  \S")
          javap("net.minecraft.client.gui.components.AbstractSliderButton", code=True, methods=["renderWidget"], grep=r"invoke|Cursor|  \S")
          javap("net.minecraft.client.gui.components.EditBox", code=True, methods=["renderWidget"], grep=r"Cursor")
          javap("net.minecraft.client.resources.sounds.SimpleSoundInstance", grep=r"forUI")
          javap("net.minecraft.sounds.SoundEvents", grep=r"UI_BUTTON_CLICK")
          javap("net.minecraft.world.entity.player.Abilities", grep=r"FlyingSpeed")
          javap("net.minecraft.client.gui.screens.PauseScreen", grep=r"createPauseMenu|init\(")
          EOF
