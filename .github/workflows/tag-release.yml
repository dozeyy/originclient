# ONE-SHOT helper (Will, 2026-10-18: "just for this one release now without me").
# Cloud sessions can't push tags (the git proxy drops them), so this tags main
# from inside Actions and starts launcher-release.yml on that tag. A tag pushed
# with GITHUB_TOKEN never triggers workflows on its own; workflow_dispatch is the
# one exception, hence the explicit `gh workflow run`. Deleted right after use —
# the normal path stays Will pushing the tag himself (docs/RELEASING.md).
name: tag-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "launcher-v1.0.N to create (blank = next after the latest tag)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag main and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            last=$(git tag -l 'launcher-v1.0.*' | sed 's/^launcher-v1\.0\.//' | sort -n | tail -1)
            tag="launcher-v1.0.$((last + 1))"
          fi
          [[ "$tag" =~ ^launcher-v1\.0\.[0-9]+$ ]] || { echo "bad tag: $tag"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"; exit 1
          fi
          echo "Tagging $(git rev-parse --short HEAD) as $tag"
          git tag "$tag" HEAD
          git push origin "refs/tags/$tag"
          gh workflow run launcher-release.yml --repo "${{ github.repository }}" --ref "$tag"
