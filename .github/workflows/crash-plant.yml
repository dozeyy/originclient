name: crash-plant

# Crash Report V3's real-world check: break a real Minecraft 1.21.1 boot on purpose (missing dependency, wrong
# Minecraft version, duplicate mod id, a mixin with no target, a 64 MB heap, an unknown JVM option, a truncated
# jar), keep what each stopped game left, and run the launcher's diagnosis on it (CrashCorpusTests with
# ORIGIN_CRASH_CORPUS_EXTRA). Every case must get its expected diagnosis and confidence word.
# Runs on pushes that touch the crash engine, its corpus or this plant, and by hand.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "src/OriginLauncher.App/Core/Launch/Crash*.cs"
      - "src/OriginLauncher.Tests/CrashCorpus/**"
      - "src/OriginLauncher.Tests/CrashCorpusTests.cs"
      - "tools/crash-plant/**"
      - ".github/workflows/crash-plant.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated case names (empty = all)"
        default: ""

concurrency:
  group: crash-plant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plant:
    name: Plant defects in 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Headless GL deps (Xvfb + Mesa software rasterizer)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libglu1-mesa libegl1 libegl-mesa0 \
            x11-xserver-utils libxxf86vm1 libxrandr2 libxcursor1 libxtst6

      - name: Download dependencies + assets (retried on Maven 429 / timeouts)
        run: bash tools/ci/gradle_prefetch.sh "src/mods/versions/1.21.1"

      - name: Plant the defects and boot each one
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          SDL_VIDEO_X11_NODIRECTCOLOR: "1"
          SDL_VIDEO_FORCE_EGL: "1"
          ONLY: ${{ github.event.inputs.only }}
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 tools/crash-plant/plant.py src/mods/versions/1.21.1 "$RUNNER_TEMP/crash-plant" --only "$ONLY"

      - name: Diagnose every planted crash with the launcher's engine
        env:
          ORIGIN_CRASH_CORPUS_EXTRA: ${{ runner.temp }}/crash-plant
          ORIGIN_CRASH_CORPUS_RESULTS: ${{ runner.temp }}/crash-plant/results.json
        run: |
          set +e
          dotnet test src/OriginLauncher.Tests --filter "FullyQualifiedName~CrashCorpusTests" \
            --logger "console;verbosity=normal" > "$RUNNER_TEMP/crash-plant/dotnet-test.log" 2>&1
          code=$?
          tail -n 15 "$RUNNER_TEMP/crash-plant/dotnet-test.log"
          python3 - <<'EOF'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "crash-plant", "results.json")))
          print("Per-case results (planted cases first):")
          rows = sorted(r["cases"], key=lambda c: (not c["case"].startswith("plant-"), c["case"]))
          for c in rows:
              what = (f"crash, {c['rule']}, {c['confidence']}, fix {c['fix']}" if c["crash"]
                      else f"not a crash ({c['reason']})")
              line = f"{'PASS' if c['pass'] else 'FAIL'} {c['case']}: {what}"
              if c["mismatches"]:
                  line += " | " + "; ".join(c["mismatches"])
              print(line)
              if c["case"].startswith("plant-"):
                  kind = "notice" if c["pass"] else "error"
                  print(f"::{kind} title=crash-plant {c['case']}::{line}")
          print(f"Unknown rate: {r['unknown']}/{r['crashes']} crashes ({r['rate']:.1f}%)")
          EOF
          exit $code

      - name: Keep the planted cases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-plant
          path: ${{ runner.temp }}/crash-plant
          retention-days: 14
