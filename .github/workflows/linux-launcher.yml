# The Linux launcher (src/OriginLauncher.Linux): builds it for x64 and arm64, runs its
# --self-test (data paths + every Linux seam of the shared Core: libsecret keyring and the
# machine-bound key file, hard links, /proc + sysfs, XDG autostart, prewarm with the idle I/O
# class, skin decode, Java 8 layout and download, Mojang's 1.8.9 + 1.21.1 rules, the self-update
# swap for both the tar.gz folder and the AppImage) and the Core tests in Linux mode. This is the
# Linux project's only compiler: it is never built on Will's PC.
#
# On x64 it then builds the four Linux downloads (tools/linux/package.sh: AppImage, .deb, .rpm,
# tar.gz), self-tests the tar.gz and the AppImage as a player would unpack them, installs the
# .deb/.rpm in fresh distro containers (install job), and boots real Minecraft through the AppImage
# on Xvfb (boot job: OriginLauncher --boot-test, judged by tools/linux/check_boot.py with
# boot-smoke's own rules). Branch builds bundle the latest release's mod jars (no Gradle here);
# launcher-release.yml packages the release's own jars with the same script. arm64 runs the
# self-test and Core tests only: no arm64 downloads ship until a game boots there (boot job note).
#
# Each arch runs on its own real hardware (GitHub's x64 and arm64 Ubuntu runners), no emulation.
#
# The shots job renders every launcher screen and state headless (OriginLauncher --render-shots: Avalonia
# with the real Skia renderer, made-up data in a temp scratch root, no network, no display) and uploads the
# PNGs plus a contact sheet (_sheet.jpg) as the linux-launcher-shots artifact.
name: Linux launcher

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/OriginLauncher.App/Core/**"
      - "src/OriginLauncher.Linux/**"
      - "src/OriginLauncher.Desktop/**"
      - "src/OriginLauncher.App/Theme/**"
      - "src/OriginLauncher.App/Assets/**"
      - "src/OriginLauncher.App/UI/**"
      - "src/OriginLauncher.Tests/**"
      - "src/mods/live-modules.json"
      - "tools/linux/**"
      - "tools/boot-smoke/**"
      - "global.json"
      - ".github/workflows/linux-launcher.yml"
  pull_request:
    paths:
      - "src/OriginLauncher.App/Core/**"
      - "src/OriginLauncher.Linux/**"
      - "src/OriginLauncher.Desktop/**"
      - "src/OriginLauncher.App/Theme/**"
      - "src/OriginLauncher.App/Assets/**"
      - "src/OriginLauncher.App/UI/**"
      - "src/OriginLauncher.Tests/**"
      - "src/mods/live-modules.json"
      - "tools/linux/**"
      - "tools/boot-smoke/**"
      - "global.json"
      - ".github/workflows/linux-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the shots job downloads the latest Windows launcher-shots artifact to compare names

concurrency:
  group: linux-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # secret-tool + a real Secret Service (gnome-keyring) so the keyring path is tested for real,
      # desktop-file-validate for the autostart entry, fusermount3 for the AppImage.
      - name: Install keyring tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsecret-tools gnome-keyring dbus-x11 desktop-file-utils fuse3

      - name: Runner
        run: |
          cat /etc/os-release | head -n 2
          uname -m
          grep -m1 -E "model name|Hardware" /proc/cpuinfo || true
          dotnet --version

      - name: Publish (${{ matrix.rid }})
        run: dotnet publish src/OriginLauncher.Linux/OriginLauncher.Linux.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o "$RUNNER_TEMP/publish"

      # Exit 0 only when no check printed FAIL. Runs inside its own D-Bus session with an unlocked
      # gnome-keyring, so --require-keyring makes a missing Secret Service a failure, not a skip.
      # --unlock reads a password from stdin and creates the "login" keyring with it (the default
      # collection secret-tool stores into). With an empty password the store was refused (run 41578348787).
      # --network adds the Java 8 download (hash-checked, unpacked, run) and Mojang's real file lists.
      - name: Self-test
        run: |
          file "$RUNNER_TEMP/publish/OriginLauncher"
          dbus-run-session -- sh -c '
            printf "origin-ci-throwaway" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            "$RUNNER_TEMP/publish/OriginLauncher" --self-test --network --require-keyring
          '

      # Every other headless run switches animations off and drives screens through tour helpers; this one runs them
      # for real (Motion.Off = false, the startup intro included) and presses the real buttons: Play signed out (the
      # sign-in card), the account pill, Friends, quick open/close toggles, every page, the version picker, a confirm
      # and a toast. Fails on anything thrown or a layer that doesn't settle (Shots/MotionCheck.cs; Mac twin: --motion-check).
      - name: Motion check
        run: '"$RUNNER_TEMP/publish/OriginLauncher" --motion-check --root "$RUNNER_TEMP/motion-check"'

      # The Core tests that mean something on Linux: the Linux seams, the managed skin decoder,
      # the library rules (1.8.9 LWJGL 2.9.4 and LWJGL 3 natives-linux on Linux), where the import looks
      # (~/.minecraft, XDG data, Flatpak), the running-game process probe and the Game folder rule.
      - name: Core tests (Linux mode)
        run: >
          dotnet test src/OriginLauncher.Tests -p:OriginPlatform=Linux
          --filter "FullyQualifiedName~LinuxSeamTests|FullyQualifiedName~SkinPngTests|FullyQualifiedName~LibraryRulesTests|FullyQualifiedName~LinuxImportRootsTests|FullyQualifiedName~GameRunningProbeTests|FullyQualifiedName~FieldRulesTests|FullyQualifiedName~LinuxPlatformWordsTests|FullyQualifiedName~CrashCorpusTests"

      # The mod jars the packages bundle: the latest release's (Bundled/OriginClient in its Windows
      # zip), so branch CI needs no Gradle build. The release workflow passes its own fresh jars.
      - name: Mod jars of the latest release
        if: ${{ matrix.rid == 'linux-x64' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern OriginLauncher-win-x64.zip --dir "$RUNNER_TEMP/rel"

      # --version "": an unstamped dev build (packages say 0.0.0), which never self-updates.
      - name: Package (${{ matrix.rid }})
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          bash tools/linux/package.sh --rid ${{ matrix.rid }} --version "" --out "$RUNNER_TEMP/dist" \
            --bundled-zip "$RUNNER_TEMP/rel/OriginLauncher-win-x64.zip"
          cd "$RUNNER_TEMP/dist"
          ls -l
          sha256sum -c ./*.sha256
          test "$(ls | wc -l)" = 8

      # As a player gets them: the tar.gz unpacked into a fresh folder, the AppImage run as one file.
      - name: Self-test the tar.gz and the AppImage
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          d="$RUNNER_TEMP/fresh"; mkdir -p "$d/tar" "$d/appimage"
          tar -xzf "$RUNNER_TEMP"/dist/OriginLauncher-linux-*.tar.gz -C "$d/tar"
          test -f "$d/tar/OriginLauncher/VERSION"
          test -f "$d/tar/OriginLauncher/Bundled/Forge/forge-1.8.9.json"
          echo "bundled jars: $(ls "$d/tar/OriginLauncher/Bundled/OriginClient" | wc -l)"
          cp "$RUNNER_TEMP"/dist/OriginLauncher-linux-*.AppImage "$d/appimage/"
          chmod +x "$d"/appimage/*.AppImage
          for exe in "$d/tar/OriginLauncher/OriginLauncher" "$(ls "$d"/appimage/*.AppImage)"; do
            echo "::group::$exe"
            # Same unlocked keyring as the Self-test step; pipefail so a FAIL fails this step.
            EXE="$exe" OUT="$d/out.txt" dbus-run-session -- bash -c '
              set -o pipefail
              printf "origin-ci-throwaway" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
              "$EXE" --self-test --require-keyring | tee "$OUT"
            '
            echo "::endgroup::"
            case "$exe" in
              *.AppImage) grep -qE "install kind +appimage" "$d/out.txt" ;;
              *) grep -qE "install kind +folder" "$d/out.txt" ;;
            esac
          done

      # An AppImage kept in a folder this user can't write (LINUX-7): it can't replace itself, so it is never offered an
      # update, and the player is told to move it to a folder they own instead of staying old without a word.
      - name: A read-only AppImage says how to update
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          ro="$RUNNER_TEMP/readonly"; mkdir -p "$ro"
          cp "$RUNNER_TEMP"/dist/OriginLauncher-linux-*.AppImage "$ro/"
          chmod +x "$ro"/*.AppImage; chmod a-w "$ro"
          "$(ls "$ro"/*.AppImage)" --self-test | tee "$RUNNER_TEMP/ro.txt" || true
          chmod u+w "$ro"
          grep -E "install kind +appimage" "$RUNNER_TEMP/ro.txt"
          grep -E "update blocked +Origin can't update itself from this folder. Move the AppImage" "$RUNNER_TEMP/ro.txt"

      - name: Upload the packages
        if: ${{ matrix.rid == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.rid }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  # The .deb and .rpm installed with the distro's own package manager in fresh containers: proves
  # every dependency name resolves, nothing the binaries link is missing, the installed launcher
  # runs (--self-test --network: TLS, Mojang's file lists, the Java 8 download), the menu entry is
  # valid, the /usr/bin wrapper prefers a newer per-user copy only, and removal cleans up.
  install:
    name: install (${{ matrix.image }}, ${{ matrix.rid }})
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:latest", "almalinux:9"]
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages-${{ matrix.rid }}
          path: pkgs

      - name: Install, run, remove (${{ matrix.image }})
        run: |
          cat > test.sh <<'SCRIPT'
          set -eu
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q /pkgs/*.deb
            apt-get install -y -q desktop-file-utils >/dev/null
            remove="apt-get remove -y -q origin-launcher"
          else
            dnf install -y -q /pkgs/*.rpm
            dnf install -y -q desktop-file-utils /usr/bin/ldd >/dev/null
            remove="dnf remove -y -q origin-launcher"
          fi
          head -n 2 /etc/os-release
          echo "--- libraries the binaries link that are missing (must be none)"
          bad=0
          for f in /opt/origin-launcher/OriginLauncher /opt/origin-launcher/*.so; do
            [ -e "$f" ] || continue
            if ldd "$f" | grep "not found"; then echo "  in $f"; bad=1; fi
          done
          [ "$bad" = 0 ]
          desktop-file-validate /usr/share/applications/org.originclient.Launcher.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/org.originclient.Launcher.png
          test -f /opt/origin-launcher/package-install
          echo "--- OpenSSL this distro has: $( (ldconfig -p || /sbin/ldconfig -p) 2>/dev/null | grep -oE 'libssl\.so\.[0-9.]+' | sort -u | tr '\n' ' ')"
          # Every real install has /etc/machine-id (systemd writes it at first boot; the account key is
          # bound to it). Bare container images (AlmaLinux) ship none, so give this one its own.
          [ -s /etc/machine-id ] || cat /proc/sys/kernel/random/uuid | tr -d '-' > /etc/machine-id
          echo "--- self-test from the installed path"
          if ! /usr/bin/origin-launcher --self-test --network > /tmp/out.txt 2>&1; then cat /tmp/out.txt; exit 1; fi
          cat /tmp/out.txt
          grep -qE "install kind +package" /tmp/out.txt
          echo "--- wrapper: a newer per-user copy wins, an equal one does not"
          u="$HOME/.local/share/OriginLauncher/app"; mkdir -p "$u"
          printf '#!/bin/sh\necho USER-COPY\n' > "$u/OriginLauncher"; chmod +x "$u/OriginLauncher"
          echo 99.0.0 > "$u/VERSION"
          test "$(/usr/bin/origin-launcher)" = USER-COPY
          cp /opt/origin-launcher/VERSION "$u/VERSION"
          if /usr/bin/origin-launcher | grep -q USER-COPY; then echo "an equal per-user copy was preferred"; exit 1; fi
          echo "--- remove"
          $remove
          test ! -e /opt/origin-launcher/OriginLauncher
          test ! -e /usr/bin/origin-launcher
          echo "PASS"
          SCRIPT
          docker run --rm -v "$PWD/pkgs:/pkgs:ro" -v "$PWD/test.sh:/test.sh:ro" "${{ matrix.image }}" sh /test.sh

  # The two portable downloads (AppImage, tar.gz) as a player on another distro runs them, in fresh containers with
  # NOTHING installed for OpenSSL: Fedora 45 has only OpenSSL 4 (libssl.so.4), which .NET 10 can't use, so the
  # launcher must load the OpenSSL 3 the downloads carry (LinuxOpenSsl.Linux.cs) and still go online (--network: TLS
  # to Mojang, the Java 8 download); Arch has its own OpenSSL 3, which must win. The only package added is ICU: container
  # base images strip it, every desktop install has it (GNOME and KDE depend on it), and .NET won't start without it.
  portable:
    name: portable (${{ matrix.image }})
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "fedora:latest"
            openssl: "bundled OpenSSL 3"
          - image: "archlinux:latest"
            openssl: "system libssl.so.3"
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages-linux-x64
          path: pkgs

      - name: AppImage + tar.gz on ${{ matrix.image }}
        run: |
          cat > test.sh <<'SCRIPT'
          set -eu
          head -n 2 /etc/os-release
          if command -v dnf >/dev/null; then dnf install -y -q libicu tar >/dev/null
          else pacman -Sy --noconfirm --needed icu >/dev/null; fi
          [ -s /etc/machine-id ] || cat /proc/sys/kernel/random/uuid | tr -d '-' > /etc/machine-id
          echo "--- OpenSSL this distro has: $( (ldconfig -p || /sbin/ldconfig -p) 2>/dev/null | grep -oE 'libssl\.so\.[0-9.]+' | sort -u | tr '\n' ' ')"
          mkdir -p /fresh/tar /fresh/appimage
          tar -xzf /pkgs/OriginLauncher-linux-x64.tar.gz -C /fresh/tar
          cp /pkgs/OriginLauncher-linux-x86_64.AppImage /fresh/appimage/ && chmod +x /fresh/appimage/*.AppImage
          for exe in /fresh/tar/OriginLauncher/OriginLauncher "/fresh/appimage/OriginLauncher-linux-x86_64.AppImage --appimage-extract-and-run"; do
            echo "--- $exe --self-test --network"
            if ! $exe --self-test --network > /tmp/out.txt 2>&1; then cat /tmp/out.txt; exit 1; fi
            cat /tmp/out.txt
            grep -E "openssl +$OPENSSL" /tmp/out.txt
          done
          echo PASS
          SCRIPT
          docker run --rm -e OPENSSL="${{ matrix.openssl }}" -v "$PWD/pkgs:/pkgs:ro" -v "$PWD/test.sh:/test.sh:ro" "${{ matrix.image }}" sh /test.sh

  # 1.8.9 on a PC without the xrandr program (LINUX-3): LWJGL 2 needs it and would die before its window, so Play must
  # refuse up front with the one install command (PlatformLaunch.Linux EnsureCanRun) instead of starting a doomed game.
  xrandr-refusal:
    name: boot (1.8.9, no xrandr)
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages-linux-x64
          path: ${{ runner.temp }}/pkgs

      - name: Play 1.8.9 without xrandr
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fuse3 >/dev/null
          for p in $(which -a xrandr || true); do sudo mv "$p" "$p.hidden"; done
          if command -v xrandr; then echo "xrandr is still on PATH"; exit 1; fi
          app="$RUNNER_TEMP/pkgs/OriginLauncher-linux-x86_64.AppImage"; chmod +x "$app"
          set +e
          "$app" --boot-test 1.8.9 --root "$RUNNER_TEMP/origin-data" --timeout 120 | tee "$RUNNER_TEMP/out.txt"
          code=${PIPESTATUS[0]}
          set -e
          test "$code" != 0
          grep -F "launch screen: Minecraft 1.8.9 needs xrandr: Install it once, then press Play: sudo apt install x11-xserver-utils" "$RUNNER_TEMP/out.txt"
          # Refused before anything was downloaded or started.
          if grep -q "game started (pid" "$RUNNER_TEMP/out.txt"; then echo "the game was started anyway"; exit 1; fi

  # Real Minecraft through the Linux launcher: the AppImage installed fresh, then --boot-test makes
  # the launcher's own Core install the loader, the Origin Client jar and Java and start the game
  # (offline test account, temp data root) on Xvfb + Mesa llvmpipe. Pass = the title screen with zero
  # mixin/injection failures (tools/linux/check_boot.py, boot-smoke's rules). x64 only: Mojang ships
  # no linux-arm64 Java runtime and 1.21.1 lists no arm64 natives (1.8.9's LWJGL 2 is x64-only), so
  # the launcher can't start a game on arm64 yet, and no arm64 download ships (launcher-release.yml).
  boot:
    name: boot (${{ matrix.version }})
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.8.9", "1.20.1", "1.21.11", "26.3"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages-linux-x64
          path: ${{ runner.temp }}/pkgs

      - name: Install Xvfb + Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils libglu1-mesa libegl1 libegl-mesa0 \
            x11-xserver-utils libxxf86vm1 libxrandr2 libxcursor1 libxtst6 fuse3

      - name: Install the AppImage
        run: |
          mkdir -p "$HOME/Applications"
          cp "$RUNNER_TEMP/pkgs/OriginLauncher-linux-x86_64.AppImage" "$HOME/Applications/"
          chmod +x "$HOME/Applications/OriginLauncher-linux-x86_64.AppImage"

      - name: Boot ${{ matrix.version }} through the launcher
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          # 26.3+ (SDL3): Xvfb has no GLX visual SDL accepts; its EGL path works (dev-shots.yml).
          SDL_VIDEO_X11_NODIRECTCOLOR: "1"
          SDL_VIDEO_FORCE_EGL: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$HOME/Applications/OriginLauncher-linux-x86_64.AppImage" --boot-test "${{ matrix.version }}" \
              --root "$RUNNER_TEMP/origin-data" --log "$RUNNER_TEMP/game-${{ matrix.version }}.log" --timeout 1200

      - name: Judge the game log
        if: ${{ always() }}
        run: python3 tools/linux/check_boot.py "$RUNNER_TEMP/game-${{ matrix.version }}.log" "${{ matrix.version }}"

      - name: Upload the game log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: boot-log-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/game-${{ matrix.version }}.log
            ${{ runner.temp }}/origin-data/instances/*/accounts/*/crash-reports/*
          if-no-files-found: warn
          retention-days: 7

  shots:
    name: shots (render every screen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (linux-x64)
        run: dotnet publish src/OriginLauncher.Linux/OriginLauncher.Linux.csproj -c Release -r linux-x64 --self-contained true -o "$RUNNER_TEMP/publish"

      # Fails when any shot failed (render-error.txt) or when no PNG came out at all.
      - name: Render shots
        run: |
          "$RUNNER_TEMP/publish/OriginLauncher" --render-shots "$RUNNER_TEMP/shots"
          n=$(ls "$RUNNER_TEMP/shots"/*.png | wc -l)
          echo "shots: $n"
          test "$n" -gt 0

      - name: Contact sheet
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/lean/contact_sheet.py "$RUNNER_TEMP/shots"

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-launcher-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: error

      # The Linux twin of the Mac job's parity list: every Windows screen (launcher-shots, the latest green run) with no
      # Linux shot of the same name, in the job summary. The Linux run draws the Friends drawer states in the same
      # folder, so the Windows social/ names are compared with all of them. Informational, never fails the run.
      - name: Windows shots with no Linux twin
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shots="$RUNNER_TEMP/shots"
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow launcher-shots.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          {
            echo "## Linux screens vs Windows"
            if [ -z "$run_id" ] || ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n launcher-shots -D win-shots; then
              echo "No Windows launcher-shots artifact to compare against (none recent, or expired)."
            else
              echo "Compared with Windows launcher-shots run $run_id."
              ls win-shots/*.png | xargs -n1 basename | sort > win.txt
              find "$shots" -name '*.png' | xargs -n1 basename | sort -u > linux.txt
              echo ""
              echo "Linux has $(comm -12 win.txt linux.txt | wc -l) of $(wc -l < win.txt) Windows screens. Not on Linux yet:"
              echo ""
              comm -23 win.txt linux.txt | sed 's/^/- /'
              ls win-shots/social/*.png 2>/dev/null | xargs -n1 basename | sort > win-social.txt
              echo ""
              echo "Friends drawer (--social): Linux has $(comm -12 win-social.txt linux.txt | wc -l) of $(wc -l < win-social.txt). Not on Linux yet:"
              echo ""
              comm -23 win-social.txt linux.txt | sed 's/^/- /'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The Linux launcher's screens on the claude/dev-shots branch, folder linux-launcher/ (SOURCE.txt names the commit), next to
  # launcher-shots' Windows `launcher/` folder, so a session can open them (_sheet.jpg first) without the artifact API.
  # Publish only: it checks nothing out and runs no repo code; it is the only job with contents: write, and it pushes
  # the PNGs the shots step uploaded. Same race-safe push as launcher-shots.yml's publish (one sparse clone, then
  # fetch-reset-recommit on a lost race). Never on pull requests (their token can't write).
  publish-shots:
    name: Publish Linux shots to dev-shots
    needs: shots
    if: ${{ always() && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true   # no artifact when the shots job stopped early: nothing to publish (below)
        with:
          name: linux-launcher-shots
          path: ${{ runner.temp }}/pub

      - name: Publish to the claude/dev-shots branch
        run: |
          folder="linux-launcher"
          n=$(find "$RUNNER_TEMP/pub" -name '*.png' | wc -l)
          echo "PNGs to publish: $n"
          [ "$n" -gt 0 ] || { echo "::warning::nothing published: no PNGs in the linux-launcher-shots artifact (the shots step did not run)"; exit 0; }
          url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          max=15
          pause() { local d=$(( 2 + RANDOM % 7 + $1 )); [ "$d" -gt 20 ] && d=20; echo "waiting ${d}s"; sleep "$d"; }
          site="$RUNNER_TEMP/site"
          for try in 1 2 3 4 5 6; do
            rc=0
            git ls-remote --exit-code --heads "$url" claude/dev-shots >/dev/null 2>&1 || rc=$?
            rm -rf "$site"
            if [ "$rc" = 0 ] && timeout 300 git clone -q --depth 1 --filter=blob:none --no-checkout --branch claude/dev-shots "$url" "$site" \
               && git -C "$site" sparse-checkout set --no-cone "/$folder/" && timeout 300 git -C "$site" checkout -q claude/dev-shots; then break; fi
            if [ "$rc" = 2 ]; then
              mkdir -p "$site" && git -C "$site" init -q && git -C "$site" checkout -q -b claude/dev-shots && break
            fi
            echo "could not get claude/dev-shots (ls-remote exit $rc, try $try/6)"; pause "$try"
          done
          [ -d "$site/.git" ] || { echo "::error::could not clone claude/dev-shots"; exit 1; }
          cd "$site"
          git config user.name "origin-dev-shots"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 "$max"); do
            rm -rf "$folder"; cp -r "$RUNNER_TEMP/pub" "$folder"
            printf 'source: %s\nrun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$folder/SOURCE.txt"
            git add -A
            git commit -qm "Linux launcher shots for ${GITHUB_SHA::7}" || true
            if git push -q "$url" HEAD:refs/heads/claude/dev-shots; then echo "published on attempt $attempt"; exit 0; fi
            echo "push lost the race (attempt $attempt/$max)"
            pause "$attempt"
            git fetch -q --depth 1 --filter=blob:none "$url" claude/dev-shots && git reset -q --hard FETCH_HEAD || echo "fetch of the new tip failed; will retry"
          done
          echo "::error::could not publish to claude/dev-shots after $max attempts"
          exit 1
