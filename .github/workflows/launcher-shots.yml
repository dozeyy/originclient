# Launcher shots: open the real launcher window in render mode
# (`OriginLauncher.App.exe --render-shots <folder>`, src/OriginLauncher.App/UI/RenderShots.cs)
# with made-up social data and save pictures of Home and the Friends drawer.
#
# Why: the cloud sandbox Claude works in can't run WPF, so this is how a
# launcher UI change gets LOOKED AT before it reaches Will. Same delivery as
# dev-shots.yml: the PNGs land in the `claude/dev-shots` branch, folder
# `launcher` (or `launcher-<label>`), with SOURCE.txt naming the commit; also
# kept as the "launcher-shots" artifact.
#
# Runs on pushes to claude/** that touch the launcher, or by hand (Run workflow).
# No mod jars are built: the launcher compiles without them (csproj globs match
# nothing) and render mode never launches the game.
name: launcher-shots

on:
  push:
    branches: ["claude/**"]
    paths: ["src/OriginLauncher.App/**", ".github/workflows/launcher-shots.yml"]
  workflow_dispatch:
    inputs:
      label:
        description: "Optional name for this run's folder (launcher-<label>)"
        default: ""

permissions:
  contents: write

concurrency:
  group: launcher-shots-${{ github.ref }}-${{ github.event.inputs.label }}
  cancel-in-progress: true

jobs:
  shots:
    name: Render launcher screens
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build launcher
        shell: pwsh
        run: |
          dotnet build src/OriginLauncher.App/OriginLauncher.App.csproj -c Release -o lbin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render screens
        shell: pwsh
        run: |
          $p = Start-Process .\lbin\OriginLauncher.App.exe -ArgumentList '--render-shots launcher-shots' -Wait -PassThru
          $shots = @(Get-ChildItem launcher-shots -Filter *.png -ErrorAction SilentlyContinue)
          if (Test-Path launcher-shots\render-error.txt) { Get-Content launcher-shots\render-error.txt }
          if ($p.ExitCode -ne 0 -or $shots.Count -lt 6) {
            # A crash the app couldn't report itself (.NET writes it to the event log).
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } |
              Select-Object -First 3 | ForEach-Object { Write-Host $_.Message }
            Write-Host "::error::Launcher render failed (exit $($p.ExitCode), $($shots.Count) images)"
            exit 1
          }
          Write-Host "Rendered $($shots.Count) screens."
          # The Import drawer's tour writes its own error file instead of stopping the render: a failed tour is a failed run.
          foreach ($f in 'launcher-shots\import-error.txt', 'launcher-shots\import-card-error.txt', 'launcher-shots\settings-states-error.txt') {
            if (Test-Path $f) { Get-Content $f; Write-Host "::error::Import drawer render reported an error ($f)"; exit 1 }
          }

      - name: Render Friends drawer
        shell: pwsh
        run: |
          $p = Start-Process .\lbin\OriginLauncher.App.exe -ArgumentList '--render-shots launcher-shots\social --social' -Wait -PassThru
          $shots = @(Get-ChildItem launcher-shots\social -Filter *.png -ErrorAction SilentlyContinue)
          foreach ($f in 'launcher-shots\social\social-error.txt', 'launcher-shots\social\render-error.txt') {
            if (Test-Path $f) { Get-Content $f; Write-Host "::error::Friends drawer render reported an error ($f)"; exit 1 }
          }
          if ($p.ExitCode -ne 0 -or $shots.Count -lt 20) {
            Write-Host "::error::Friends drawer render failed (exit $($p.ExitCode), $($shots.Count) images)"
            exit 1
          }
          Write-Host "Rendered $($shots.Count) Friends drawer screens."

      # Every picture above is also measured (RenderShots.ClipCheck): anything visible (icon, text, a tile)
      # that its slot cuts off, or a button label or title that trims, is listed in clip-errors.txt. A cut "..." still looks like dots in a picture, so
      # this is the check that catches it. Runs after both renders so every hit is listed at once.
      - name: Check nothing is cut off
        shell: pwsh
        run: |
          # Text allowed to trim (long names, status and server lines) is only counted: trim-checks.txt lists it.
          $trims = @('launcher-shots\trim-checks.txt', 'launcher-shots\social\trim-checks.txt') | Where-Object { Test-Path $_ }
          if ($trims.Count -gt 0) {
            $t = (Get-Content $trims | Measure-Object -Line).Lines
            Write-Host "::warning::$t trimmed texts that are allowed to trim (see trim-checks.txt in the artifact)"
          }
          $files = @(@('launcher-shots\clip-errors.txt', 'launcher-shots\social\clip-errors.txt') | Where-Object { Test-Path $_ })
          foreach ($f in $files) { Get-Content $f | ForEach-Object { Write-Host "::error::$_" } }
          if ($files.Count -gt 0) { exit 1 }
          $n = (Get-Content launcher-shots\clip-checks.txt, launcher-shots\social\clip-checks.txt | Measure-Object -Line).Lines
          Write-Host "$n pictures checked, nothing cut off."

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launcher-shots
          path: launcher-shots
          retention-days: 14

  publish:
    needs: shots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-shots
          path: ${{ runner.temp }}/pub

      # Several branches render at once and all push to the one claude/dev-shots branch, so a push is often
      # rejected because someone else got there first. The window between "I looked at the branch tip" and "I
      # pushed" is what loses the race, and a full clone of that branch is slow, so the clone happens ONCE.
      # A lost race then costs seconds: fetch the new tip (depth 1), put this run's commit back on top of it
      # (only this run's folder changes, so there is never a conflict), push again - up to 15 times with a short,
      # jittered wait so runs that collided do not collide again in lockstep. Only "the branch does not exist
      # yet" starts a fresh history; any other clone/fetch failure is retried, never answered with an unrelated
      # root commit. The folder and files written are exactly what they always were.
      - name: Publish to the claude/dev-shots branch
        env:
          LABEL: ${{ github.event.inputs.label }}
        run: |
          folder="launcher"
          [ -n "$LABEL" ] && folder="launcher-$(printf '%s' "$LABEL" | tr -c 'A-Za-z0-9._-' '_')"
          url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          max=15
          pause() { local d=$(( 2 + RANDOM % 7 + $1 )); [ "$d" -gt 20 ] && d=20; echo "waiting ${d}s"; sleep "$d"; }

          # 1. get the branch tip once (or start the branch when it truly does not exist)
          site="$RUNNER_TEMP/site"
          for try in 1 2 3 4 5 6; do
            rc=0
            git ls-remote --exit-code --heads "$url" claude/dev-shots >/dev/null 2>&1 || rc=$?
            rm -rf "$site"
            # Partial + sparse: the branch holds GBs of dev-shots PNGs (a plain depth-1 clone
            # downloaded all of them); this run only touches its own folder.
            if [ "$rc" = 0 ] && timeout 300 git clone -q --depth 1 --filter=blob:none --no-checkout --branch claude/dev-shots "$url" "$site" \
               && git -C "$site" sparse-checkout set --no-cone "/$folder/" && timeout 300 git -C "$site" checkout -q claude/dev-shots; then break; fi
            if [ "$rc" = 2 ]; then
              mkdir -p "$site" && git -C "$site" init -q && git -C "$site" checkout -q -b claude/dev-shots && break
            fi
            echo "could not get claude/dev-shots (ls-remote exit $rc, try $try/6)"; pause "$try"
          done
          [ -d "$site/.git" ] || { echo "::error::could not clone claude/dev-shots"; exit 1; }

          cd "$site"
          git config user.name "origin-dev-shots"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. put this run's folder on top of the tip and push; on a lost race, move to the new tip and redo
          for attempt in $(seq 1 "$max"); do
            rm -rf "$folder"; cp -r "$RUNNER_TEMP/pub" "$folder"
            printf 'source: %s\nrun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$folder/SOURCE.txt"
            git add -A
            git commit -qm "launcher shots for ${GITHUB_SHA::7}" || true
            if git push -q "$url" HEAD:refs/heads/claude/dev-shots; then echo "published on attempt $attempt"; exit 0; fi
            echo "push lost the race (attempt $attempt/$max)"
            pause "$attempt"
            git fetch -q --depth 1 --filter=blob:none "$url" claude/dev-shots && git reset -q --hard FETCH_HEAD || echo "fetch of the new tip failed; will retry"
          done
          echo "::error::could not publish to claude/dev-shots after $max attempts"
          exit 1
