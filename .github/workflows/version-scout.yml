# What exists upstream for a Minecraft version line, before porting Origin to it:
# Mojang releases, Fabric support, and the Fabric API / Sodium / Iris / JEI builds
# (Origin needs Sodium + Iris on every version — mandate 3). Run by hand.
name: version-scout

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/version-scout.yml"]
  workflow_dispatch:
    inputs:
      prefix:
        description: "Version prefix to scout, e.g. 26."
        default: "26."
      inspect:
        description: "Mod builds whose fabric.mod.json to print (project:version_number, space-separated)"
        default: ""
      diff:
        description: "Minecraft releases whose client API to diff in order (space-separated, unobfuscated 26.x only)"
        default: ""

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Scout upstream versions
        env:
          PREFIX: ${{ github.event.inputs.prefix || '26.' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          P = os.environ["PREFIX"]
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "origin-version-scout (originclient.org)"})
              return json.load(urllib.request.urlopen(r, timeout=30))
          man = get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
          print("== Mojang", {k: v for k, v in man["latest"].items()})
          for v in man["versions"]:
              if v["id"].startswith(P):
                  print(f'  {v["id"]:<22} {v["type"]:<9} {v["releaseTime"][:10]}')
          fab = get("https://meta.fabricmc.net/v2/versions/game")
          print("== Fabric game versions:", [g["version"] for g in fab if g["version"].startswith(P)][:40])
          print("== Fabric loader latest:", get("https://meta.fabricmc.net/v2/versions/loader")[0]["version"])
          # Newest RELEASE file per exact release version (no snapshot/pre/rc), with
          # its Modrinth CDN url -- what PerformanceModCatalog.Data.cs pins.
          files = []
          for proj in ["fabric-api", "sodium", "iris", "jei", "lithium", "ferrite-core", "modmenu", "immediatelyfast", "krypton"]:
              try:
                  vs = get(f"https://api.modrinth.com/v2/project/{proj}/version?loaders=%5B%22fabric%22%5D")
              except Exception as e:
                  print(f"== {proj}: error {e}"); continue
              by = {}
              newest = {}
              for v in vs:
                  for g in v["game_versions"]:
                      if g.startswith(P):
                          by.setdefault(g, []).append(f'{v["version_number"]}({v["version_type"][0]})')
                          if v["version_type"] == "release" and "-" not in g and g not in newest:
                              f = next((f for f in v["files"] if f["primary"]), v["files"][0])
                              newest[g] = (v["version_number"], f["url"], f["filename"])
              print(f"== {proj}:")
              for g in sorted(by):
                  print(f"    {g}: {', '.join(by[g][:4])}")
              for g in sorted(newest):
                  files.append(f"{proj:<15} {g:<8} {newest[g][0]:<28} {newest[g][1]}  {newest[g][2]}")
          print("== newest release files per version:")
          for line in files:
              print("    " + line)
          PY

  # What a porter needs before choosing modules/pins: each named mod build's own
  # fabric.mod.json (its minecraft range + what it depends on / breaks), and the
  # client API difference between neighbouring releases (signatures of changed
  # classes + which method bodies changed) -- decides "one jar or several".
  inspect:
    runs-on: ubuntu-latest
    env:
      INSPECT: ${{ github.event.inputs.inspect || 'sodium:mc26.1.1-0.8.9-fabric sodium:mc26.1.2-0.9.2-fabric iris:1.11.4+26.1-fabric iris:1.11.3+26.1-fabric jei:29.47.0.109 fabric-api:0.155.3+26.1.2 lithium:mc26.1.2-0.24.7-fabric immediatelyfast:1.15.3+26.1-fabric modmenu:18.0.2 krypton:0.3.0' }}
      DIFF: ${{ github.event.inputs.diff || '26.1 26.1.1 26.1.2' }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Mod metadata + Minecraft API diff
        run: |
          python3 - <<'PY'
          import difflib, hashlib, io, json, os, re, subprocess, urllib.request, zipfile
          def raw(u):
              r = urllib.request.Request(u, headers={"User-Agent": "origin-version-scout (originclient.org)"})
              return urllib.request.urlopen(r, timeout=120).read()
          get = lambda u: json.loads(raw(u))
          def meta(z):
              m = json.loads(z.read("fabric.mod.json").decode("utf-8", "replace"), strict=False)
              return {k: m.get(k) for k in ("id", "version", "depends", "breaks", "conflicts", "recommends", "provides") if m.get(k)}
          # project:version_number, or project:@<game version> = every fabric build listing it.
          for item in os.environ["INSPECT"].split():
              proj, ver = item.split(":", 1)
              try:
                  vs = get(f"https://api.modrinth.com/v2/project/{proj}/version?loaders=%5B%22fabric%22%5D")
                  picked = [v for v in vs if (ver[1:] in v["game_versions"] if ver.startswith("@") else v["version_number"] == ver)][:40]
                  if not picked: print(f"== {item}: not found")
                  for v in picked:
                      f = next((f for f in v["files"] if f["primary"]), v["files"][0])
                      z = zipfile.ZipFile(io.BytesIO(raw(f["url"])))
                      print(f"== {proj}:{v['version_number']} ({v['version_type']})  {f['url']}  sha1={f['hashes'].get('sha1')}\n   game_versions={v['game_versions']}\n   {json.dumps(meta(z))}")
                      # jar-in-jar mods ship inside and must resolve too
                      for n in z.namelist():
                          if n.startswith("META-INF/jars/") and n.endswith(".jar"):
                              try:
                                  print(f"   nested {n[14:]}: {json.dumps(meta(zipfile.ZipFile(io.BytesIO(z.read(n)))))}")
                              except Exception:
                                  pass
              except Exception as e:
                  print(f"== {item}: error {e!r}")
          vers = os.environ["DIFF"].split()
          if not vers:
              raise SystemExit
          man = {v["id"]: v["url"] for v in get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")["versions"]}
          jars = {}
          for v in vers:
              path = f"/tmp/{v}.jar"
              open(path, "wb").write(raw(get(man[v])["downloads"]["client"]["url"]))
              jars[v] = path
          def classes(p):
              with zipfile.ZipFile(p) as z:
                  return {i.filename[:-6]: i.CRC for i in z.infolist()
                          if i.filename.endswith(".class") and (i.filename.startswith("net/minecraft/") or i.filename.startswith("com/mojang/"))}
          def javap(jar, names, code):
              out = {}
              for i in range(0, len(names), 100):
                  batch = names[i:i + 100]
                  txt = subprocess.run(["javap", "-p"] + (["-c"] if code else []) + ["-cp", jar] + [n.replace("/", ".") for n in batch],
                                       capture_output=True, text=True).stdout
                  cur = None
                  for line in txt.splitlines():
                      if line and not line[0].isspace() and line.endswith("{"):
                          mm = re.search(r"(?:^|\s)(?:class|interface) ([\w$.]+)", line)
                          cur = mm.group(1).replace(".", "/") if mm else None
                          if cur: out[cur] = ""
                      if cur: out[cur] += line + "\n"
              return out
          def bodies(txt):
              res, cur, buf = {}, None, []
              for line in txt.splitlines():
                  if re.match(r"^  \S.*\(.*;$", line):
                      if cur: res[cur] = hashlib.sha1("\n".join(buf).encode()).hexdigest()
                      cur, buf = line.strip(), []
                  elif cur:
                      buf.append(re.sub(r"#\d+(,\s*\d+)?", "#", line))
              if cur: res[cur] = hashlib.sha1("\n".join(buf).encode()).hexdigest()
              return res
          for a, b in zip(vers, vers[1:]):
              ca, cb = classes(jars[a]), classes(jars[b])
              print(f"\n######## API diff {a} -> {b}: {len(ca)} -> {len(cb)} classes")
              print("removed classes:", sorted(set(ca) - set(cb)))
              print("added classes:", sorted(set(cb) - set(ca)))
              changed = sorted(n for n in set(ca) & set(cb) if ca[n] != cb[n])
              print(f"classes whose bytes changed: {len(changed)}")
              sa, sb = javap(jars[a], changed, False), javap(jars[b], changed, False)
              ka, kb = javap(jars[a], changed, True), javap(jars[b], changed, True)
              for n in changed:
                  la = [l for l in sa.get(n, "").splitlines() if not l.startswith("Compiled from")]
                  lb = [l for l in sb.get(n, "").splitlines() if not l.startswith("Compiled from")]
                  sig = [d for d in difflib.unified_diff(la, lb, lineterm="", n=0) if d[:1] in "+-" and d[:3] not in ("+++", "---")]
                  ba, bb = bodies(ka.get(n, "")), bodies(kb.get(n, ""))
                  body = sorted(k for k in set(ba) & set(bb) if ba[k] != bb[k])
                  if sig or body:
                      print(f"-- {n}")
                      for d in sig: print("   " + d)
                      for k in body[:25]: print("   body~ " + k)
          PY
