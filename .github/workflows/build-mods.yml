# Builds Origin Client mod modules IN PARALLEL — one job per module.
# Called by build-check.yml (every live module) and launcher-release.yml (only
# the modules that changed since the last release; see tools/release/plan.py).
#
# Why parallel: the old pipeline compiled ~16 modules back to back on ONE
# Windows runner, ~1.5 min each, so a release took 12-40 min. Each module is a
# fully standalone Gradle build, so they run side by side here and the whole
# set finishes in roughly the time of the slowest single module.
#
# Why Linux: Gradle + Loom start and run faster there, and the jar is plain
# JVM bytecode — identical behaviour whichever OS compiled it. The Windows-only
# work (WPF launcher publish, the Origin installer) stays in the calling
# workflows. Every module cross-compiles from JDK 21 via `options.release`
# (21 / 17 / 16 / 8), so one setup-java covers them all.
#
# No Gradle cache on purpose: GitHub scopes caches per branch/tag, so a cache
# written by one release tag is invisible to the next — the old setup-java
# gradle cache spent 2.5-4.5 min per release saving archives nothing could
# ever restore. A cold module build is ~1.5-2 min, and they run in parallel.
#
# Each job uploads its jar as artifact `mod-<module>` laid out as
# <module>/<jar>; the caller downloads them all (merge-multiple) and
# .github/actions/publish-launcher places them for the csproj to bundle.
name: build-mods

on:
  workflow_call:
    inputs:
      modules:
        description: 'JSON array of {"module","covers"} from tools/release/plan.py'
        type: string
        required: true
      fail-fast:
        description: "Cancel the other builds as soon as one fails (releases: yes)"
        type: boolean
        default: false

jobs:
  build:
    name: Minecraft ${{ matrix.covers }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include: ${{ fromJson(inputs.modules) }}
    defaults:
      run:
        working-directory: src/mods/versions/${{ matrix.module }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Through sh so the build never depends on gradlew's executable bit
      # (Windows checkouts drop it; it is set in git as of this pipeline).
      #
      # Download hiccups: ~16 builds start at once and all fetch from Fabric's
      # maven, which occasionally resets a connection ("Connection reset",
      # "Could not GET ..."). Gradle then disables the repository for the rest
      # of that run. So: more in-run retries, and if a run still fails on a
      # DOWNLOAD error, start it again (what's already cached is kept). A
      # compile error is never retried — it fails straight away.
      - name: Build mod (module ${{ matrix.module }})
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sh ./gradlew build --no-daemon \
                 -Dorg.gradle.internal.repository.max.retries=6 \
                 -Dorg.gradle.internal.repository.initial.backoff=1500 2>&1 | tee gradle.log; then
              exit 0
            fi
            if ! grep -qE "Could not (resolve|download|GET|HEAD|get resource)|Connection reset|Read timed out|Connect timed out|Remote host terminated" gradle.log; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Download failure from a maven repository (attempt $attempt) — retrying in $((attempt * 20))s."
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Dependency downloads kept failing after 3 attempts — the maven repository is likely down."
          exit 1

      # Dead-hook gate. Loom's remap step prints "Cannot remap <method> because it
      # does not exist in any of the targets [<class>]" for every mixin that names
      # a method this Minecraft version doesn't have. Mixin configs are
      # defaultRequire 0 (fail-soft), so such a hook compiles, boots and simply
      # never runs: the feature behind it silently does nothing. That is how
      # 1.21.10's nametag and tile-entity settings were dead for months. Only
      # targets in Minecraft's own packages count; dependency jars print their own
      # lines with intermediary (class_1234) names, which are not Origin's.
      - name: Check for mixins that bind nothing
        shell: bash
        run: |
          # Origin's sources use Mojang names, so its own lines name readable classes
          # (net/minecraft/client/...). Bundled dependency jars (Sodium, Lithium...)
          # are remapped from intermediary names (net/minecraft/class_2818); their
          # lines are skipped -- they are those mods' own optional hooks, not Origin's.
          dead=$(grep -E "Cannot remap .* does not exist in any of the targets \[(net/minecraft|com/mojang)/" gradle.log \
                 | grep -vE "targets \[net/minecraft/class_[0-9]+" || true)
          if [ -n "$dead" ]; then
            echo "::error::Origin mixins target methods that don't exist on Minecraft ${{ matrix.covers }} (the feature behind each would silently do nothing):"
            echo "$dead"
            exit 1
          fi
          echo "No dead mixin targets."

      # Exactly one shippable jar per module: build/libs also holds the
      # -sources (and on some modules -dev) jars, which the csproj excludes too.
      - name: Collect jar
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -name 'originclient-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one shippable jar in build/libs, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          out="$RUNNER_TEMP/mod-out/${{ matrix.module }}"
          mkdir -p "$out"
          cp "${jars[0]}" "$out/"
          echo "Built ${jars[0]}"

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ matrix.module }}
          path: ${{ runner.temp }}/mod-out
          if-no-files-found: error
          retention-days: 3
