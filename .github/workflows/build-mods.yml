# Builds Origin Client mod modules IN PARALLEL — one job per module.
# Called by build-check.yml (every live module) and launcher-release.yml (only
# the modules that changed since the last release; see tools/release/plan.py).
#
# Why parallel: the old pipeline compiled ~16 modules back to back on ONE
# Windows runner, ~1.5 min each, so a release took 12-40 min. Each module is a
# fully standalone Gradle build, so they run side by side here and the whole
# set finishes in roughly the time of the slowest single module.
#
# Why Linux: Gradle + Loom start and run faster there, and the jar is plain
# JVM bytecode — identical behaviour whichever OS compiled it. The Windows-only
# work (WPF launcher publish, the Origin installer) stays in the calling
# workflows. Every 1.x module cross-compiles from JDK 21 via `options.release`
# (21 / 17 / 16 / 8); 26.x modules need JDK 25 (the matrix's "java").
#
# No Gradle cache on purpose: GitHub scopes caches per branch/tag, so a cache
# written by one release tag is invisible to the next — the old setup-java
# gradle cache spent 2.5-4.5 min per release saving archives nothing could
# ever restore. A cold module build is ~1.5-2 min, and they run in parallel.
#
# Each job uploads its jar as artifact `mod-<module>` laid out as
# <module>/<jar>; the caller downloads them all (merge-multiple) and
# .github/actions/publish-launcher places them for the csproj to bundle.
name: build-mods

on:
  workflow_call:
    inputs:
      modules:
        description: 'JSON array of {"module","covers","java"} from tools/release/plan.py'
        type: string
        required: true
      fail-fast:
        description: "Cancel the other builds as soon as one fails (releases: yes)"
        type: boolean
        default: false
      vendor:
        description: "Also build src/mods/vendor/* (the Vulkan graphics jars) as artifact mod-vendor"
        type: boolean
        default: true

jobs:
  build:
    name: Minecraft ${{ matrix.covers }}
    # '[]' = a vendor-only call (launcher-release.yml's vendor job): an empty matrix is an error in Actions.
    if: ${{ inputs.modules != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include: ${{ fromJson(inputs.modules) }}
    defaults:
      run:
        working-directory: src/mods/versions/${{ matrix.module }}
    steps:
      # Gradle runs plugins from Fabric's and other mavens here: no token left in .git/config for them
      # (the callers' tokens are read-only too; launcher-release.yml -> TOKENS).
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # JDK 21 for every 1.x module (each cross-compiles via options.release);
      # 26.x modules run Gradle on JDK 25 ("java" in src/mods/live-modules.json).
      - name: Set up Java ${{ matrix.java || '21' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java || '21' }}

      # Through sh so the build never depends on gradlew's executable bit
      # (Windows checkouts drop it; it is set in git as of this pipeline).
      #
      # Download hiccups: ~16 builds start at once and all fetch from Fabric's
      # maven, which occasionally resets a connection ("Connection reset",
      # "Could not GET ..."). Gradle then disables the repository for the rest
      # of that run. So: more in-run retries, and if a run still fails on a
      # DOWNLOAD error, start it again (what's already cached is kept). A
      # compile error is never retried — it fails straight away.
      - name: Build mod (module ${{ matrix.module }})
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sh ./gradlew build --no-daemon \
                 -Dorg.gradle.internal.repository.max.retries=6 \
                 -Dorg.gradle.internal.repository.initial.backoff=1500 2>&1 | tee gradle.log; then
              exit 0
            fi
            if ! grep -qE "Could not (resolve|download|GET|HEAD|get resource)|Connection reset|Read timed out|Connect timed out|Remote host terminated|DownloadException|Failed to download" gradle.log; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Download failure from a maven repository (attempt $attempt) — retrying in $((attempt * 20))s."
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Dependency downloads kept failing after 3 attempts — the maven repository is likely down."
          exit 1

      # Dead-hook gate. Loom's remap step prints "Cannot remap <method> because it
      # does not exist in any of the targets [<class>]" for every mixin that names
      # a method this Minecraft version doesn't have. Mixin configs are
      # defaultRequire 0 (fail-soft), so such a hook compiles, boots and simply
      # never runs: the feature behind it silently does nothing. That is how
      # 1.21.10's nametag and tile-entity settings were dead for months. Only
      # targets in Minecraft's own packages count; dependency jars print their own
      # lines with intermediary (class_1234) names, which are not Origin's.
      #
      # 26.x is unobfuscated (no `mappings` line): nothing is remapped, so that line can never
      # appear and this grep would pass having checked nothing (LV-4). Those modules instead check
      # every Minecraft mixin's target class, method names, call targets and accessors against the
      # Minecraft jar this build just used (tools/ci/check_mixin_targets.py); it fails loudly if it
      # cannot find that jar.
      - name: Check for mixins that bind nothing
        shell: bash
        run: |
          if ! grep -qE '^\s*mappings\b' build.gradle; then
            python3 ../../../../tools/ci/check_mixin_targets.py .
            exit $?
          fi
          # Origin's sources use Mojang names, so its own lines name readable classes
          # (net/minecraft/client/...). Bundled dependency jars (Sodium, Lithium...)
          # are remapped from intermediary names (net/minecraft/class_2818); their
          # lines are skipped -- they are those mods' own optional hooks, not Origin's.
          # Classes intermediary never renames (com/mojang/...) give no such hint, so a
          # line also counts only when an Origin mixin names that method in quotes
          # (method = "x" / target = "...;x(...)") -- a compile-only Sodium (1.21's, once 0.5.11)
          # prints dead RenderSystem hooks of its own that Origin never mentions.
          dead=$(grep -E "Cannot remap .* does not exist in any of the targets \[(net/minecraft|com/mojang)/" gradle.log \
                 | grep -vE "targets \[net/minecraft/class_[0-9]+" \
                 | while IFS= read -r line; do
                     name=$(sed -E 's/^.*Cannot remap ([A-Za-z0-9_$<>]+).*/\1/' <<<"$line")
                     if grep -rqE "[\";]${name}[\"(]" src --include='*.java'; then echo "$line"; fi
                   done || true)
          if [ -n "$dead" ]; then
            echo "::error::Origin mixins target methods that don't exist on Minecraft ${{ matrix.covers }} (the feature behind each would silently do nothing):"
            echo "$dead"
            exit 1
          fi
          echo "No dead mixin targets."

      # JEI modules: every `sig jei` row (originclient.compat-gates.txt) must exist, with that exact descriptor,
      # in the JEI jar this build just resolved. A pin bump that moved a class or changed a descriptor would
      # otherwise only switch Origin's JEI hooks off at runtime (boot-smoke checks that side). No-op elsewhere.
      - name: Check JEI signatures against the pinned jar
        shell: bash
        run: python3 ../../../../tools/compat-gates/check.py --jars --module "${{ matrix.module }}"

      # Exactly one shippable jar per module: build/libs also holds the
      # -sources (and on some modules -dev) jars, which the csproj excludes too.
      - name: Collect jar
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -name 'originclient-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one shippable jar in build/libs, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          out="$RUNNER_TEMP/mod-out/${{ matrix.module }}"
          mkdir -p "$out"
          cp "${jars[0]}" "$out/"
          echo "Built ${jars[0]}"

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ matrix.module }}
          path: ${{ runner.temp }}/mod-out
          if-no-files-found: error
          retention-days: 3

  # Origin's vendor modules (src/mods/vendor/<name>/, each a standalone Gradle build with its own gradlew):
  # today 1.21.1's Vulkan graphics jars, vulkairis-origin-*.jar and flywheel-vulkan-*.jar, which the launcher
  # bundles under Bundled/Vulkan (csproj <Content>, Core/Renderers/VulkanMode.BundledPatterns). They are not
  # Minecraft-version modules, so they sit outside live-modules.json and the matrix above. No vendor folder (or
  # none with a gradlew) = nothing built, no artifact; the launcher then shows Vulkan graphics as unavailable.
  # Artifact `mod-vendor`, laid out vendor/<name>/<jar> (the caller places it at src/mods/vendor/<name>/build/libs).
  vendor:
    name: Vendor modules
    if: ${{ inputs.vendor }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build vendor modules
        shell: bash
        run: |
          out="$RUNNER_TEMP/vendor-out/vendor"
          built=0
          for dir in src/mods/vendor/*/; do
            [ -f "$dir/gradlew" ] || continue
            name=$(basename "$dir")
            ok=0
            # Unit tests run here (no -x test): these jars ship to players, and their tests are the only check on
            # the shader translation and draw-path logic before a release bundles them.
            for attempt in 1 2 3; do
              if (cd "$dir" && sh ./gradlew build --no-daemon \
                    -Dorg.gradle.internal.repository.max.retries=6 \
                    -Dorg.gradle.internal.repository.initial.backoff=1500 > gradle.log 2>&1); then ok=1; break; fi
              tail -n 40 "$dir/gradle.log"
              grep -qE "Could not (resolve|download|GET|HEAD|get resource)|Connection reset|Read timed out|Connect timed out|Remote host terminated|DownloadException|Failed to download" "$dir/gradle.log" || break
              sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ]; then echo "::error::src/mods/vendor/$name failed to build"; exit 1; fi
            mapfile -t jars < <(find "$dir/build/libs" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar')
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "::error::src/mods/vendor/$name: expected exactly one shippable jar in build/libs, found ${#jars[@]}: ${jars[*]}"
              exit 1
            fi
            mkdir -p "$out/$name"
            cp "${jars[0]}" "$out/$name/"
            echo "Built ${jars[0]}"
            built=$((built + 1))
          done
          echo "$built vendor module(s) built."

      - name: Upload vendor jars
        uses: actions/upload-artifact@v7
        with:
          name: mod-vendor
          path: ${{ runner.temp }}/vendor-out
          if-no-files-found: ignore
          retention-days: 3
