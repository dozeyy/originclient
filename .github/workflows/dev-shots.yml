# Dev shots: boot the real client headlessly and capture the Origin screens
# (mod menu grid + list, a mod's page, Settings, the Right Shift screen) via
# each module's in-mod harness OriginDevShots (ORIGIN_SHOTS_SET=design).
#
# Why: the cloud sandbox Claude works in can't run Minecraft, so this is how a
# UI change gets LOOKED AT before it reaches Will. The PNGs are force-pushed to
# the `claude/dev-shots` branch (one orphan commit, latest run only), one
# folder per module, so a session can `git fetch` them; also kept as artifacts.
#
# Which modules: put a tag in the commit message on a claude/** branch --
#   [shots]                -> 1.21.1
#   [shots:1.20,1.21.4]    -> those modules
#   [shots:all]            -> every live module (src/mods/live-modules.json)
# or run it by hand (Run workflow) with the same list in `modules`; `set: world`
# captures inside a fresh world instead (modules with OriginDevWorld); `label`
# names the output folders (<module>[-world]-<label>) so parallel runs stay apart.
# Software GL limits (Xvfb + llvmpipe, Sodium's GL 4.6 spoofed) are the same
# as boot-smoke.yml -- see the notes there.
name: dev-shots

on:
  push:
    branches: ["claude/**"]
    paths: ["src/mods/versions/**", ".github/workflows/dev-shots.yml"]
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated modules, or 'all'"
        default: "1.21.1"
      set:
        description: "design (Origin screens) or world (inside a fresh world: OriginDevWorld)"
        default: "design"
      label:
        description: "Optional name for this run's output (folder <module>[-world]-<label>), so parallel sessions don't overwrite each other"
        default: ""

permissions:
  contents: write

# Only runs that will actually take shots share a group: a push WITHOUT a
# [shots] tag still starts a (skipped) run, and in the shared group it would
# cancel the real run in progress. Hand-started runs are grouped by their own
# module list + set, so parallel sessions/agents shooting different modules
# never cancel each other.
concurrency:
  group: dev-shots-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}', github.event.inputs.modules, github.event.inputs.set, github.event.inputs.label) || contains(github.event.head_commit.message, '[shots') }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots')
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ github.event.inputs.modules }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          entries = json.load(open("src/mods/live-modules.json"))["modules"]
          live = [m["module"] for m in entries]
          java = {m["module"]: m.get("java", "21") for m in entries}
          raw = os.environ.get("INPUT") or ""
          if not raw:
              # A tag WITH a module list wins over a bare one wherever it sits: a
              # message may mention the bare tag in its prose too.
              tags = re.findall(r"\[shots(?::([^\]]+))?\]", os.environ.get("MSG", ""))
              listed = [t for t in tags if t]
              raw = listed[-1] if listed else "1.21.1"
          raw = raw.strip()
          # A module being ported can be shot before it goes live: any folder under
          # src/mods/versions/ is accepted by name (its Java = the module's own
          # options.release when it isn't in live-modules.json yet).
          def known(x):
              return x in live or os.path.isfile(f"src/mods/versions/{x}/build.gradle")
          def java_of(x):
              if x in java:
                  return java[x]
              m = re.search(r"options\.release\s*=\s*(\d+)", open(f"src/mods/versions/{x}/build.gradle").read())
              return "25" if m and int(m.group(1)) > 21 else "21"
          picked = live if raw == "all" else [x.strip() for x in raw.split(",") if known(x.strip())]
          picked = picked or ["1.21.1"]
          print("modules=" + json.dumps([{"module": x, "java": java_of(x)} for x in picked]))
          EOF

  shots:
    needs: plan
    name: Shots ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.modules) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Java 21 runs Gradle for every 1.x module (each cross-compiles via
      # options.release); 26.x needs a JDK 25 ("java" in live-modules.json).
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Headless GL deps (Xvfb + Mesa software rasterizer)
        run: |
          sudo apt-get update
          # libegl1/libegl-mesa0: 26.3's SDL3 window opens through EGL under Xvfb.
          # x11-xserver-utils (xrandr) + libXxf86vm/libXrandr: LWJGL 2 (1.8.9)
          # queries display modes through them at Display.create().
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libglu1-mesa libegl1 libegl-mesa0 \
            x11-xserver-utils libxxf86vm1 libxrandr2 libxcursor1 libxtst6

      - name: Boot ${{ matrix.module }} and capture the Origin screens
        working-directory: src/mods/versions/${{ matrix.module }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          # 26.3+ windows through SDL3, whose GLX visual request Xvfb + llvmpipe can't
          # meet ("Couldn't find matching GLX visual"); SDL's EGL path (Mesa EGL on
          # X11) creates the same OpenGL context. GLFW-era modules ignore both.
          SDL_VIDEO_X11_NODIRECTCOLOR: "1"
          SDL_VIDEO_FORCE_EGL: "1"
          ORIGIN_SHOTS: ${{ runner.temp }}/shots
          ORIGIN_SHOTS_SET: ${{ github.event.inputs.set || 'design' }}
        run: |
          chmod +x gradlew
          # The harness quits the game itself once every shot is taken. The whole
          # gradle + java tree runs in its own process group so a hang is killed
          # outright after 15 minutes (a plain `timeout` only reached xvfb-run and
          # left the game holding the log pipe open).
          setsid xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClient --no-daemon > run.log 2>&1 &
          pid=$!
          for i in $(seq 1 900); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill -- -$pid 2>/dev/null || true
          sleep 3
          kill -9 -- -$pid 2>/dev/null || true
          echo "--- last 120 log lines ---"
          tail -n 120 run.log
          echo "--- dev-shots lines ---"
          grep -F "[dev-shots]" run.log || echo "no dev-shots lines"
          echo "--- mixin failures (should be none) ---"
          grep -iE "Mixin apply(ing)? .*failed|Critical injection failure" run.log || echo "none"
          mkdir -p "$ORIGIN_SHOTS/screenshots"
          cp run.log "$ORIGIN_SHOTS/screenshots/run.log" || true
          ls -la "$ORIGIN_SHOTS/screenshots" || true

      - name: Keep the shots as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.module }}
          path: ${{ runner.temp }}/shots/screenshots/
          if-no-files-found: warn

  publish:
    needs: shots
    if: always() && needs.shots.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Collect every module's shots
        uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: ${{ runner.temp }}/pub

      - name: Publish to the claude/dev-shots branch
        env:
          SET: ${{ github.event.inputs.set || 'design' }}
          LABEL: ${{ github.event.inputs.label }}
        run: |
          pub="$RUNNER_TEMP/pub"
          mkdir -p "$pub"
          # Only THIS run's folders are replaced; every other module's latest shots
          # stay (several runs publish in parallel). Folder = module for the design
          # set, <module>-world for the world set; SOURCE.txt inside each says which
          # commit + run made it.
          suffix=""; [ "$SET" = "world" ] && suffix="-world"
          [ -n "$LABEL" ] && suffix="$suffix-$(printf '%s' "$LABEL" | tr -c 'A-Za-z0-9._-' '_')"
          url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/site"
            if git clone -q --depth 1 --branch claude/dev-shots "$url" "$RUNNER_TEMP/site" 2>/dev/null; then :; else
              mkdir -p "$RUNNER_TEMP/site" && git -C "$RUNNER_TEMP/site" init -q && git -C "$RUNNER_TEMP/site" checkout -q -b claude/dev-shots
            fi
            cd "$RUNNER_TEMP/site"
            git config user.name "origin-dev-shots"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for d in "$pub"/shots-*; do
              [ -d "$d" ] || continue
              m="$(basename "$d")"; m="${m#shots-}$suffix"
              rm -rf "$m"; cp -r "$d" "$m"
              printf 'source: %s\nrun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$m/SOURCE.txt"
            done
            printf 'last run: %s/%s/actions/runs/%s (%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > SOURCE.txt
            git add -A
            git commit -qm "dev shots ($SET) for ${GITHUB_SHA::7}" || true
            if git push -q "$url" HEAD:refs/heads/claude/dev-shots; then exit 0; fi
            cd "$RUNNER_TEMP"; sleep $((attempt * 5))
          done
          exit 1
