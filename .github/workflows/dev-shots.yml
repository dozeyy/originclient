# Dev shots: boot the real 1.21.1 client headlessly and capture the Origin
# screens (title, mod menu, a mod's settings page, HUD editor) at two window
# sizes, via the in-mod harness OriginDevShots (ORIGIN_SHOTS_SET=design).
#
# Why: the cloud sandbox Claude works in can't run Minecraft, so this is how a
# UI change gets LOOKED AT before it reaches Will. The PNGs are force-pushed to
# the `claude/dev-shots` branch (one orphan commit, latest run only) so a
# session can `git fetch` them, and attached to the run as an artifact.
#
# Runs on a push to a claude/** branch whose commit message contains [shots],
# or by hand (Run workflow). Software GL limits (Xvfb + llvmpipe, Sodium's GL
# 4.6 spoofed) are the same as boot-smoke.yml -- see the notes there.
name: dev-shots

on:
  push:
    branches: ["claude/**"]
    paths: ["src/mods/versions/1.21.1/**", ".github/workflows/dev-shots.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-shots
  cancel-in-progress: true

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Headless GL deps (Xvfb + Mesa software rasterizer)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libglu1-mesa

      - name: Boot 1.21.1 and capture the Origin screens
        working-directory: src/mods/versions/1.21.1
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          ORIGIN_SHOTS: ${{ runner.temp }}/shots
          ORIGIN_SHOTS_SET: design
        run: |
          chmod +x gradlew
          # The harness quits the game itself once every shot is taken.
          timeout 1200 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClient --no-daemon 2>&1 | tee run.log || true
          echo "--- mixin failures (should be none) ---"
          grep -iE "Mixin apply(ing)? .*failed|Critical injection failure" run.log || echo "none"
          ls -la "$ORIGIN_SHOTS/screenshots" || true

      - name: Keep the shots as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-shots
          path: ${{ runner.temp }}/shots/screenshots/*.png
          if-no-files-found: warn

      - name: Publish the shots to the claude/dev-shots branch
        env:
          SHOTS: ${{ runner.temp }}/shots/screenshots
        run: |
          [ -d "$SHOTS" ] && ls "$SHOTS"/*.png >/dev/null 2>&1 || { echo "no shots to publish"; exit 0; }
          pub="$RUNNER_TEMP/pub"
          mkdir -p "$pub"
          cp "$SHOTS"/*.png "$pub"/
          cp src/mods/versions/1.21.1/run.log "$pub"/run.log 2>/dev/null || true
          printf 'source: %s\nrun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$pub/SOURCE.txt"
          cd "$pub"
          git init -q
          git config user.name "origin-dev-shots"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "dev shots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/claude/dev-shots
