# Dev shots: boot the real client headlessly and capture the Origin screens
# (mod menu grid + list, a mod's page, Settings, the Right Shift screen) via
# each module's in-mod harness OriginDevShots (ORIGIN_SHOTS_SET=design).
#
# Why: the cloud sandbox Claude works in can't run Minecraft, so this is how a
# UI change gets LOOKED AT before it reaches Will. The PNGs are force-pushed to
# the `claude/dev-shots` branch (a fresh root commit per publish, no history; other
# runs' folders stay -- tools/ci/publish_shots.sh), one folder per module, so a session can `git fetch` them; also kept as artifacts.
#
# Which modules: put a tag in the commit message on a claude/** branch --
#   [shots]                -> 1.21.1
#   [shots:1.20,1.21.4]    -> those modules
#   [shots:all]            -> every live module (src/mods/live-modules.json)
# or run it by hand (Run workflow) with the same list in `modules`; `set: world`
# captures inside a fresh world instead (modules with OriginDevWorld); `label`
# names the output folders (<module>[-world]-<label>) so parallel runs stay apart;
# `video` (or [video] in the commit message) also films the run as loading.mp4.
# Software GL limits (Xvfb + llvmpipe, Sodium's GL 4.6 spoofed) are the same
# as boot-smoke.yml -- see the notes there.
# A job FAILS when it captured fewer PNGs than its set planned (tools/ci/check_shots.py).
# No Video Settings (Sodium) shot: the mod rail was removed on Will's call
# (2026-10-12, docs/memory-archive/), and only 1.21.1 has Sodium on the CI dev classpath --
# every other module loads it from a gitignored libs/ jar that CI doesn't have.
name: dev-shots

on:
  push:
    branches: ["claude/**"]
    paths: ["src/mods/versions/**", ".github/workflows/dev-shots.yml"]
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated modules, or 'all'"
        default: "1.21.1"
      set:
        description: "design (Origin screens) or world (inside a fresh world: OriginDevWorld); stepaside = a replaced mod's card/row/page with Freecam loaded (tools/frame-log/mods-<module>-stepaside.json; prodClient on 1.21.1, runClient elsewhere)"
        default: "design"
      style:
        description: "Button Style / Main Menu Style forced for the run (ORIGIN_SHOTS_STYLE): empty = the default (Origin), 'buttons' = Button Style Minecraft, 'menu' = Main Menu Style Vanilla, 'vanilla' = both. Use with set 'style' (Minecraft's own menus) or 'world' (pause menu)"
        default: ""
      label:
        description: "Optional name for this run's output (folder <module>[-world]-<label>), so parallel sessions don't overwrite each other"
        default: ""
      video:
        description: "Also film the run (boot, loading screen, menu, world entry) as loading.mp4 next to the shots"
        type: boolean
        default: false
      framelog:
        description: "Log loading -> main menu frame times (-PframeLog: [OriginFrameLog] lines + GC) into run.log; use with set 'handoff'"
        type: boolean
        default: false
      perf_mods:
        description: "Load the REAL pinned Sodium + Iris jars (tools/ci/perf_libs.py fetches them into libs/); use set 'perf' to shoot their screens"
        type: boolean
        default: true
      shaderpack:
        description: "Select a tiny shadow-pass shader pack (written into run/shaderpacks) so Iris loads PackShadowDirectives; proves IrisShadowDirectivesMixin applies. Use with set 'world'"
        type: boolean
        default: false
      shadow_distance:
        description: "With shaderpack: set the CI pack's shadowDistance (a const in shadow.fsh, the Iris half plane; Shader Performance Mode halves it). Empty = Iris default. Under the render distance, part of the shadow walk falls off the map (Off-Map Shadows run). A trailing s (e.g. 64s) also makes terrain and mobs sample the shadow map, so shots show real shadows (Half-Rate Shadows run)"
        type: string
        default: ""
      extra_mods:
        description: "Also load the pinned 'with mods' set (tools/frame-log/mods-<module>.json) on top of Origin's own"
        type: boolean
        default: false

# Read-only by default: the shots job runs the repo's Gradle build. Only the
# publish job (which runs no repo code) gets a write token.
permissions:
  contents: read

# Only runs that will actually take shots share a group: a push WITHOUT a
# [shots] tag still starts a (skipped) run, and in the shared group it would
# cancel the real run in progress. Hand-started runs are grouped by their own
# module list + set, so parallel sessions/agents shooting different modules
# never cancel each other. Pushes are grouped per BRANCH too: one group for every
# tagged push ("dev-shots-true") let another session's [shots] push on its own branch
# cancel this branch's run half way (2026-10-27, run 40472378806).
concurrency:
  group: dev-shots-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}-{3}', github.event.inputs.modules, github.event.inputs.set, github.event.inputs.label, github.event.inputs.style) || format('{0}-{1}', github.ref, contains(github.event.head_commit.message, '[shots')) }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots')
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ github.event.inputs.modules }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          entries = json.load(open("src/mods/live-modules.json"))["modules"]
          live = [m["module"] for m in entries]
          java = {m["module"]: m.get("java", "21") for m in entries}
          # "inworld": true = the design set ends with the in-world step (OriginDevWorld.inWorldTick).
          inworld = {m["module"] for m in entries if m.get("inworld")}
          raw = os.environ.get("INPUT") or ""
          if not raw:
              # A tag WITH a module list wins over a bare one wherever it sits.
              # Rule: a tag counts only at the END of a line (every real past use
              # is a subject/line suffix); prose like "(the [shots:x] tag)" is ignored.
              tags = re.findall(r"\[shots(?::([^\]]+))?\][ \t\r]*$", os.environ.get("MSG", ""), re.M)
              if not tags and os.environ.get("EVENT") != "workflow_dispatch":
                  # The cheap if: guard only sees a substring; a prose mention
                  # mid-line is not a tag. Plan nothing; shots/publish skip.
                  print("dev-shots: no end-of-line shots tag; nothing to shoot", file=sys.stderr)
                  print("modules=[]")
                  sys.exit(0)
              listed = [t for t in tags if t]
              raw = listed[-1] if listed else "1.21.1"
          raw = raw.strip()
          # A module being ported can be shot before it goes live: any folder under
          # src/mods/versions/ is accepted by name (its Java = the module's own
          # options.release when it isn't in live-modules.json yet).
          def known(x):
              return x in live or os.path.isfile(f"src/mods/versions/{x}/build.gradle")
          def java_of(x):
              if x in java:
                  return java[x]
              m = re.search(r"options\.release\s*=\s*(\d+)", open(f"src/mods/versions/{x}/build.gradle").read())
              return "25" if m and int(m.group(1)) > 21 else "21"
          picked = live if raw == "all" else [x.strip() for x in raw.split(",") if x.strip()]
          # A typo ([shots:1.21.l1]) must fail loudly, never quietly shoot some
          # other module and go green without testing the one that was asked for.
          unknown = [x for x in picked if not known(x)]
          if unknown or not picked:
              print(f"::error::dev-shots: unknown module(s) {unknown or raw!r}; expected names from src/mods/live-modules.json or src/mods/versions/", file=sys.stderr)
              sys.exit(1)
          print("modules=" + json.dumps([{"module": x, "java": java_of(x), "inworld": "1" if x in inworld else ""}
                                         for x in picked]))
          EOF

  shots:
    needs: plan
    # An empty matrix is an error in Actions: skip the job when nothing is planned.
    if: needs.plan.outputs.modules != '[]'
    name: Shots ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.modules) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Java 21 runs Gradle for every 1.x module (each cross-compiles via
      # options.release); 26.x needs a JDK 25 ("java" in live-modules.json).
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Headless GL deps (Xvfb + Mesa software rasterizer)
        run: |
          sudo apt-get update
          # libegl1/libegl-mesa0: 26.3's SDL3 window opens through EGL under Xvfb.
          # x11-xserver-utils (xrandr) + libXxf86vm/libXrandr: LWJGL 2 (1.8.9)
          # queries display modes through them at Display.create().
          # python3-pil: the contact sheet (tools/lean/contact_sheet.py) below.
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libglu1-mesa libegl1 libegl-mesa0 \
            x11-xserver-utils libxxf86vm1 libxrandr2 libxcursor1 libxtst6 python3-pil
          if [ "$VIDEO" = "true" ]; then sudo apt-get install -y ffmpeg x11-utils; fi
        env:
          VIDEO: ${{ github.event.inputs.video || contains(github.event.head_commit.message, '[video]') }}

      # Sodium + Iris for the dev run: every pre-1.21 module's build.gradle loads them from an
      # untracked libs/ folder CI never had, so these runs had neither and the @Pseudo Sodium/Iris
      # mixins found no target. The exact pins come from the module's build.gradle; each jar is
      # checked against Modrinth's sha512 (a mismatch fails the step); an unresolvable pin is
      # listed and skipped. Must run BEFORE Gradle (Loom checksums libs/ at configuration time).
      - name: Fetch pinned Sodium + Iris into libs/
        if: ${{ github.event.inputs.perf_mods != 'false' }}
        run: python3 tools/ci/perf_libs.py "src/mods/versions/${{ matrix.module }}"

      # Maven 429 / Loom :downloadAssets timeouts used to fail (or, with 0 shots,
      # falsely pass) jobs at random: fetch everything first, retried with backoff.
      - name: Download dependencies + assets (retried on Maven 429 / timeouts)
        run: bash tools/ci/gradle_prefetch.sh "src/mods/versions/${{ matrix.module }}"

      - name: Boot ${{ matrix.module }} and capture the Origin screens
        working-directory: src/mods/versions/${{ matrix.module }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          # 26.3+ windows through SDL3, whose GLX visual request Xvfb + llvmpipe can't
          # meet ("Couldn't find matching GLX visual"); SDL's EGL path (Mesa EGL on
          # X11) creates the same OpenGL context. GLFW-era modules ignore both.
          SDL_VIDEO_X11_NODIRECTCOLOR: "1"
          SDL_VIDEO_FORCE_EGL: "1"
          ORIGIN_SHOTS: ${{ runner.temp }}/shots
          ORIGIN_SHOTS_SET: ${{ github.event.inputs.set || 'design' }}
          ORIGIN_SHOTS_STYLE: ${{ github.event.inputs.style || '' }}
          # Design set only, modules flagged "inworld" in live-modules.json: after the screens, a flat world's
          # HUD + Mod Menu (inworld_*.png) and Save and Quit; "[origin-smoke] in-world: FAIL" fails check_shots.
          ORIGIN_INWORLD: ${{ matrix.inworld }}
          VIDEO: ${{ github.event.inputs.video || contains(github.event.head_commit.message, '[video]') }}
          FRAMELOG: ${{ github.event.inputs.framelog || 'false' }}
          EXTRA_MODS: ${{ github.event.inputs.extra_mods || 'false' }}
          SHADOW_DISTANCE: ${{ github.event.inputs.shadow_distance || '' }}
        run: |
          chmod +x gradlew
          mkdir -p "$ORIGIN_SHOTS/screenshots"
          # Frame-log runs: -PframeLog ([OriginFrameLog] lines + -Xlog:gc), a first
          # boot that lands on the title like a player's (no one-time accessibility
          # screen), and optionally the pinned "with mods" set loaded on top.
          gargs=""
          task=runClient
          rundir=run
          # set=stepaside: Origin stepping aside for a player's own mod (StepAside) needs a real
          # overlapping mod loaded -- the pinned mods-<module>-stepaside.json set (Freecam), CI only.
          pins="mods-${{ matrix.module }}.json"
          if [ "$ORIGIN_SHOTS_SET" = "stepaside" ]; then
            EXTRA_MODS=true
            pins="mods-${{ matrix.module }}-stepaside.json"
          fi
          if [ "$EXTRA_MODS" = "true" ]; then
            # A player's modded instance runs in production (intermediary names);
            # many big mods (Cobblemon) can't start in the Mojang-named dev game.
            # prodClient = the built jar + the set, in a production Fabric game (run-prod/).
            python3 "$GITHUB_WORKSPACE/tools/frame-log/fetch_mods.py" "$RUNNER_TEMP/extra-mods" \
              "$GITHUB_WORKSPACE/tools/frame-log/$pins"
            gargs="$gargs -PextraMods=$RUNNER_TEMP/extra-mods"
            # Only 1.21.1 registers prodClient. Every other module's runClient loads the same
            # -PextraMods folder through fabric.addMods (Loader remaps an intermediary jar at
            # launch; 26.x needs no remap), so its stepaside pins carry no Fabric API of their own.
            if grep -q 'register("prodClient"' build.gradle; then
              task=prodClient
              rundir=run-prod
            fi
          fi
          if [ "${{ github.event.inputs.perf_mods }}" != "false" ]; then
            # Mixin logs every "Mixing <mixin> from <config> into <target>" at INFO instead of DEBUG:
            # tools/ci/perf_log.py counts the Origin mixins that really applied to Sodium/Iris.
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dmixin.debug.verbose=true"
          fi
          if [ "${{ github.event.inputs.shaderpack }}" = "true" ]; then
            # Iris only loads PackShadowDirectives (and so only applies IrisShadowDirectivesMixin to it)
            # once a shader pack is active. A tiny shadow-pass pack, selected through Iris's own config,
            # makes that happen headlessly so the mixin's apply line can be read from run.log.
            sp="$rundir/shaderpacks/OriginCiPack/shaders"
            mkdir -p "$sp" "$rundir/config"
            printf '#version 120\nvoid main() { gl_Position = ftransform(); }\n' > "$sp/shadow.vsh"
            printf '#version 120\nvoid main() { gl_FragData[0] = vec4(1.0); }\n' > "$sp/shadow.fsh"
            sd="${SHADOW_DISTANCE%s}"
            case "$sd" in
              ''|*[!0-9]*) ;;
              *) printf 'const float shadowDistance = %s.0;\n' "$sd" >> "$sp/shadow.fsh" ;;
            esac
            printf '#version 120\nvarying vec2 uv;\nvoid main() { gl_Position = ftransform(); uv = gl_MultiTexCoord0.xy; }\n' > "$sp/gbuffers_basic.vsh"
            printf '#version 120\nvoid main() { gl_FragData[0] = vec4(1.0); }\n' > "$sp/gbuffers_basic.fsh"
            # Textured terrain/entities (Iris falls gbuffers_terrain back to gbuffers_textured), so world
            # shots show real blocks and the Smart Terrain Updates OFF/ON pixel diff compares terrain.
            printf '#version 120\nvarying vec2 uv;\nvarying vec4 col;\nvoid main() { gl_Position = ftransform(); uv = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy; col = gl_Color; }\n' > "$sp/gbuffers_textured.vsh"
            printf '#version 120\nuniform sampler2D texture;\nvarying vec2 uv;\nvarying vec4 col;\nvoid main() { vec4 c = texture2D(texture, uv) * col; if (c.a < 0.1) discard; gl_FragData[0] = c; }\n' > "$sp/gbuffers_textured.fsh"
            case "$SHADOW_DISTANCE" in
              *s)
                # Shadow-sampling variant: the textbook lookup (view -> player space -> shadowModelView ->
                # shadowProjection -> shadowtex0 depth compare); shadowed texels are drawn at half brightness.
                printf '#version 120\nuniform mat4 gbufferModelViewInverse;\nuniform mat4 shadowModelView;\nuniform mat4 shadowProjection;\nvarying vec2 uv;\nvarying vec4 col;\nvarying vec3 spos;\nvoid main() { gl_Position = ftransform(); uv = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy; col = gl_Color; vec4 pp = gbufferModelViewInverse * (gl_ModelViewMatrix * gl_Vertex); vec4 s = shadowProjection * (shadowModelView * pp); spos = s.xyz / s.w * 0.5 + 0.5; }\n' > "$sp/gbuffers_textured.vsh"
                printf '#version 120\nuniform sampler2D texture;\nuniform sampler2D shadowtex0;\nvarying vec2 uv;\nvarying vec4 col;\nvarying vec3 spos;\nvoid main() { vec4 c = texture2D(texture, uv) * col; if (c.a < 0.1) discard; float lit = 1.0; if (all(greaterThan(spos, vec3(0.0))) && all(lessThan(spos, vec3(1.0))) && spos.z - 0.002 > texture2D(shadowtex0, spos.xy).r) lit = 0.5; gl_FragData[0] = vec4(c.rgb * lit, c.a); }\n' > "$sp/gbuffers_textured.fsh"
                ;;
            esac
            # shadow.enabled=true: without it (and with no pass sampling shadowtex) Iris never builds a
            # ShadowRenderer, so no shadow pass runs at all (IrisRenderingPipeline, Iris 1.8.8).
            printf 'shadowMapResolution=1024\nshadowDistance=96\nshadow.enabled=true\n' > "$sp/shaders.properties"
            printf 'enableShaders=true\nshaderPack=OriginCiPack\n' > "$rundir/config/iris.properties"
          fi
          if [ "$FRAMELOG" = "true" ]; then
            gargs="$gargs -PframeLog"
            # A made-up launcher token (not a secret) so OriginHandoff prints its
            # "origin-handoff <token> hello|loading|ready" lines into run.log.
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dorigin.handoff=0123456789abcdef0123456789abcdef"
            mkdir -p "$rundir"
            [ -f "$rundir/options.txt" ] || printf 'onboardAccessibility:false\npauseOnLostFocus:false\n' > "$rundir/options.txt"
          fi
          # The harness quits the game itself once every shot is taken. The whole
          # gradle + java tree runs in its own process group so a hang is killed
          # outright after 15 minutes (a plain `timeout` only reached xvfb-run and
          # left the game holding the log pipe open).
          rec=""
          if [ "$VIDEO" = "true" ]; then
            # Filmed run: a fixed display ffmpeg can grab, and a first boot that
            # looks like a player's (full-size window, no one-time accessibility
            # screen, no auto-pause when Xvfb's window "loses focus").
            mkdir -p "$rundir"
            printf 'onboardAccessibility:false\npauseOnLostFocus:false\noverrideWidth:1920\noverrideHeight:1080\n' > "$rundir/options.txt"
            if [ "${{ matrix.module }}" = "1.8.9" ]; then
              # 1.8.9's startup load is FML's splash; players get it themed by the
              # launcher (Core/Loaders/ForgeSplashTheme.cs -- keep these values
              # identical, test_ci_gates.py checks), so the film shows that, not Forge red.
              mkdir -p "$rundir/config"
              printf 'enabled=true\nbackground=0x5A5A5A\nfont=0xF5F5F5\nbar=0xE0E0E0\nbarBorder=0x1E1E1E\nbarBackground=0x3A3A3A\n' > "$rundir/config/splash.properties"
            fi
            Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
            xvfb=$!
            export DISPLAY=:99
            sleep 2
            # Loom wraps runClient in its own `xvfb-run -a` (1280x1024, behind an
            # access cookie) whenever CI is set; unset it so the game opens on :99.
            setsid env -u CI ./gradlew $task --no-daemon $gargs > run.log 2>&1 &
            pid=$!
            # Start filming as the game opens its window, not during Gradle's compile.
            # The window-open line is per era: GLFW/SDL modules log "Backend library:
            # LWJGL version 3.x"; 1.8.9 (LWJGL 2 + Forge) never does -- it logs
            # "LWJGL Version: 2.9.4" right before Display.create (no film in run
            # 39267523866 until this). DISPLAY/XAUTHORITY come from the game process
            # itself when it can be found, so the film follows the game even if
            # Loom's xvfb wrapper ever comes back; else the :99 set above.
            ( for i in $(seq 1 600); do grep -qE "Backend library|LWJGL Version:" run.log 2>/dev/null && break; sleep 1; done
              game=$(pgrep -n -f devlaunchinjector || pgrep -n -f KnotClient || pgrep -n -f launchwrapper || true)
              if [ -n "$game" ]; then
                d=$(tr '\0' '\n' < /proc/$game/environ | sed -n 's/^DISPLAY=//p' || true)
                a=$(tr '\0' '\n' < /proc/$game/environ | sed -n 's/^XAUTHORITY=//p' || true)
                if [ -n "$d" ]; then export DISPLAY="$d"; fi
                if [ -n "$a" ]; then export XAUTHORITY="$a"; fi
              fi
              sleep 2
              size=$(xdpyinfo | awk '/dimensions:/{print $2; exit}')
              { echo "game pid $game DISPLAY=$DISPLAY XAUTHORITY=$XAUTHORITY size=$size"; ls -la /tmp/.X11-unix; xwininfo -root -tree; } > "$ORIGIN_SHOTS/screenshots/x-probe.txt" 2>&1
              exec ffmpeg -loglevel error -y -f x11grab -draw_mouse 0 -framerate 30 -video_size "${size:-1920x1080}" -i "$DISPLAY" -t 600 \
                -vf scale=1280:-2 -c:v libx264 -preset ultrafast -crf 26 -pix_fmt yuv420p \
                -movflags +frag_keyframe+empty_moov "$ORIGIN_SHOTS/screenshots/loading.mp4" ) &
            rec=$!
          else
            setsid xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew $task --no-daemon $gargs > run.log 2>&1 &
            pid=$!
          fi
          # A wedge leaves evidence: once run.log has been silent for 3 minutes, a thread dump of
          # the game JVM (tools/ci/thread_dump.sh); still silent at 7 minutes, a second dump (to
          # tell a deadlock from a slow step) and the tree is killed; a dump at the 15-minute
          # deadline too. No step of any module is silent that long (shots, in-world and FML/Fabric
          # boot all log every few seconds). Dumps print here and land beside the shots as .txt.
          quiet=0; size=-1; dumped=0
          for i in $(seq 1 900); do
            kill -0 $pid 2>/dev/null || break
            now=$(stat -c %s run.log 2>/dev/null || echo 0)
            if [ "$now" = "$size" ]; then quiet=$((quiet + 1)); else quiet=0; size=$now; fi
            if [ $quiet -eq 180 ] && [ $dumped -eq 0 ]; then
              echo "::warning title=game silent 180 s::run.log stopped growing; thread dump follows"
              bash "$GITHUB_WORKSPACE/tools/ci/thread_dump.sh" $pid "stalled 180s"; dumped=1
            fi
            if [ $quiet -ge 420 ]; then
              echo "::error title=game wedged::run.log silent for 420 s; second thread dump, then the run is killed"
              bash "$GITHUB_WORKSPACE/tools/ci/thread_dump.sh" $pid "stalled 420s"; dumped=2
              break
            fi
            sleep 1
          done
          if [ $dumped -lt 2 ] && kill -0 $pid 2>/dev/null; then
            bash "$GITHUB_WORKSPACE/tools/ci/thread_dump.sh" $pid "deadline 900s"
          fi
          kill -- -$pid 2>/dev/null || true
          sleep 3
          kill -9 -- -$pid 2>/dev/null || true
          if [ -n "$rec" ]; then
            # SIGINT lets ffmpeg finish the file; the fragmented mp4 plays even if it can't.
            kill -INT $rec 2>/dev/null || true
            for i in $(seq 1 15); do kill -0 $rec 2>/dev/null || break; sleep 1; done
            kill -9 $rec 2>/dev/null || true
            kill $xvfb 2>/dev/null || true
            ls -la "$ORIGIN_SHOTS/screenshots/loading.mp4" || echo "no video"
          fi
          echo "--- last 120 log lines ---"
          tail -n 120 run.log
          echo "--- dev-shots lines ---"
          grep -F "[dev-shots]" run.log || echo "no dev-shots lines"
          if [ "$FRAMELOG" = "true" ]; then
            echo "--- frame log (slow frames, marks, summary) ---"
            grep -F "[OriginFrameLog]" run.log | grep -v " trace " || echo "no frame-log lines"
            echo "--- mods loaded ---"
            grep -E "Loading [0-9]+ mods" run.log || true
          fi
          if grep -q "^Full thread dump" run.log; then
            echo "--- thread dump(s) the game wrote on SIGQUIT (thread_dump.sh fallback) ---"
            sed -n '/^Full thread dump/,/^JNI global/p' run.log
          fi
          echo "--- mixin failures (should be none) ---"
          grep -iE "Mixin apply(ing)? .*failed|Critical injection failure" run.log || echo "none"
          cp run.log "$ORIGIN_SHOTS/screenshots/run.log" || true
          ls -la "$ORIGIN_SHOTS/screenshots" || true

      # One small labelled image of every screen (_sheet.jpg): a session looks at
      # that first instead of opening every PNG (each image read stays in the
      # conversation for good — Claude Lean). Never fails the run.
      - name: Contact sheet
        if: always()
        run: python3 tools/lean/contact_sheet.py "${{ runner.temp }}/shots/screenshots" || true

      - name: Keep the shots as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.module }}
          path: ${{ runner.temp }}/shots/screenshots/
          if-no-files-found: warn

      # The gate: the job FAILS unless the harness printed "[dev-shots] done" and
      # every shot it planned is on disk (0 PNGs after a Maven 429 once went green).
      # Runs after the upload so a failed run's partial shots + run.log are kept.
      - name: Every planned shot captured
        run: |
          python3 tools/ci/check_shots.py "${{ runner.temp }}/shots/screenshots" \
            "${{ runner.temp }}/shots/screenshots/run.log" --module "${{ matrix.module }}"

      # The log gate: FAILS on any Mixin apply failure / InvalidInjection / Critical injection
      # failure (the inline grep above only prints "none" and never failed the job), requires
      # Sodium AND Iris in the mod list when they were supposed to be loaded, and prints how many
      # Origin Sodium/Iris mixins applied (a wrong @Pseudo target is a visibly low count).
      - name: Mixin failures + Sodium/Iris loaded gate
        if: always()
        run: |
          m="src/mods/versions/${{ matrix.module }}"
          req=""
          if [ "${{ github.event.inputs.perf_mods }}" != "false" ] && { ls "$m"/libs/sodium*.jar >/dev/null 2>&1 || { grep -q 'maven.modrinth:sodium' "$m/build.gradle" && grep -q 'maven.modrinth:iris' "$m/build.gradle"; }; }; then req="--require-loaded"; fi
          python3 tools/ci/perf_log.py "${{ runner.temp }}/shots/screenshots/run.log" --module "${{ matrix.module }}" --module-dir "$m" $req

  publish:
    needs: shots
    if: always() && needs.shots.result != 'skipped'
    runs-on: ubuntu-latest
    # Why this job is built the way it is (runs 39271223735, 39303597442, 39325641289):
    #   * one publisher at a time -- parallel runs raced ("fetch first" x5) and doubled the
    #     load on the one big branch. (GitHub keeps one pending run per group: a third
    #     queued publisher replaces the second; its shots stay in its run artifacts.)
    #   * the shots are pushed ONE MODULE PER PUSH (~110 MB). A 20-module run pushed as one
    #     ~2.2 GB commit got "HTTP 500 / curl 22" every time and then hit the timeout.
    #   * every publish is a fresh root commit holding the branch's current tree (forced,
    #     with --force-with-lease on the tip it started from), so the branch no longer
    #     accumulates history -- it had grown to ~10 GB / 614 folders.
    #   * artifacts are fetched one by one with retries, not all at once.
    # The logic lives in tools/ci/publish_shots.sh (tested in tools/ci/test_ci_gates.py).
    concurrency:
      group: dev-shots-publish
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Collect every module's shots (retried per artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pub="$RUNNER_TEMP/pub"; mkdir -p "$pub"
          listed=0
          for try in 1 2 3 4 5; do
            if all="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name')"; then listed=1; break; fi
            echo "artifact list failed (try $try)"; sleep $((try * 5))
          done
          # Only a SUCCESSFUL empty list is "nothing to publish"; a failed list must fail the job.
          [ "$listed" = 1 ] || { echo "::error::could not list this run's artifacts"; exit 1; }
          names="$(printf '%s\n' "$all" | grep '^shots-' | sort -u || true)"
          [ -n "$names" ] || { echo "no shots artifacts"; exit 0; }
          fail=0
          for n in $names; do
            ok=0
            for try in 1 2 3 4; do
              rm -rf "$pub/$n"
              if timeout 600 gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$n" -D "$pub/$n"; then ok=1; break; fi
              echo "download of $n failed (try $try)"; sleep $((try * 10))
            done
            [ "$ok" = 1 ] || { echo "::error::could not download $n"; fail=1; }
          done
          [ "$fail" = 0 ]

      - name: Publish to the claude/dev-shots branch
        env:
          SET: ${{ github.event.inputs.set || 'design' }}
          LABEL: ${{ github.event.inputs.label }}
        run: |
          # Folder = module for the design set, <module>-world for the world set, then
          # -<label>; SOURCE.txt inside each says which commit + run made it. Only THIS
          # run's folders are replaced; every other module's latest shots stay.
          suffix=""; [ "$SET" = "world" ] && suffix="-world"
          [ -n "$LABEL" ] && suffix="$suffix-$(printf '%s' "$LABEL" | tr -c 'A-Za-z0-9._-' '_')"
          export URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          export PUB="$RUNNER_TEMP/pub" SUFFIX="$suffix" SHA="$GITHUB_SHA" \
                 RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          bash tools/ci/publish_shots.sh
