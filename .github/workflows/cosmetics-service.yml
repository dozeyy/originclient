# The cosmetics service (services/cosmetics, a Cloudflare Worker: store payments
# through Stripe, ownership, Origin social). Tests run on every push/PR that
# touches it, or the store page's item list (a test checks the two agree). Deploys happen from main only,
# and only once Cloudflare is set up (docs/STORE.md -> Delivery service):
# repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, and the real D1
# database id in services/cosmetics/wrangler.toml. Until then the deploy job
# says so and skips instead of failing.
name: cosmetics-service

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "services/cosmetics/**"
      - "website/js/store.js"
      - ".github/workflows/cosmetics-service.yml"
  pull_request:
    paths:
      - "services/cosmetics/**"
      - "website/js/store.js"
      - ".github/workflows/cosmetics-service.yml"
  workflow_dispatch:

concurrency:
  group: cosmetics-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      # Tests use Node's built-in SQLite (node:sqlite, Node 22.13+).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        working-directory: services/cosmetics
        run: npm test
      # The tests sign with their own stand-in keys; this proves the same code
      # accepts REAL Mojang keys and a real Mojang-signed profile (GitHub can
      # reach Mojang, the Worker can't). Mojang being down only warns.
      - name: Check against real Mojang data
        working-directory: services/cosmetics
        run: node scripts/check-real-mojang.mjs

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Is Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] \
             || grep -q '00000000-0000-0000-0000-000000000000' services/cosmetics/wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cosmetics service not set up on Cloudflare yet (docs/STORE.md); skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Database changes first, then the code that relies on them.
      - name: Apply database migrations
        if: steps.ready.outputs.ready == 'true'
        working-directory: services/cosmetics
        run: npx --yes wrangler@4 d1 migrations apply origin-cosmetics --remote
      # Mojang's public keys, which sign-in checks signatures with (the Worker
      # can't fetch them: Mojang refuses Workers). Also refreshed weekly by
      # mojang-keys.yml. A failure keeps the keys already stored, so it warns
      # instead of blocking the deploy; the smoke test below shows the counts.
      - name: Store Mojang's public keys
        if: steps.ready.outputs.ready == 'true'
        continue-on-error: true
        working-directory: services/cosmetics
        run: bash scripts/store-mojang-keys.sh
      - name: Deploy Worker
        if: steps.ready.outputs.ready == 'true'
        working-directory: services/cosmetics
        run: npx --yes wrangler@4 deploy
      # Smoke test the live Worker (docs/STORE.md has the URL): the service answers,
      # the store price list loads ("open" turns true once the Stripe key is set),
      # the players-online count works, and the Worker holds Mojang's keys
      # (counts only); 0 keys means every friends sign-in gets "try again later".
      - name: Smoke test the live service
        if: steps.ready.outputs.ready == 'true'
        run: |
          base=https://origin-cosmetics.will-f11.workers.dev
          sleep 10
          for p in / /v1/store/catalog /v1/stats/online /v1/diag/keys; do
            echo "== GET $p"; curl -sS --max-time 20 "$base$p"; echo
          done
          curl -sS --max-time 20 "$base/v1/diag/keys" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          if not d.get("profile") or not d.get("certificate"):
              print("::warning::The service holds no Mojang keys (%s): friends sign-in will fail until the Store Mojang public keys step succeeds (re-run this workflow or mojang-keys.yml)." % d)
          '
