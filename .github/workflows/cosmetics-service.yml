# The cosmetics delivery service (services/cosmetics, a Cloudflare Worker).
# Tests run on every push/PR that touches it. Deploys happen from main only,
# and only once Cloudflare is set up (docs/STORE.md -> Delivery service):
# repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, and the real D1
# database id in services/cosmetics/wrangler.toml. Until then the deploy job
# says so and skips instead of failing.
name: cosmetics-service

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "services/cosmetics/**"
      - ".github/workflows/cosmetics-service.yml"
  pull_request:
    paths:
      - "services/cosmetics/**"
      - ".github/workflows/cosmetics-service.yml"
  workflow_dispatch:

concurrency:
  group: cosmetics-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      # Tests use Node's built-in SQLite (node:sqlite, Node 22.13+).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        working-directory: services/cosmetics
        run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Is Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] \
             || grep -q '00000000-0000-0000-0000-000000000000' services/cosmetics/wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cosmetics service not set up on Cloudflare yet (docs/STORE.md); skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Database changes first, then the code that relies on them.
      - name: Apply database migrations
        if: steps.ready.outputs.ready == 'true'
        working-directory: services/cosmetics
        run: npx --yes wrangler@4 d1 migrations apply origin-cosmetics --remote
      - name: Deploy Worker
        if: steps.ready.outputs.ready == 'true'
        working-directory: services/cosmetics
        run: npx --yes wrangler@4 deploy
      # Smoke test the live Worker (docs/STORE.md has the URL): the service answers,
      # the players-online count works, and Mojang's sign-in check is reachable
      # FROM the Worker (hasJoined must say 204 for a join nobody made; 403/429
      # means Mojang refuses the Worker and friends sign-in will fail).
      - name: Smoke test the live service
        if: steps.ready.outputs.ready == 'true'
        run: |
          base=https://origin-cosmetics.will-f11.workers.dev
          sleep 10
          for p in / /v1/stats/online /v1/diag/mojang; do
            echo "== GET $p"; curl -sS --max-time 20 "$base$p"; echo
          done
          curl -sS --max-time 20 "$base/v1/diag/mojang" | grep -q '"hasJoined":{"status":204' \
            || echo "::warning::Mojang's sign-in check is not answering the Worker normally — friends sign-in will fail (see the diag output above)."
