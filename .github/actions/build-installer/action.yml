# Builds OriginLauncher-Setup.exe (the custom Origin installer, src/OriginSetup)
# and the launcher zip, then PROVES them on this Windows runner.
#
# The setup app is small: it DOWNLOADS the newest released launcher zip while
# it installs. The zip it downloads is the one built here
# (OriginLauncher-win-x64.zip — also every installed launcher's self-update),
# so this action makes both.
#
# Smoke test, end to end:
#  1. Silent install with NO --source: the real download path (release feed,
#     HTTPS, progress, verify, unpack) installing the newest PUBLISHED release
#     into a fresh folder — this build isn't published yet, so it can't be
#     the one downloaded.
#  2. Silent install of the zip built here (--source) over that install — the
#     update-in-place path — then checks everything it should leave (files
#     byte-identical to publish/, uninstaller, Add/Remove Programs entry,
#     Start-menu + desktop shortcuts, Start-with-Windows).
#  3. Silent uninstall, and a check that all of it is gone again.
#
# Shared by build-check.yml and launcher-release.yml, so a broken installer
# can never reach players. Expects publish/ from .github/actions/publish-launcher.
# Output at the repo root: OriginLauncher-Setup.exe + OriginLauncher-win-x64.zip.
name: Build installer
description: Build OriginSetup and the launcher zip, smoke-test download, install, update and uninstall.

inputs:
  version:
    description: Version stamped on the setup app ("1.0.40"). Empty = 1.0.0.
    default: ""
  screenshots:
    description: Also render every installer/uninstaller screen to PNGs (artifact "installer-screens").
    default: "false"

runs:
  using: composite
  steps:
    - name: Build setup app (.NET Framework 4.7.2)
      shell: pwsh
      run: |
        $v = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "1.0.0" }
        dotnet build src/OriginSetup/OriginSetup.csproj -c Release "-p:Version=$v" -o setup-bin
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item setup-bin/OriginSetup.exe OriginLauncher-Setup.exe -Force
        $mb = (Get-Item OriginLauncher-Setup.exe).Length / 1MB
        # It downloads the launcher; anything big means something got bundled by mistake.
        if ($mb -gt 5) { Write-Host "::error::OriginLauncher-Setup.exe is $([math]::Round($mb, 1)) MB - expected about 1 MB"; exit 1 }
        Write-Host "OriginLauncher-Setup.exe: $([math]::Round($mb, 2)) MB"

    # The launcher package: what Setup downloads and what installed launchers
    # self-update from (Core/Updates/UpdateService.cs). The asset name never changes.
    - name: Zip launcher package
      shell: pwsh
      run: |
        Remove-Item OriginLauncher-win-x64.zip -ErrorAction SilentlyContinue
        Compress-Archive -Path publish\* -DestinationPath OriginLauncher-win-x64.zip
        Write-Host "OriginLauncher-win-x64.zip: $([math]::Round((Get-Item OriginLauncher-win-x64.zip).Length / 1MB, 1)) MB"

    # Pictures of every screen (nothing is installed or downloaded) — the UI review.
    - name: Render installer screens
      if: inputs.screenshots == 'true'
      shell: pwsh
      run: |
        $p = Start-Process .\OriginLauncher-Setup.exe -ArgumentList '--render-tour installer-screens' -Wait -PassThru
        $shots = @(Get-ChildItem installer-screens -Filter *.png -ErrorAction SilentlyContinue)
        if ($p.ExitCode -ne 0 -or $shots.Count -lt 12) {
          Write-Host "::error::Screen render failed (exit $($p.ExitCode), $($shots.Count) images)"
          if (Test-Path "$env:TEMP\OriginSetup.log") { Get-Content "$env:TEMP\OriginSetup.log" }
          exit 1
        }
        Write-Host "Rendered $($shots.Count) screens."

    - name: Upload installer screens
      if: inputs.screenshots == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: installer-screens
        path: installer-screens
        retention-days: 14

    - name: Smoke test — download install, update from this build, uninstall
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        function Fail($why) {
          Write-Host "::error::Installer smoke test: $why"
          if (Test-Path "$env:TEMP\OriginSetup.log") { Get-Content "$env:TEMP\OriginSetup.log" }
          exit 1
        }
        $dir = Join-Path $env:RUNNER_TEMP 'Origin Smoke Test'   # a space, to prove quoting
        $zip = (Resolve-Path .\OriginLauncher-win-x64.zip).Path
        $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7E9C1A54-2C3B-4E7A-9C1D-0A1B2C3D4E5F}_is1'
        $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
        $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Origin Launcher.lnk'
        $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Origin Launcher.lnk'

        # 1. What a player gets: download the newest published release.
        $p = Start-Process .\OriginLauncher-Setup.exe -ArgumentList "--silent --dir `"$dir`"" -Wait -PassThru
        if ($p.ExitCode -ne 0) { Fail "download install exited $($p.ExitCode)" }
        if (-not (Test-Path "$dir\OriginLauncher.App.exe")) { Fail 'download install left no launcher' }
        $downloaded = (Get-ItemProperty $uninstallKey -ErrorAction SilentlyContinue).DisplayVersion
        Get-Content "$env:TEMP\OriginSetup.log" | Select-String 'release feed|download' | ForEach-Object { Write-Host $_.Line }
        Write-Host "Download install verified: published release $downloaded."

        # 2. This build, over it (the update path), from the zip built above.
        $p = Start-Process .\OriginLauncher-Setup.exe -ArgumentList "--silent --dir `"$dir`" --start-with-windows --source `"$zip`"" -Wait -PassThru
        if ($p.ExitCode -ne 0) { Fail "install from this build's zip exited $($p.ExitCode)" }

        # Every published file landed, byte for byte.
        $published = Get-ChildItem publish -Recurse -File
        foreach ($f in $published) {
          $rel = $f.FullName.Substring((Resolve-Path publish).Path.Length).TrimStart('\')
          $installed = Join-Path $dir $rel
          if (-not (Test-Path $installed)) { Fail "missing after install: $rel" }
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash $f.FullName).Hash) { Fail "content differs: $rel" }
        }
        if (-not (Test-Path "$dir\uninstall.exe")) { Fail 'uninstall.exe missing' }
        if ((Get-FileHash "$dir\uninstall.exe").Hash -ne (Get-FileHash .\OriginLauncher-Setup.exe).Hash) { Fail 'uninstall.exe is not a copy of setup' }
        if (Test-Path "$dir\_setup-staging") { Fail 'staging folder left behind' }

        $entry = Get-ItemProperty $uninstallKey -ErrorAction SilentlyContinue
        if (-not $entry) { Fail 'no Add/Remove Programs entry' }
        if ($entry.InstallLocation -ne "$dir\") { Fail "InstallLocation is '$($entry.InstallLocation)'" }
        if ($entry.UninstallString -notlike '*uninstall.exe*--uninstall*') { Fail "UninstallString is '$($entry.UninstallString)'" }
        if (-not ((Get-ItemProperty $runKey).'Origin Launcher' -like "*$dir*")) { Fail 'Start with Windows not set' }
        if (-not (Test-Path $startMenu)) { Fail 'no Start menu shortcut' }
        if (-not (Test-Path $desktop)) { Fail 'no desktop shortcut' }
        Write-Host "Install verified: $($published.Count) files (version $($entry.DisplayVersion)), registry entry, shortcuts, startup."

        # 3. Uninstall exactly the way Add/Remove Programs' quiet uninstall does.
        Start-Process "$dir\uninstall.exe" -ArgumentList '--uninstall --silent' -Wait
        # The uninstaller hands off to a %TEMP% copy (it can't delete its own folder) — wait for that.
        $deadline = (Get-Date).AddSeconds(90)
        while ((Test-Path $dir) -or (Test-Path $uninstallKey)) {
          if ((Get-Date) -gt $deadline) { Fail 'uninstall did not finish within 90s' }
          Start-Sleep -Milliseconds 500
        }
        if (Test-Path $startMenu) { Fail 'Start menu shortcut left behind' }
        if (Test-Path $desktop) { Fail 'desktop shortcut left behind' }
        if ((Get-ItemProperty $runKey).'Origin Launcher') { Fail 'Start with Windows left behind' }
        Write-Host "Uninstall verified: folder, registry entry, shortcuts and startup entry removed."
